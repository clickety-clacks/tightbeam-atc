<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tightbeam — Air Traffic Control</title>
<style>
  /* CSS is the single source of geometry: it sizes the canvas box and the
     renderer matches its buffer to the measured box, so the two cannot
     disagree. html carries the background so a light theme shows no gutter. */
  html { background:#101214; }
  html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family: ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif; }
  body { position:relative; background:#101214; }
  canvas { display:block; position:absolute; inset:0; width:100%; height:100%; z-index:0; }
  /* visionOS derives its privacy-preserving gaze highlight from interactive
     DOM regions. These buttons track only lit canvas nodes and relay their
     Pointer Events to the canvas, so they add no second activation path. */
  #spatialtargets { display:none; position:fixed; inset:0; z-index:4; pointer-events:none; }
  #spatialtargets .spatial-target { position:absolute; transform:translate(-50%,-50%);
    margin:0; padding:0; border:0; border-radius:50%; background:#00000001;
    color:transparent; pointer-events:auto; touch-action:none;
    -webkit-appearance:none; appearance:none; cursor:pointer; }
  /* one top bar owns the top edge; children never position themselves */
  #topbar { position:fixed; top:0; left:0; right:0; z-index:6; display:flex;
    flex-wrap:wrap; align-items:flex-start; justify-content:space-between;
    gap:8px 10px; pointer-events:none; box-sizing:border-box;
    padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
            14px calc(18px + env(safe-area-inset-left)); }
  #topleft { display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    flex:0 1 auto; min-width:0; max-width:60%; }
  #topright { display:flex; flex-direction:column; align-items:flex-end; gap:8px;
    flex:0 1 auto; min-width:0; max-width:100%; }
  #hud { color:#9a9ea6; font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    background:#101214e6; border:1px solid #2a2d31; border-radius:5px; padding:7px 11px;
    /* only as wide as what it says */
    flex:0 0 auto; align-self:flex-start; width:max-content; max-width:100%;
    box-sizing:border-box; overflow-wrap:anywhere; }
  #hud b { color:#b08d57; font-weight:600; }
  /* Which layers are in force, outermost first, so the nesting is readable at
     a glance and the one that decides what you are looking at is obvious. */
  /* Which layers are in force sits with the legend at the bottom left: it
     describes what you are looking at, which is the legend's job, and the top
     left is for what this thing IS. */
  #stack { position:fixed; z-index:6; display:flex; gap:6px; flex-wrap:wrap;
    left:calc(18px + env(safe-area-inset-left));
    bottom:calc(14px + env(safe-area-inset-bottom));
    max-width:min(70vw, 900px); pointer-events:none; }
  #stack:empty { display:none; }
  body.has-legend #stack { bottom:calc(14px + env(safe-area-inset-bottom) + var(--legend-h, 0px) + 8px); }
  #stack .chip { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    border-radius:5px; padding:5px 9px; border:1px solid currentColor;
    background:#101214e6; display:inline-flex; align-items:center; gap:6px;
    opacity:.62; }
  #stack .chip.on { opacity:1; }              /* the layer that is rendering */
  #stack .chip .dot { width:6px; height:6px; border-radius:50%;
    border:1px solid currentColor; }
  #stack .chip.on .dot { background:currentColor; }
  #stack .chip b { color:inherit; font-weight:700; }
  body.light #stack .chip { background:#f2eee2e8; }
  #layercards { position:fixed; z-index:9; left:calc(18px + env(safe-area-inset-left));
    top:50%; transform:translateY(-50%); display:flex; flex-direction:column;
    align-items:stretch; gap:5px; pointer-events:auto; }
  #layercards button { min-width:104px; box-sizing:border-box; cursor:pointer;
    color:#9a9ea6; background:#101214e6; border:1px solid #2a2d31;
    border-radius:5px; padding:6px 9px; font:600 10px/1.15 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.08em; text-align:left; text-transform:uppercase; white-space:nowrap; }
  #layercards button::before { content:''; display:inline-block; width:6px; height:6px;
    margin-right:7px; border:1px solid currentColor; border-radius:50%; vertical-align:1px; }
  #layercards button[aria-pressed="true"] { color:#d8d6d1; }
  #layercards button[aria-pressed="true"]::before { background:currentColor; }
  #layercards button[aria-pressed="false"] { opacity:.48; }
  #layercards button:hover { border-color:#5c626b; }
  body.light #layercards button { color:#5c6b78; background:#f2eee2e8; border-color:#c3cdd8; }
  body.light #layercards button[aria-pressed="true"] { color:#26323c; }
  body.light #layercards button:hover { border-color:#8a97a3; }
  /* The pile of searches that have been run. Newest on top, because that is
     the one most likely to be wanted back. */
  /* The top bar ignores the mouse so the scene can be orbited through it, and
     anything meant to be clicked has to opt back in. Without this the cards
     looked interactive and were not: clicks fell through to the canvas, where
     they read as background clicks and popped a layer — which is exactly what
     "the x does nothing and the display jitters" was. */
  #cards { display:flex; flex-direction:column; gap:4px; align-items:flex-end;
    max-height:34vh; overflow-y:auto; pointer-events:auto; }
  #cards:empty { display:none; }
  #cards .card { display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:#9a9ea6; background:#101214e6; border:1px solid #2a2d31;
    border-left:3px solid #4bb8b8; border-radius:5px; padding:5px 8px; max-width:100%; }
  #cards .card:hover { border-color:#4bb8b8; }
  #cards .card.on { color:#4bb8b8; border-color:#4bb8b8; }
  #cards .card .n { color:#7c8188; }
  #cards .card .who { color:#7c8188; text-transform:none; letter-spacing:.04em; }
  #cards .card .x { color:#7c8188; padding:0 2px; border-radius:3px; }
  #cards .card .x:hover { color:#e0685c; }
  #cards .card button { border:0; background:transparent; color:inherit; font:inherit;
    letter-spacing:inherit; text-transform:inherit; cursor:pointer; }
  #cards .card .rename { display:none; }
  #cards .card .term { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:22ch; }
  #cards .card input.name { font:inherit; letter-spacing:inherit; text-transform:none;
    color:inherit; background:transparent; border:none; outline:none; width:20ch; }
  body.light #cards .card { color:#5c6b78; background:#f2eee2e8; border-color:#c3cdd8;
    border-left-color:#1f7a7a; }
  body.light #cards .card.on { color:#1f7a7a; border-color:#1f7a7a; }
  #hud .live { color:#6fae4e; } #hud .sample { color:#c9a835; }
  /* the bottom bar spans both edges, so it can never run off either side */
  #legend { position:fixed; z-index:6;
    bottom:calc(14px + env(safe-area-inset-bottom));
    left:calc(18px + env(safe-area-inset-left)); right:calc(18px + env(safe-area-inset-right));
    color:#7c8188; font-size:11px; line-height:1.9; pointer-events:none;
    background:#101214e6; border:1px solid #2a2d31; border-radius:5px;
    padding:8px 12px; box-sizing:border-box; max-height:32dvh; overflow:auto;
    scrollbar-width:thin; }
  #legend.collapsed { display:none; }
  @supports not (max-height: 1dvh){ #legend { max-height:32vh; } }
  .sw { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  #tip { position:fixed; display:none; background:#1b1e22ee; color:#d8d6d1;
    border:1px solid #3a3d42; border-left:3px solid #b08d57; border-radius:4px;
    padding:8px 12px; font-size:12.5px; line-height:1.5; pointer-events:none;
    max-width:min(320px, calc(100vw - 24px)); box-sizing:border-box; z-index:8;
    overflow-wrap:anywhere; }
  #tip .t { color:#b08d57; font-weight:600; }
  /* Hovering can find several nodes stacked along the same line of sight. Each
     gets its own card, and a dotted leader says which card belongs to which
     node — without that the cards are just a pile of facts about nothing in
     particular. */
  #hovercards { position:fixed; inset:0; pointer-events:none; z-index:8; }
  #hovercards .hc { position:absolute; background:#1b1e22f2; color:#d8d6d1;
    border:1px solid #3a3d42; border-left:3px solid #b08d57; border-radius:4px;
    padding:7px 11px; font-size:12.5px; line-height:1.5;
    width:min(300px, calc(100vw - 24px)); box-sizing:border-box;
    overflow-wrap:anywhere; }
  #hovercards .hc .t { color:#b08d57; font-weight:600; }
  #hovercards .hc .k { color:#7c8188; text-transform:uppercase; letter-spacing:.12em;
    font-size:9.5px; display:block; margin:6px 0 2px; }
  #hovercards .hc .seg { color:#9a9ea6; font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  /* an svg is a replaced element: inset:0 alone leaves it at its intrinsic
     300x150 in the corner, silently clipping every leader that goes further */
  #leaders { position:fixed; left:0; top:0; width:100%; height:100%;
    pointer-events:none; z-index:7; overflow:visible; }
  #leaders line { stroke:#b08d57; stroke-width:1.2; stroke-dasharray:3 4; opacity:.85; }
  #leaders circle { fill:#b08d57; }
  body.light #hovercards .hc { background:#faf7eef5; color:#26323c;
    border-color:#b8c7d9; border-left-color:#c23b22; }
  body.light #hovercards .hc .t { color:#c23b22; }
  body.light #hovercards .hc .seg { color:#5c6b78; }
  body.light #leaders line, body.light #leaders circle { stroke:#c23b22; fill:#c23b22; }
  #tip .seg { color:#9a9ea6; font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  #themehint { color:#7c8188; font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; background:#101214e6; border:1px solid #2a2d31;
    border-radius:5px; padding:6px 10px; pointer-events:none; max-width:100%;
    box-sizing:border-box; overflow-wrap:anywhere; }
  #inputavailability { color:#e0685c; }
  body.light { background:#f2eee2; }
  html:has(body.light) { background:#f2eee2; }
  body.light #hud { color:#5c6b78; background:#f2eee2e8; border-color:#c3cdd8; } body.light #hud b { color:#c23b22; }
  body.light #hud .live { color:#2e7d5b; } body.light #hud .sample { color:#c9a227; }
  body.light #legend { color:#5c6b78; background:#f2eee2e8; border-color:#c3cdd8; }
  body.light #tip { background:#faf7eeee; color:#26323c; border-color:#b8c7d9; border-left-color:#c23b22; }
  body.light #tip .t { color:#c23b22; } body.light #tip .seg { color:#5c6b78; }
  body.light #themehint { color:#8a97a3; background:#f2eee2e8; border-color:#c3cdd8; }
  @media (max-width: 1150px){ #hud .title { display:none; } }
  @media (max-width: 760px){
    #legend { font-size:10px; line-height:1.7; }
    #hud, #themehint, #selui { letter-spacing:.08em; font-size:10px; }
    #layercards { left:calc(10px + env(safe-area-inset-left)); gap:3px; }
    #layercards button { min-width:94px; padding:5px 7px; font-size:9px; }
  }

  /* Hovering shows a transient card; focusing one node promotes the same
     content to a pane that owns the right edge — or the bottom in portrait,
     where horizontal room is the scarce thing. */
  #detail { position:fixed; z-index:7; display:none; box-sizing:border-box;
    top:76px; right:18px; width:min(400px, 36vw); max-height:calc(100vh - 120px);
    /* the pane never trims: it scrolls, and the scroll stays inside it */
    overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    scrollbar-width:thin; overflow-wrap:anywhere;
    background:#1b1e22f2; border:1px solid #3a3d42;
    border-left:3px solid #b08d57; border-radius:5px; padding:12px 14px;
    color:#d8d6d1; font-size:12.5px; line-height:1.55; }
  #detail .t { color:#b08d57; font-weight:650; font-size:13px; display:block; margin-bottom:6px; }
  #detail .seg { color:#9a9ea6; font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  #detail .k { color:#7c8188; text-transform:uppercase; letter-spacing:.12em;
    font-size:9.5px; display:block; margin:10px 0 3px; }
  body.light #detail { background:#faf7eef7; border-color:#b8c7d9;
    border-left-color:#c23b22; color:#26323c; }
  body.light #detail .t { color:#c23b22; }
  body.light #detail .seg, body.light #detail .k { color:#5c6b78; }
  @media (max-aspect-ratio: 1/1){
    #detail { top:auto; left:18px; right:18px; width:auto;
      bottom:calc(14px + env(safe-area-inset-bottom)); max-height:46vh; }
  }
  /* five lines then an ellipsis — never a silent trim */
  .clamp5 { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  #tagbox { position:fixed; z-index:7; display:none; background:#1b1e22f2;
    border:1px solid #3a3d42; border-left:3px solid #b08d57; border-radius:5px;
    padding:9px 11px; color:#9a9ea6; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; max-width:min(300px, calc(100vw - 36px));
    box-sizing:border-box; }
  #tagbox input { display:block; margin-top:6px; width:100%; box-sizing:border-box;
    background:#101214; border:1px solid #3a3d42; border-radius:3px; color:#d8d6d1;
    padding:5px 7px; font-size:12px; font-family:inherit; letter-spacing:0;
    text-transform:none; }
  #tagbox .who { color:#b08d57; }
  #tagswatches { display:flex; gap:5px; margin-top:7px; }
  #tagswatches button { width:15px; height:15px; border-radius:50%; padding:0;
    border:1.5px solid transparent; cursor:pointer; }
  #tagswatches button.on { border-color:#d8d6d1; }
  body.light #tagswatches button.on { border-color:#26323c; }
  body.light #tagbox { background:#faf7eef2; border-color:#b8c7d9; border-left-color:#c23b22; color:#5c6b78; }
  body.light #tagbox input { background:#fff; border-color:#b8c7d9; color:#26323c; }
  body.light #tagbox .who { color:#c23b22; }
  #searchwrap { display:flex; align-items:center; gap:7px; pointer-events:auto;
    background:#101214e6; border:1px solid #2a2d31; border-radius:5px;
    padding:5px 8px; box-sizing:border-box; max-width:100%; }
  #search { background:transparent; border:0; outline:0; color:#d8d6d1;
    font-family:inherit; font-size:12px; width:min(240px, 40vw); padding:2px 0; }
  #search::placeholder { color:#6b7077; }
  #searchpill { display:none; font-size:9.5px; letter-spacing:.1em;
    text-transform:uppercase; color:#101214; background:#5aa9e6;
    border-radius:3px; padding:2px 6px; white-space:nowrap; }
  #searchcount { font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:#7c8188; white-space:nowrap; }
  #searchclear { display:none; flex:0 0 auto; width:15px; height:15px;
    border-radius:50%; border:0; padding:0; cursor:pointer; line-height:15px;
    text-align:center; font-size:11px; font-family:inherit;
    background:#3a3d42; color:#d8d6d1; pointer-events:auto; }
  #searchclear:hover { background:#4c5158; }
  body.light #searchclear { background:#c3cdd8; color:#26323c; }
  body.light #searchclear:hover { background:#aab8c6; }
  body.light #searchwrap { background:#f2eee2e8; border-color:#c3cdd8; }
  body.light #search { color:#26323c; }
  body.light #searchpill { background:#2f6fb5; color:#fff; }
  body.light #searchcount { color:#5c6b78; }
  #selcursor { position:fixed; border:1.5px solid #b08d57; border-radius:50%;
    pointer-events:none; display:none; transform:translate(-50%,-50%); z-index:5;
    box-shadow:0 0 0 1px rgba(0,0,0,.25) inset; }
  #selcursor.unsel { border-color:#c4453c; border-style:dashed; }
  body.light #selcursor { border-color:#c23b22; }
  #selui { pointer-events:none; box-sizing:border-box; max-width:100%;
    background:#1b1e22dd; border:1px solid #3a3d42; border-radius:5px;
    padding:8px 11px; color:#9a9ea6; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; }
  #selui input { width:min(130px, 26vw); vertical-align:middle; pointer-events:auto; }
  #selui.off { display:none; }
  #selui b { color:#b08d57; }
  body.light #selui { background:#faf7eeee; border-color:#b8c7d9; color:#5c6b78; }
  body.light #selui b { color:#c23b22; }
  #touchcontrols { display:none; }
  @media (hover:none) and (pointer:coarse){
    #spatialtargets { display:block; }
    #touchcontrols { position:fixed; z-index:10; display:flex; flex-wrap:wrap;
      justify-content:flex-end; gap:8px; right:calc(10px + env(safe-area-inset-right));
      bottom:calc(10px + env(safe-area-inset-bottom)); max-width:min(370px, calc(100vw - 20px)); }
    #touchcontrols button, #layercards button, #cards .card button, #searchclear,
    #tagswatches button { min-width:60px; min-height:60px; box-sizing:border-box; }
    #searchwrap, #search { min-height:60px; box-sizing:border-box; }
    #touchcontrols button { color:#d8d6d1; background:#101214e6; border:1px solid #3a3d42;
      border-radius:8px; padding:8px; font:600 11px/1.15 ui-sans-serif,-apple-system,
      "Helvetica Neue",Arial,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
    body.light #touchcontrols button { color:#26323c; background:#f2eee2e8; border-color:#b8c7d9; }
    #cards .card .rename { display:inline-block; }
    #cards .card { min-height:60px; }
  }
</style>
</head>
<body>
<div id="topbar">
  <div id="topleft">
    <div id="hud"><span class="title"><b>Tightbeam</b> · air traffic control · </span><span id="mode" class="sample">connecting…</span></div>
    <div id="themehint">/ search · S select · T theme · L legend · C clear notes<span id="inputavailability"></span></div>
  </div>
  <div id="topright">
    <div id="searchwrap">
      <span id="searchpill">agent search</span>
      <input id="search" type="text" placeholder="filter — press / to search" autocomplete="off">
      <span id="searchcount"></span>
      <button id="searchclear" title="clear" aria-label="clear search">×</button>
    </div>
    <div id="cards"></div>
    <div id="selui" class="off">select radius <input id="selrad" type="range" min="8" max="220" value="46"> <b><span id="selradv">46</span>px</b> · <span id="selcount">0</span> sel · [ ] size · f fit · d clear</div>
  </div>
</div>
<div id="stack"></div>
<div id="layercards" role="group" aria-label="Map layers"></div>
<div id="touchcontrols" role="group" aria-label="Touch controls">
  <button type="button" data-action="select" aria-pressed="false">Select</button>
  <button type="button" data-action="fit">Fit</button>
  <button type="button" data-action="clear">Clear selection</button>
  <button type="button" data-action="theme">Theme</button>
  <button type="button" data-action="legend">Legend</button>
</div>
<div id="legend"></div>
<div id="tip"></div>
<svg id="leaders"></svg>
<div id="hovercards"></div>
<div id="spatialtargets" aria-label="Interactive nodes"></div>
<div id="detail"></div>
<div id="tagbox">tag <span class="who"></span><input id="taginput" type="text"
  placeholder="type a note, enter to attach" maxlength="80"><div id="tagswatches"></div></div>
<div id="selcursor"></div>
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './addons/controls/OrbitControls.js';
import { LineSegments2 } from './addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from './addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from './addons/lines/LineMaterial.js';
const edgeMats = new Set();
let searchTimer = null;      /* declared here so setFilter, above the box, can cancel it */
const TETHER_SEGS = 40;   /* subdivisions per tether, for the traveling wave */

const AGENT_R = .8;

const THEMES = {
  dark: {
    name:'dark', bg:0x101214, fill:0x14171b, fogNear:70, fogFar:190,
    grid1:0x2a2d31, grid2:0x1c1f23,
    itemOpen:0xc4453c, itemClosed:0x2c7a4b,
    stage:[0xc4453c,0xc97b35,0xc9a835,0xa3b23c,0x6fae4e,0x3f9d63,0x2c7a4b],
    kind:{main:0xb08d57,po:0xa58968,patrol:0xc9a835,orch:0x8a8f96,coder:0x7f8890,rev:0x6b7684,spec:0x91836b},
    liveHot:0x3d8fd6, liveCold:0x4e545c,
    tag:{neutral:'#9aa0a8', red:'#e0685c', amber:'#d9a441', green:'#6fae4e',
         cyan:'#4bb8b8', blue:'#5aa9e6', violet:'#a98bd8'},
    tagBg:'rgba(16,18,20,.62)',      /* the card lets the scene through */
    tagHalo:'rgba(16,18,20,.93)',    /* but each glyph keeps its own backing */
    retired:0x33363a, arcA:0xb08d57, arcB:0x22252a,
    tetherRun:0x6fae4e, tetherWait:0xc9a835, tetherSched:0xb9bfc7, pulse:0xb08d57, pulseSub:0x5f6670, pulseUser:0x6f9ecf,
    discBlack:0x000000, discY:0xc9a835, discG:0x2c7a4b, discN:0x555b63,
    shell:0x9fd8b4, halo:0xc9a835, orphan:0xc4453c,
    flashRun:0x6fae4e, flashWait:0xc9a835,
    metalness:.55, roughness:.3, agentMetal:.75, agentRough:.35, baseEmissive:.25, edges:false,
    amb:0x8a8a92, keyC:0xfff2dd, rimC:0x5b7285,
  },
  light: { /* NASA documentation / plotter paper */
    name:'light', bg:0xf2eee2, fill:0xfaf7ee, fogNear:90, fogFar:230,

/* ---------- view state ----------
   Two independent things, plus one input mode. Nothing else may hold view
   state; everything visual is derived from here by applyView().

     view.selection  brushed nodes. Persists across rebuilds and mode changes.
     view.focus      {obj, stage}. stage 1 = the node, 2 = its neighbourhood,
                     3 = an authored arrow (Arrow Focus) — key is null then
                     and `arrow` carries the arrowId instead.
     view.input      'navigate' | 'brush'. What the pointer does, nothing more.

   Selection and focus are ORTHOGONAL: neither clears or constrains the other. */
const view = {
  selection: new Set(),
  /* focus holds a STABLE KEY, never a mesh: meshes are rebuilt every five
     seconds, so an object reference goes stale and takes hover, dimming and
     framing with it. focusMesh() resolves the key against the current scene.

     READ-ONLY PROJECTION. `focusLayer` (below) is the one writable focus
     transaction; projectFocus() is the ONLY writer of these fields. Nothing
     else assigns view.focus.*: that split ownership — a subject in one place, a
     camera bookmark in another, each torn down by a different path — is exactly
     what let a stale Arrow Focus camera survive a null focus in two prior
     attempts. stage: 0 none, 1 node, 2 node neighbourhood, 3 arrow (arrowDepth
     'narrow' first click | 'neighborhood' second click). arrow carries the
     arrowId when stage 3, key is null then. */
  focus: { key: null, stage: 0, arrow: null, arrowDepth: null },

  fit: false,
  input: 'navigate',

     does under focus. A human types a query; an agent supplies an id list. The

  fitTarget: 'selection',        /* which framing f/space lands on next */

/* THE focus transaction — one owner for subject, depth, the camera pose below
   the layer, and the return policy. `null` carries NONE of them, so a stale
   focus-camera bookmark cannot exist outside a live focus (the defect behind
   both prior reviews, where stage/subject and the arrow-camera mark lived in
   separate variables torn down by separate paths). Written only by the four
   transitions below (focusNode / focusArrow / endFocus / clearFocus); read
   through view.focus via projectFocus(). Shape when non-null:
     { subject: {kind:'node', key, depth:'single'|'neighborhood'}
              | {kind:'arrow', arrowId, depth:'narrow'|'neighborhood'},
       lowerPose,                     // camera captured once, at layer open

let focusLayer = null;
/* Derive the read-only view.focus projection from the transaction. The ONLY
   writer of view.focus.*. */
function projectFocus(){
  const L = focusLayer;
  if (!L){ view.focus.key = null; view.focus.stage = 0; view.focus.arrow = null;
           view.focus.arrowDepth = null; return; }
  const s = L.subject;
  if (s.kind === 'node'){
    view.focus.key = s.key; view.focus.stage = s.depth === 'neighborhood' ? 2 : 1;

/* Development assertion: the union has no invalid inhabitants. A null layer has
   no payload; every subject carries a legal depth and identity; restore-exact
   always has a pose to restore. Runs after every transition. */
function assertFocusInvariant(){
  const L = focusLayer;
  if (L === null) return;
  const s = L.subject;
  console.assert(s && (s.kind === 'node' || s.kind === 'arrow'), 'focus: bad subject kind');
  if (s.kind === 'node')
    console.assert((s.depth === 'single' || s.depth === 'neighborhood') && !!s.key, 'focus: bad node subject');
  else
    console.assert((s.depth === 'narrow' || s.depth === 'neighborhood') && !!s.arrowId, 'focus: bad arrow subject');
  console.assert(L.returnPolicy === 'reframe-parent' || L.returnPolicy === 'restore-exact', 'focus: bad return policy');

}

/* a tag: short text pinned above a node, coloured by who wrote it */
/* Provenance is drawn, not typed: an emoji would arrive in its own colours and
   fight the tag's. A bust for a person, a hexagon for an agent — the hexagon
   echoing the faceted geometry the agents themselves are drawn from. */
function drawTagIcon(ctx, kind, cx, cy, r, color){
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = Math.max(2, r * .22);
  if (kind === 'user'){
    ctx.beginPath();                                   /* head */
    ctx.arc(cx, cy - r * .34, r * .40, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();                                   /* shoulders */
    ctx.arc(cx, cy + r * .92, r * .78, Math.PI * 1.12, Math.PI * 1.88);
    ctx.lineTo(cx + r * .74, cy + r * .96);
    ctx.lineTo(cx - r * .74, cy + r * .96);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath();                                   /* hexagon */
    for (let i = 0; i < 6; i++){
      const a = Math.PI / 6 + i * Math.PI / 3;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/* Canvas pixels per world unit. Raising it shrinks every card on screen
   without touching its resolution — the text is still drawn at 34px and stays
   crisp, it simply occupies less of the world. */
const TAG_PX_PER_UNIT = 80;
const TAG_LINE_PX = 44;              /* baseline-to-baseline inside the card */
const TAG_WRAP_PX = 680;             /* wrap past this: a long single line drew
                                        a card wider than the org it sits over.
                                        Roughly forty characters, so the 80 a
                                        tag may hold becomes two lines, not four */

function wrapTag(ctx, text, first, rest){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  const room = () => (lines.length ? rest : first);
  for (const word of words){
    const trial = line ? line + ' ' + word : word;
    if (ctx.measureText(trial).width <= room() || !line){ line = trial; continue; }
    lines.push(line); line = word;
  }
  if (line) lines.push(line);
  /* a single unbroken run longer than the card can be split anywhere or not
     at all, so split it rather than letting one word set the width */
  const out = [];
  for (const l of lines){
    if (ctx.measureText(l).width <= (out.length ? rest : first)){ out.push(l); continue; }
    let cur = '';
    for (const ch of l){
      if (ctx.measureText(cur + ch).width > (out.length ? rest : first) && cur){ out.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) out.push(cur);
  }
  return out;
}

const TAG_AUTHOR_PX = 32;            /* caption line: who is speaking */

/* Notes age, and a note whose age you cannot see is quietly misleading — a
   three-minute-old observation and a five-day-old one read identically. */
function friendlyAt(ms){
  if (!ms) return '';
  const mins = Math.round((Date.now() - ms) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.round(hrs / 24);
  if (days < 7) return days + 'd ago';
  return new Date(ms).toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
}

function tagSprite(text, source, color, author, at){
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = '600 34px ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif';
  author = author || 'author unknown';
  ctx.font = font;
  const ICON = 34;                                     /* space reserved for the mark */
  /* the mark sits on the first line, so that line has less room than the rest */
  const lines = wrapTag(ctx, text, TAG_WRAP_PX - ICON, TAG_WRAP_PX);
  /* The mark says whether a person or an agent wrote this. With several agents
     annotating one board that is no longer enough — which agent matters — so a
     named author gets a caption under the text, and a missing durable author
     says so instead of implying one. Agents had started writing provenance into
     the text themselves, "[watchdog:018] ...", which is the same need. */
  const authorFont = '600 25px ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif';
  let authorW = 0;
  const stamp = friendlyAt(at);
  let stampW = 0;
  if (author || stamp){
    ctx.font = authorFont;
    if (author) authorW = ctx.measureText(author).width;
    if (stamp) stampW = ctx.measureText(stamp).width;
    ctx.font = font;
  }
  const captionW = authorW + stampW + (author && stamp ? 26 : 0);
  const textW = Math.max(...lines.map((l, i) => ctx.measureText(l).width + (i ? 0 : ICON)), captionW);
  const w = Math.ceil(textW) + 26;
  const h = lines.length * TAG_LINE_PX + (author || stamp ? TAG_AUTHOR_PX : 0) + 14;
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const hot = (T.tag && T.tag[color]) || T.tag.neutral;
  g.fillStyle = T.tagBg;
  g.strokeStyle = hot; g.lineWidth = 2;
  const r = 9;
  g.beginPath();
  g.moveTo(r,1); g.lineTo(w-r,1); g.quadraticCurveTo(w-1,1,w-1,r);
  g.lineTo(w-1,h-1-r); g.quadraticCurveTo(w-1,h-1,w-r,h-1);
  g.lineTo(r,h-1); g.quadraticCurveTo(1,h-1,1,h-1-r);
  g.lineTo(1,r); g.quadraticCurveTo(1,1,r,1); g.closePath();
  g.fill(); g.stroke();
  const firstY = 7 + TAG_LINE_PX / 2;
  drawTagIcon(g, source, 13 + ICON/2 - 4, firstY, 11, hot);
  g.font = font; g.textBaseline = 'middle';
  /* Ink first as a halo, then the letter: the card is translucent now, so a
     glyph crossing a bright node needs its own opacity rather than relying on
     the panel behind it. */
  g.lineJoin = 'round'; g.lineWidth = 6; g.strokeStyle = T.tagHalo || T.tagBg;
  lines.forEach((l, i) => g.strokeText(l, 13 + (i ? 0 : ICON), firstY + i * TAG_LINE_PX));
  g.fillStyle = hot;
  lines.forEach((l, i) => g.fillText(l, 13 + (i ? 0 : ICON), firstY + i * TAG_LINE_PX));
  if (author || stamp){
    g.font = authorFont;
    /* the card is 7px padding, then the text lines, then this caption, then
       7px again — measuring it from firstY instead put it half a line low and
       the descenders fell off the bottom edge */
    const ay = 7 + lines.length * TAG_LINE_PX + TAG_AUTHOR_PX / 2;
    g.lineWidth = 5; g.strokeStyle = T.tagHalo || T.tagBg;
    if (author){
      g.strokeText(author, 13, ay);

    }

      g.globalAlpha = .55; g.fillText(stamp, w - 13, ay); g.globalAlpha = 1;
      g.textAlign = 'left';

    map: new THREE.CanvasTexture(c), transparent:true, depthTest:false }));

  sp.scale.set(w / TAG_PX_PER_UNIT, h / TAG_PX_PER_UNIT, 1);
  return sp;
}

/* the ghost set is derived from focus alone — never stored independently */
/* ---------- scope ----------
   Two things can restrict what is in play, and they compose rather than
   compete: a search establishes the working set, a focus inspects within it.
   Effective scope is their intersection. Filter used to win outright and the
   focus underneath it did nothing, which is why clicking a search result did
   not narrow and a neighbourhood click framed the search instead of the node.

   docs/display-rules.md is the decision this implements. */
function filterScope(){
  if (view.filter.kind === 'none') return null;
  const sc = {agents: new Set(), items: new Set()};
  (DATA?.items  || []).forEach(w => { if (filterMatches('i', w)) sc.items.add(w.id); });
  (DATA?.agents || []).forEach(a => { if (filterMatches('a', a)) sc.agents.add(a.id); });
  return sc;                                  /* may be empty: that is "no match" */
}

function arrowById(id){ return arrows.find(a => a.arrowId === id) || null; }

/* Arrow Focus's scope: the selected arrow's two endpoints are the roots.
   Walk every RENDERED relationship — agent family arcs, item-holder/turn
   tethers, agent obligation links, authored arrows — and take the ones that
   touch a root, one hop, stopping there. Each contributes its opposite node
   to the lit node set AND its own key to hiRelations, so a relationship
   between two lit-by-other-means nodes that itself touches neither root can
   stay ghosted even though both its ends are lit (the Arrow Focus spec,
   "the node set alone must not decide relationship brightness"). */
function arrowFocusScope(){
  if (!DATA) return null;
  const ar = arrowById(view.focus.arrow);
  if (!ar) return null;
  const roots = new Set([selKeyFor(ar.from), selKeyFor(ar.to)]);
  const touches = k => roots.has(k);
  const litNodes = new Set(roots), litRelations = new Set();

  groundGroup.children.forEach(o => {
    const u = o.userData;
    if (!u.arc) return;
    const a = 'a:' + u.from, b = 'a:' + u.to;
    if (!touches(a) && !touches(b)) return;
    litRelations.add('arc:' + u.from + '|' + u.to);
    litNodes.add(a); litNodes.add(b);
  });
  tetherGroup.children.forEach(o => {
    const u = o.userData;
    const w = u.itemMesh && u.itemMesh.userData && u.itemMesh.userData.w;
    if (!w) return;
    const a = 'i:' + w.id, b = 'a:' + u.hid;
    if (!touches(a) && !touches(b)) return;
    litRelations.add('tether:' + w.id + '|' + u.hid);
    litNodes.add(a); litNodes.add(b);
  });
  linkGroup.children.forEach(o => {
    const u = o.userData;
    if (!u.from || !u.to) return;
    const a = 'a:' + u.from, b = 'a:' + u.to;
    if (!touches(a) && !touches(b)) return;
    litRelations.add('link:' + u.from + '|' + u.to);
    litNodes.add(a); litNodes.add(b);
  });
  arrows.forEach(other => {
    const a = selKeyFor(other.from), b = selKeyFor(other.to);
    if (!touches(a) && !touches(b)) return;
    litRelations.add('arrow:' + other.arrowId);
    litNodes.add(a); litNodes.add(b);
  });

  const sc = {agents: new Set(), items: new Set()};
  litNodes.forEach(k => {
    const id = k.slice(2);
    (k.startsWith('i:') ? sc.items : sc.agents).add(id);
  });
  return {agents: sc.agents, items: sc.items, relations: litRelations};
}

/* First-click Arrow Focus: exactly the selected arrow and its two endpoint
   nodes are lit — nothing one-hop, no other relationship. That expansion is the
   SECOND click (arrowFocusScope). Everything outside this three-object scope
   ghosts. */
function arrowNarrowScope(){
  if (!DATA) return null;
  const ar = arrowById(view.focus.arrow);
  if (!ar) return null;
  const sc = {agents: new Set(), items: new Set()};
  [ar.from, ar.to].forEach(raw => {
    const k = selKeyFor(raw);
    (k.startsWith('i:') ? sc.items : sc.agents).add(k.slice(2));
  });
  return {agents: sc.agents, items: sc.items, relations: new Set(['arrow:' + ar.arrowId])};
}

function focusScope(){
  if (view.focus.stage === 3)
    return view.focus.arrowDepth === 'neighborhood' ? arrowFocusScope() : arrowNarrowScope();
  const obj = focusMesh();
  if (!obj || view.focus.stage < 1 || !DATA) return null;
  const sc = {agents: new Set(), items: new Set()};
  const u = obj.userData;
  if (view.focus.stage === 1){
    if (u.w) sc.items.add(u.w.id); else if (u.a) sc.agents.add(u.a.id);
    return sc;
  }
  /* the neighbourhood of the node that was clicked — derived from that node,
     never from whatever happens to be lit at the time */
  if (u.type === 'item'){
    sc.items.add(u.w.id);
    Object.keys(u.w.turns || {}).forEach(h => sc.agents.add(h));
    (u.w.holders || []).forEach(h => sc.agents.add(h));
  } else if (u.a){
    const id = u.a.id;
    sc.agents.add(id);
    if (u.a.parent) sc.agents.add(u.a.parent);
    (DATA.agents || []).forEach(x => { if (x.parent === id) sc.agents.add(x.id); });
    (DATA.items  || []).forEach(w => {
      if ((w.turns || {})[id] || (w.holders || []).includes(id)) sc.items.add(w.id);
    });
  }
  return sc;
}

/* While f owns the view the selection IS what is shown, so it replaces the
   scope rather than intersecting with it — otherwise flying to a selection
   that sits outside the current search would frame nodes that are ghosted. */
function selectionScope(){
  const sc = {agents: new Set(), items: new Set()};
  view.selection.forEach(k => {
    const id = k.slice(2);
    (k.startsWith('i:') ? sc.items : sc.agents).add(id);
  });
  return sc;
}

/* Scope is a STACK, and the innermost layer renders. Enter a mode and that
   mode is what you see: focus a node and only that node is lit, open its
   neighbourhood and the whole neighbourhood is lit — even the parts that the
   search underneath it would not have matched. The layers below are not
   intersected, they are remembered, so that leaving one puts back exactly what
   was true before it.

       filter   a search, or an agent's id list      (outermost)
       lens     f/space, showing the selection
       focus    a clicked node, then its neighbourhood   (innermost)

   The same stack decides what the brush can reach, so while a focus is up you
   can only add to or remove from the selection within it. */
/* Two different things, deliberately not the same thing:

     ISOLATE  decides what is lit — a search does it, a focus does it.
     FIT      decides only where the camera is — f does it, and it ghosts
              nothing at all.

   So f is absent from this function. It moves the camera to the selection and
   keeps moving it as the selection changes; the org stays fully lit while it
   does. Search and focus stack as isolates; the fit rides alongside. */
function activeScope(){
  if (view.focus.stage >= 1){ const sc = focusScope(); if (sc) return sc; }
  return filterScope();
}

function computeHighlight(){
  const sc = activeScope();
  if (!sc){ hiAgents = hiItems = hiRelations = null; return; }    /* nothing restricts the view */
  hiAgents = sc.agents; hiItems = sc.items; hiRelations = sc.relations || null;
}
/* frame everything currently highlighted */
/* one predicate for both provenances: a typed query matches text, an agent's
   list matches membership */
/* A node's visible extent is not just its centre: tags sit above it and run
   sideways, so a fit computed from centres alone crops them at the edge of the
   viewport. Contribute the tag corners too. */
const _fp = new THREE.Vector3();
/* Labels are annotations; the nodes are the subject. A tag quad reaches some
   fifteen world units past its node, so framing one alongside a set of nodes
   pushes the camera out until the nodes themselves are small — the view reads
   as far too wide to answer a question about the nodes. Multi-node framings
   fit the nodes and let labels overflow; single-object focus has room, so it
   still frames the label with the thing it labels. */
function fitPoints(m, out, tags = false){
  out.push(m.position.clone());
  if (!tags) return;
  (m.userData.tagSprites || []).forEach(sp => {
    if (!sp.visible) return;
    sp.getWorldPosition(_fp);
    const rx = sp.scale.x * .5, ry = sp.scale.y * .5;
    out.push(_fp.clone().add(new THREE.Vector3( rx, 0, 0)));
    out.push(_fp.clone().add(new THREE.Vector3(-rx, 0, 0)));
    out.push(_fp.clone().add(new THREE.Vector3(0, ry, 0)));
  });
}

/* Exact framing. Given the points that must end up visible, the point being
   looked at, and a unit direction from it toward the camera, solve the distance
   along that direction at which every point falls inside the frustum — the
   vertical field of view and the horizontal one the aspect implies.

   The three framings used to derive a distance from a bounding-sphere radius
   and then set the camera's height separately, so the distance actually flown
   was longer than the one solved for and the tilt changed what was in frame.
   Each carried a constant (+8, +6, +4) to cover the difference, and on a small
   result set that constant was most of the distance: a three-unit cluster
   framed from fifteen units out, which is the camera reading as too wide. */
const _fdv = new THREE.Vector3(), _fdr = new THREE.Vector3(), _fdu = new THREE.Vector3();
function frameDistance(pts, center, e, {margin = 1.10, usableH = 1, usableV = 1} = {}){
  const half = Math.tan(camera.fov * Math.PI / 360);
  const tanV = half * usableV, tanH = half * camera.aspect * usableH;
  _fdr.crossVectors(e, camera.up);
  if (_fdr.lengthSq() < 1e-6) _fdr.set(1, 0, 0);      /* looking straight down */
  _fdr.normalize();
  _fdu.crossVectors(_fdr, e).normalize();
  let d = 0;
  for (const p of pts){
    _fdv.subVectors(p, center);
    d = Math.max(d, _fdv.dot(e) + margin * Math.max(
      Math.abs(_fdv.dot(_fdr)) / tanH, Math.abs(_fdv.dot(_fdu)) / tanV));
  }
  return d;
}

/* The rectangle actually free of chrome. It is not symmetric — a bar across
   the top, a taller legend along the bottom, the detail pane down one side —
   so framing against the raw viewport centres content below the middle of the
   space that is really available, which reads as a view wanting to be panned
   up, and slides the lowest nodes under the legend. */
function clearRect(){
  const vw = innerWidth, vh = innerHeight;
  const r = {left: 0, right: vw, top: 0, bottom: vh};
  /* Only chrome pinned to an edge belongs here. The tag composer follows the
     focused node's SCREEN position, so measuring it closed a loop: the offset
     moved the node, the node moved the box, the box changed the offset. In
     single focus that walked the camera hundreds of pixels across the view. */
  document.querySelectorAll('#topbar, #layercards, #legend, #detail').forEach(el => {
    const cs = getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden') return;
    const b = el.getBoundingClientRect();
    if (!b.width || !b.height) return;
    if (b.width / vw > .6){                       /* a band across the view */
      if ((b.top + b.bottom) / 2 < vh / 2) r.top = Math.max(r.top, b.bottom);
      else r.bottom = Math.min(r.bottom, b.top);
    } else if ((b.left + b.right) / 2 > vw / 2){  /* hugging one side */
      r.right = Math.min(r.right, b.left);
    } else {
      r.left = Math.max(r.left, b.right);
    }
  });
  /* never let chrome starve the view: fall back to the viewport if it would */
  if (r.right - r.left < vw * .3){ r.left = 0; r.right = vw; }
  if (r.bottom - r.top < vh * .3){ r.top = 0; r.bottom = vh; }
  return {...r, vw, vh};
}

/* Frame `pts` into that rectangle: solve the distance, then aim so the content
   sits at the centre of the clear space rather than the centre of the screen. */
function frameTo(pts, center, e, {margin = 1.15, floor = 6} = {}){
  const b = clearRect();
  const right = new THREE.Vector3().crossVectors(camera.up, e).normalize();
  const up = new THREE.Vector3().crossVectors(e, right).normalize();

  /* Aim the middle of what is being framed, not the centroid of its points.
     A lopsided set — a cluster one side, one node far off the other — puts the
     centroid away from the middle, and the framing then looks off to one side
     however exact the distance is. */
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const _v = new THREE.Vector3();
  for (const pt of pts){
    _v.subVectors(pt, center);
    const x = _v.dot(right), y = _v.dot(up);
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const aim = center.clone()
    .addScaledVector(right, (x0 + x1) / 2)
    .addScaledVector(up,    (y0 + y1) / 2);

  const dist = Math.max(floor, frameDistance(pts, aim, e, {
    margin, usableH: (b.right - b.left) / b.vw, usableV: (b.bottom - b.top) / b.vh }));
  /* The camera targets the middle of what it frames and nothing else. Getting
     that middle to sit in the clear space is applyChromeOffset()'s job, and it
     does it by displacing the projection — aiming off-centre here instead
     would make everything orbit around a point that is not the subject. */
  return {camPos: aim.clone().addScaledVector(e, dist), target: aim};
}

/* The chrome is asymmetric, so the middle of the canvas is not the middle of
   what a viewer can actually see. Displace the projection by the difference:
   the camera keeps looking straight at its subject — so OrbitControls and the
   ambient spin both turn around that subject — while the image lands in the
   space the bar, the legend and the detail pane leave free. */
const chromeOff = {x: 0, y: 0}, chromeAim = {x: 0, y: 0};
function commitChromeOffset(){
  const vw = innerWidth, vh = innerHeight;
  if (Math.abs(chromeOff.x) < .5 && Math.abs(chromeOff.y) < .5) camera.clearViewOffset();
  else camera.setViewOffset(vw, vh, -chromeOff.x, -chromeOff.y, vw, vh);
  camera.updateProjectionMatrix();
}
/* A projection change lands in a single frame, so opening the detail pane —
   which happens before the flight starts — snapped the whole image sideways
   and the zoom then appeared to begin somewhere else. Only the destination is
   set here; tickFrame eases toward it, so the pane opening reads as a pan. */
function applyChromeOffset(immediate){
  const b = clearRect();
  chromeAim.x = (b.left + b.right) / 2 - b.vw / 2;
  chromeAim.y = (b.top + b.bottom) / 2 - b.vh / 2;
  if (immediate){ chromeOff.x = chromeAim.x; chromeOff.y = chromeAim.y; commitChromeOffset(); }
}

/* Where a framing approaches from: the camera's current bearing, lifted to a
   fixed pitch. Deciding the pitch up front is what lets the fit above be exact
   — it solves for the direction actually flown, not a horizontal stand-in. */
function approachDir(center, pitch = .42){
  const e = camera.position.clone().sub(center); e.y = 0;
  if (e.lengthSq() < .01) e.set(1, 0, 1);
  return e.normalize().multiplyScalar(Math.cos(pitch)).setY(Math.sin(pitch)).normalize();
}

function filterMatches(kind, node){
  const f = view.filter;
  if (f.kind === 'agent') return f.ids.has(kind === 'i' ? node.id : node.id);
  const q = f.query;
  if (!q) return false;
  const hay = kind === 'i' ? ((node.title || '') + ' ' + node.id)
                           : ((node.name || '') + ' ' + node.id);
  return hay.toLowerCase().includes(q);
}

function filteredView(){
  const pts = [];
  selectables().forEach(m => {
    const u = m.userData;
    const on = u.w ? hiItems?.has(u.w.id) : (u.a && hiAgents?.has(u.a.id));
    if (on) fitPoints(m, pts);
  });
  if (!pts.length) return null;
  const c = new THREE.Vector3();
  pts.forEach(v => c.add(v)); c.multiplyScalar(1 / pts.length);
  return { center: c, pts, count: pts.length };
}

/* Fly to whatever the current layer lights, without touching the fit's
   bookmark. Used when a layer is popped: leaving a focus must put back the
   framing that was true underneath it, not fly home. */
function frameCurrentScope(){
  const pts = [];
  selectables().forEach(m => {
    const u = m.userData;
    const on = u.w ? hiItems?.has(u.w.id) : (u.a && hiAgents?.has(u.a.id));
    if (on) fitPoints(m, pts);
  });
  /* with nothing restricting the view the parent IS the whole org */
  if (!pts.length && !hiAgents) selectables().forEach(m => fitPoints(m, pts));
  if (!pts.length) return false;
  const c = new THREE.Vector3();
  pts.forEach(v => c.add(v)); c.multiplyScalar(1 / pts.length);
  const e = approachDir(c);
  const {camPos, target} = frameTo(pts, c, e);
  userMoved = true;
  flyTo(camPos, target.clone(), () => {
    const d = camPos.clone().sub(target);
    orbitR = Math.hypot(d.x, d.z); orbitH = d.y;
    orbitAngle = Math.atan2(d.x, d.z); orbitTgt.copy(target);
    orbitUserOwned = false; userMoved = false;
  });
  return true;
}

/* Leave the innermost layer and put back what was true beneath it — lighting
   and camera together. Returns false when there is nothing left to pop, and
   the caller falls back to flying home. */
function popScope(){
  /* focus first: endFocus consumes the whole layer and applies its return
     policy (restore-exact for arrow, reframe-parent for a node-only focus). */
  if (focusLayer) return endFocus('background');
  if (view.fit){                         /* then the fit */
    if (camMark) restoreCamera();
    else { view.fit = false; applyView(); frameCurrentScope(); }
    return true;
  }
  if (view.filter.kind !== 'none'){      /* and last the search itself */
    /* The search is not lost when it is dismissed: it stays in the history as
       a card, so a third click is cheap to undo by clicking that card. */
    releaseFilter();
    return true;
  }
  return false;
}

/* apply a filter and frame what it found */
function setFilter(kind, {query = '', ids = null} = {}){
  /* Typing is debounced, so a keystroke leaves a timer holding the query as it
     was 220ms ago. Anything else that sets the filter in that window — the ×,
     an agent's command — was then undone when the timer fired: the box read
     empty while the view stayed filtered by a word no longer written anywhere.
     This is the single writer, so it is where the pending write is cancelled. */
  if (typeof searchTimer !== 'undefined') clearTimeout(searchTimer);
  view.filter = { kind, query: (query || '').toLowerCase().trim(),
                  ids: ids ? new Set(ids.map(fullId)) : null };
  if (kind === 'none'){ view.filter.query = ''; view.filter.ids = null; }
  applyView();
  renderSearchChrome();
  const nb = kind === 'none' ? null : filteredView();
  if (nb){
    camMark = null;                      /* framing the filter moves the camera too */
    view.fit = false;
    const e = approachDir(nb.center);
    const {camPos, target} = frameTo(nb.pts, nb.center, e);
    view.framing = 'filter'; userMoved = true;
    flyTo(camPos, target.clone(), () => {
      const d = camPos.clone().sub(target);
      orbitR = Math.hypot(d.x, d.z); orbitH = d.y;
      orbitAngle = Math.atan2(d.x, d.z); orbitTgt.copy(target);
      userMoved = false;
    });
  }
}
/* The status strip: one chip per layer in force, outermost first, coloured so
   each mode is recognisable without reading it. The chip that is actually
   deciding what you see is filled; the ones it is stacked on top of are
   outlined, because they are still there and you will land back on them. */
/* ---------- the pile of searches ----------
   Dismissing a search must not lose it. Every search a human types or an agent
   applies is filed as a card; clicking one runs it again and puts its terms
   back in the box where they can be edited, and the × forgets it for good.
   That is what makes a background click cheap enough to also clear a search. */
let searches = [], searchesRev = -1, activeSearchId = null;
/* The card the box is currently writing to. Typing keeps editing it, so one
   query does not leave a trail of its own prefixes; emptying the box ends that
   and the next thing typed starts a new card. Re-opening a card points this at
   it, which is what makes its terms editable in place. */
let typingCardId = null;

function renderCards(){
  const el = document.getElementById('cards');
  if (!el) return;
  const list = [...searches].sort((a, b) => (b.at || 0) - (a.at || 0));  /* newest first */
  el.innerHTML = list.map(q => {
    const term = q.label || q.query || ((q.ids || []).length + ' picked');
    const who = '<span class="who">' + esc(q.author || 'author unknown') + '</span>';
    return '<span class="card' + (q.searchId === activeSearchId ? ' on' : '') + '"'
         + ' data-id="' + q.searchId + '"'
         + ' title="' + esc(q.label ? q.label + ' — ' + (q.query || (q.ids||[]).length + ' picked') : term)
         + '\ndouble-click to name it">'
         + '<span class="term">' + esc(term) + '</span>' + who
         + '<button type="button" class="rename" data-rename="' + q.searchId + '" aria-label="rename saved search">Rename</button>'
         + '<button type="button" class="x" data-x="' + q.searchId + '" aria-label="delete saved search">×</button></span>';
  }).join('');
}
function esc(v){ return String(v ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.getElementById('cards').addEventListener('click', ev => {
  const rename = ev.target.closest('[data-rename]');
  if (rename){
    ev.stopPropagation();
    beginRename(rename.closest('[data-id]'));
    return;
  }
  const kill = ev.target.closest('[data-x]');
  if (kill){
    ev.stopPropagation();
    const id = kill.getAttribute('data-x');
    /* a debounced file from recent typing would otherwise land after the
       delete and put the card straight back */
    clearTimeout(fileTimer);
    if (id === typingCardId) typingCardId = null;
    if (id === activeSearchId) releaseFilter();
    searches = searches.filter(q => q.searchId !== id);
    renderCards();
    apiFetch('/searches/' + encodeURIComponent(id), {method:'DELETE'}).catch(()=>{});
    return;
  }
  const card = ev.target.closest('[data-id]');
  if (!card) return;
  const q = searches.find(x => x.searchId === card.getAttribute('data-id'));
  if (q) openSearch(q);
});

/* Naming a card. A search reads as its terms — "e2e", or "5 picked" — which
   says what was matched and not what it was FOR. A name carries the question:
   "everything blocking the 0.1.8 cut". Double-click to write one. */
function beginRename(card){
  if (!card) return;
  const id = card.getAttribute('data-id');
  const q = searches.find(x => x.searchId === id);
  if (!q) return;
  const field = document.createElement('input');
  field.className = 'name';
  field.value = q.label || '';
  field.placeholder = 'name this search';
  field.maxLength = 80;
  card.querySelector('.term').replaceWith(field);
  field.focus(); field.select();
  const done = async (save) => {
    field.onblur = null;
    const label = field.value.trim();
    if (save && label !== (q.label || '')){
      q.label = label || null;                       /* show it at once */
      renderCards();
      try {
        await apiFetch('/searches', {method:'POST', headers:{'content-type':'application/json'},
          body: JSON.stringify({searches:[{searchId: id, label}]})});
        searchesRev = -1;
      } catch(e){ /* the pile is a convenience; never fail on it */ }
    } else renderCards();
  };
  field.addEventListener('keydown', e => {
    e.stopPropagation();                             /* canvas hotkeys are not for typing */
    if (e.key === 'Enter') done(true);
  });
  field.addEventListener('blur', () => done(true));
}
document.getElementById('cards').addEventListener('dblclick', ev => {
  const card = ev.target.closest('[data-id]');
  if (!card) return;
  ev.preventDefault(); ev.stopPropagation();
  beginRename(card);
});

/* Re-open a filed search: run it, and put its terms back in the box so they
   can be edited rather than retyped. */
function openSearch(q){
  activeSearchId = typingCardId = q.searchId;   /* edits land on this card */
  /* A saved card replaces the active view stack. It keeps the selection, but
     no focus, fit bookmark, or camera transaction may survive underneath the
     card and reappear when the filter is later dismissed. */
  stopFlightHere();
  camMark = null;
  view.fit = false;
  clearFocus();
  /* The terms go back in the box whenever the card has any, whoever filed it.
     An agent's card carries both a picked set and the words describing it, and
     showing an empty box there left no way to adjust the search — which is the
     whole point of being able to re-open one. Editing the words then turns it
     into a text search, which is what typing in that box has always meant. */
  searchEl.value = q.query || '';
  searchClearBtn.style.display = searchEl.value ? 'block' : 'none';
  /* Before resultKind existed, a non-empty ids list was the fixed-set stamp.
     Keep those durable cards working; only an EMPTY fixed set needs the new
     explicit kind because its old shape was indistinguishable from text. */
  const fixed = q.resultKind === 'ids' || (!q.resultKind && (q.ids || []).length);
  if (fixed) setFilter('agent', {ids: q.ids || []});
  else setFilter('user', {query: q.query || ''});
  renderCards();
  /* Re-opening a search is applying it, so it belongs on the wire like any
     other filter — otherwise a second page, or an agent asking what is on
     screen, still believes the old one is running. */
  apiFetch('/filter', {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify(fixed
      ? {ids: q.ids || [], query: q.query || undefined}
      : {query: q.query || ''})}).catch(()=>{});
}

/* File a search a human typed, editing the card in place while they keep
   typing so one query does not leave a trail of prefixes. */
let fileTimer = null;
function fileSearch(query){
  clearTimeout(fileTimer);
  fileTimer = setTimeout(async () => {
    if (!query) return;
    try {
      const body = {searches: [{query, source: 'user',
                                searchId: typingCardId || undefined}]};
      const r = await apiFetch('/searches', {method:'POST',
        headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
      const rec = r?.searches?.[0];
      if (rec){ activeSearchId = typingCardId = rec.searchId; searchesRev = -1; }
    } catch(e){ /* the pile is a convenience; never fail a search on it */ }
  }, 700);
}

function renderStack(){
  const el = document.getElementById('stack');
  if (!el) return;
  const hot = k => (T.tag && T.tag[k]) || T.tag.neutral;
  const layers = [];
  if (view.filter.kind !== 'none'){
    const n = (hiItems?.size || 0) + (hiAgents?.size || 0);
    layers.push({ text: view.filter.kind === 'agent' ? 'agent search' : 'search',
                  count: view.filter.kind === 'none' ? '' : (activeIs('filter') ? n : ''),
                  colour: hot('cyan') });
  }
  if (view.fit){
    /* aside: the fit moves the camera, it does not decide what is lit */
    layers.push({ text: 'fit', count: view.selection.size, colour: hot('amber'),
                  aside: true });
  }
  if (view.focus.stage === 1) layers.push({ text: 'focus', count: '', colour: hot('violet') });
  if (view.focus.stage === 2){
    layers.push({ text: 'neighbourhood',
                  count: (hiItems?.size || 0) + (hiAgents?.size || 0), colour: hot('violet') });
  }
  if (view.focus.stage === 3){
    /* names the layer AND identifies the selected arrow, so an agent reading
       the strip cannot mistake this for a node focus (Arrow Focus spec). */
    const ar = arrowById(view.focus.arrow);
    const id = (ar && ar.arrowId) || view.focus.arrow || '';
    const label = ar && ar.text ? ar.text.slice(0, 20) : id.slice(0, 8);
    layers.push({ text: 'arrow focus' + (label ? ' · ' + label : ''),
                  count: (hiItems?.size || 0) + (hiAgents?.size || 0), colour: hot('violet') });
  }
  if (view.input === 'brush'){
    layers.push({ text: 'brush', count: view.selection.size, colour: hot('green'), aside: true });
  }
  el.innerHTML = layers.map((l, i) => {
    /* the innermost non-aside layer is the one rendering */
    const rendering = !l.aside && i === layers.filter(x => !x.aside).length - 1;
    return '<span class="chip' + (rendering ? ' on' : '') + '" style="color:' + l.colour + '">'
         + '<span class="dot"></span>' + l.text
         + (l.count !== '' && l.count != null ? ' <b>' + l.count + '</b>' : '') + '</span>';
  }).join('');
}

/* which layer is currently deciding the view */
function activeIs(kind){
  if (view.focus.stage >= 1) return kind === 'focus';
  return kind === 'filter' && view.filter.kind !== 'none';
}

function renderSearchChrome(){
  const f = view.filter;
  document.getElementById('searchpill').style.display = f.kind === 'agent' ? 'inline-block' : 'none';
  const box = document.getElementById('search');
  /* The box carries the current search's terms whoever set them — blanking it
     for an agent's filter meant re-opening a card put its words in and this
     wiped them a frame later, leaving nothing to edit. The pill still says who
     supplied it. Never stomp what someone is typing. */
  if (f.kind === 'agent' && document.activeElement !== box){
    const q = searches.find(x => x.searchId === activeSearchId);
    box.value = q?.query || '';
  }
  box.placeholder = f.kind === 'agent' ? 'agent-supplied selection'
                                       : 'filter — press / to search';
  /* The count belongs to the search layer, not to whatever is stacked above
     it: focusing one of twelve results must still read "12 shown", and a
     zero-match search must still say so with a focus lit on top of it. */
  const fs = filterScope();
  const n = fs ? fs.items.size + fs.agents.size : 0;
  document.getElementById('searchcount').textContent =
    f.kind === 'none' ? '' : (n ? n + ' shown' : 'no match');
  document.getElementById('searchclear').style.display =
    (f.kind !== 'none' || box.value) ? 'block' : 'none';
}

function neighbourhoodView(){
  const pts = [];
  itemMeshes.forEach(m => { if (m.userData.w && hiItems && hiItems.has(m.userData.w.id)) fitPoints(m, pts); });
  Object.entries(agentMeshes).forEach(([id,m]) => { if (hiAgents && hiAgents.has(id)) fitPoints(m, pts); });
  if (!pts.length) return null;
  const c = new THREE.Vector3();
  pts.forEach(v => c.add(v)); c.multiplyScalar(1/pts.length);
  return {center:c, pts};
}

/* The legend's height changes with the viewport and with being collapsed, so

  const el = document.getElementById('legend');
  const on = el && !el.classList.contains('collapsed') && getComputedStyle(el).display !== 'none';
  document.body.classList.toggle('has-legend', !!on);
  document.body.style.setProperty('--legend-h', on ? el.getBoundingClientRect().height + 'px' : '0px');
}
