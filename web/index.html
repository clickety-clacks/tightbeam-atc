  const byKey = {};
  tags.forEach(t => (byKey[selKeyFor(t.target)] ??= []).push(t));
  selectables().forEach(m => {
    const list = byKey[selKey(m)]; if (!list) return;
    let y = 1.5;
    list.slice(0, 4).forEach(t => {
      const sp = tagSprite(t.text, t.source, t.color || 'neutral', t.author, t.at);
      /* stack by actual height: a wrapped tag is two or three lines tall, and a
         fixed step drew the next one straight through it */
      y += sp.scale.y / 2;
      sp.position.set(0, y, 0);
      y += sp.scale.y / 2 + .16;
      m.add(sp); m.userData.tagSprites.push(sp);
    });
  });
}

/* ---------- arrows ----------
   An arrow is an agent's annotation of a RELATION: this card blocks that one,
   this reviewer owns that item. Tags name one node; an arrow names a pair, so
   it carries its own label. Short labels ride the curve, letter by letter —
   sprites, so every glyph faces the viewer however the scene is turned. A long
   one would have to shrink past reading size to fit, so it falls back to the
   same card a tag draws, parked at the apex.

   They draw thicker than tethers on purpose: a tether is the substrate's own
   traffic and should stay quiet, while an arrow is someone pointing. */
let arrows = [], arrowsRev = -1;
const arrowGroup = new THREE.Group();
arrowGroup.renderOrder = 8;
scene.add(arrowGroup);

const glyphCache = new Map();
function glyphTexture(ch, hex){
  const key = ch + '|' + hex + '|' + T.name;
  const hit = glyphCache.get(key);
  if (hit) return hit;
  const font = '700 44px ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif';
  const c = document.createElement('canvas'), m = c.getContext('2d');
  m.font = font;
  const w = Math.max(10, Math.ceil(m.measureText(ch).width));
  c.width = w + 14; c.height = 60;
  const g = c.getContext('2d');
  g.font = font; g.textBaseline = 'middle';
  /* a halo in the card colour, so a letter crossing a bright node still reads */
  g.lineJoin = 'round'; g.lineWidth = 8; g.strokeStyle = T.tagHalo || T.tagBg;
  g.strokeText(ch, 7, 31);
  g.fillStyle = hex; g.fillText(ch, 7, 31);
  const tx = new THREE.CanvasTexture(c);
  tx.userData = {aspect: c.width / c.height, advance: w / 60};
  glyphCache.set(key, tx);
  return tx;
}

/* the arc between two nodes: lifted out of the chord so it reads as a curve,
   and bowed sideways by rank so a second arrow over the same pair is visible */
function arrowCurve(a, b, rank){
  const mid = a.clone().add(b).multiplyScalar(.5);
  const d = b.clone().sub(a), len = d.length();
  const side = new THREE.Vector3().crossVectors(d, ARROW_UP);
  if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
  side.normalize();
  mid.addScaledVector(ARROW_UP, len * .17 + 1.1)
     .addScaledVector(side, ((rank % 2 ? 1 : -1) * Math.ceil(rank / 2)) * len * .13);
  const curve = new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone());
  /* Arc-length sampling is what makes the trim a real distance, and the table
     behind it is rebuilt every time the curve is — which is every frame, since
     the nodes bob. 200 divisions (the default) is precision nobody can see on a
     gentle arc; 24 is indistinguishable and an order of magnitude cheaper. */
  curve.arcLengthDivisions = 24;
  return curve;
}
const ARROW_UP = new THREE.Vector3(0, 1, 0);
const ARROW_SEGS = 46;
const ARROW_TAIL = 1.05;      /* how far short of the source the line starts */
const ARROW_HEAD = 1.45;      /* and of the target, leaving room for the head */

/* Sample the curve between its trimmed ends, in arc length so the trim is a
   real distance rather than a fraction of a parameter. The last sample and the
   head both sit on the curve's own tangent, which continues to the node's
   centre — that is what makes the arrow point AT the thing. */
function arrowSpan(curve){
  const L = Math.max(curve.getLength(), .001);
  const u0 = Math.min(.4, ARROW_TAIL / L);
  const u1 = 1 - Math.min(.4, ARROW_HEAD / L);
  return {u0, u1: Math.max(u1, u0 + .05)};
}

function arrowEndpoints(ar){
  const from = meshForKey(selKeyFor(ar.from)), to = meshForKey(selKeyFor(ar.to));
  if (!from || !to) return null;
  /* The true centres. The arrow is trimmed later ALONG ITS CURVE rather than
     along the straight line between them — pulling the ends back down the chord
     left the head sitting off to one side, aimed wherever the chord pointed
     instead of at the node it is naming. */
  const a = from.getWorldPosition(new THREE.Vector3());
  const b = to.getWorldPosition(new THREE.Vector3());
  return {a, b,
          fromId: from.userData.w ? from.userData.w.id : from.userData.a?.id,
          toId:   to.userData.w   ? to.userData.w.id   : to.userData.a?.id};
}

function meshForKey(k){
  return selectables().find(m => selKey(m) === k) || null;
}

function buildArrows(){
  /* Arrows also win node hit precedence. Clear the old node regions before
     changing that surface; the next frame republishes post-arrow truth. */
  invalidateSpatialTargets();
  while (arrowGroup.children.length){
    const g = arrowGroup.children.pop();
    g.traverse(o => {
      o.geometry?.dispose?.();
      if (o.material){ edgeMats.delete(o.material); o.material.dispose?.(); }
    });
  }
  const rank = {};
  arrows.forEach(ar => {
    const ends = arrowEndpoints(ar);
    if (!ends) return;                       /* an endpoint that is not on screen */
    const pairKey = [ar.from, ar.to].sort().join('>');
    const r = (rank[pairKey] = (rank[pairKey] || 0) + 1) - 1;
    const hex = (T.tag && T.tag[ar.color]) || T.tag.neutral;
    const curve = arrowCurve(ends.a, ends.b, r);
    const g = new THREE.Group();
    g.userData = {ar, rank: r, fromId: ends.fromId, toId: ends.toId,
                  aim: ends.b.clone(), mats: [], sprites: []};

    const {u0, u1} = arrowSpan(curve);
    const pts = [];
    for (let i = 0; i <= ARROW_SEGS; i++) pts.push(curve.getPointAt(u0 + (u1 - u0) * i / ARROW_SEGS));
    const pos = [];
    for (let i = 0; i < pts.length - 1; i++)
      pos.push(pts[i].x, pts[i].y, pts[i].z, pts[i+1].x, pts[i+1].y, pts[i+1].z);
    const lg = new LineSegmentsGeometry(); lg.setPositions(pos);
    const lm = new LineMaterial({color: hex, linewidth: 4.2, transparent: true,
                                 opacity: .95, depthTest: false});
    lm.resolution.set(innerWidth, innerHeight);
    lm.userData.base = .95;
    edgeMats.add(lm);
    const line = new LineSegments2(lg, lm);
    line.renderOrder = 8;
    g.add(line); g.userData.mats.push(lm); g.userData.line = line;

    /* head: a cone sitting on the last tangent */
    const head = new THREE.Mesh(new THREE.ConeGeometry(.28, .83, 14),
      new THREE.MeshBasicMaterial({color: hex, transparent: true, opacity: .95, depthTest: false}));
    head.material.userData.base = .95;
    head.renderOrder = 9;
    g.add(head); g.userData.mats.push(head.material); g.userData.head = head;

    if (ar.text){
      const glyphs = [...ar.text];
      const H = .68;                                    /* glyph height, world */
      const advances = glyphs.map(ch => glyphTexture(ch, hex).userData.advance * H + .06);
      const need = advances.reduce((x, y) => x + y, 0);
      if (need <= curve.getLength() * .74 && glyphs.length <= 42){
        let run = 0;
        glyphs.forEach((ch, i) => {
          const tx = glyphTexture(ch, hex);
          const sp = new THREE.Sprite(new THREE.SpriteMaterial({
            map: tx, transparent: true, depthTest: false }));
          sp.scale.set(H * tx.userData.aspect, H, 1);
          sp.renderOrder = 13;
          sp.userData.at = (run + advances[i] / 2);      /* distance along the run */
          run += advances[i];
          g.add(sp); g.userData.sprites.push(sp); g.userData.mats.push(sp.material);
        });
        g.userData.textLen = need;
      } else {
        const sp = tagSprite(ar.text, ar.source, ar.color || 'neutral', ar.author, ar.at);
        sp.renderOrder = 13;
        g.add(sp); g.userData.sprites.push(sp); g.userData.mats.push(sp.material);
        g.userData.hint = sp;
      }
    }
    arrowGroup.add(g);
    placeArrow(g, curve);
  });
}

/* Positions everything that hangs off the curve. Split out because the nodes
   bob, so the curve has to be re-laid every few frames, not only when the set
   of arrows changes. */
function placeArrow(g, curve){
  const span = arrowSpan(curve);
  const len = curve.getLength() * (span.u1 - span.u0);
  if (g.userData.head){
    const {u0, u1} = arrowSpan(curve);
    const tip = curve.getPointAt(u1);
    const before = curve.getPointAt(Math.max(u0, u1 - .03));
    g.userData.head.position.copy(tip);
    /* Aim at the node's centre rather than along the tangent. On a curve the
       tangent at the trimmed end only approximates that direction — a couple of
       degrees off — and an arrow's whole job is to point AT something. */
    const aimAt = g.userData.aim || before;
    const dir = aimAt.clone().sub(tip);
    if (dir.lengthSq() < 1e-6) dir.copy(tip).sub(before);
    g.userData.head.quaternion.setFromUnitVectors(ARROW_UP, dir.normalize());
  }
  if (g.userData.hint){
    g.userData.hint.position.copy(curve.getPointAt((span.u0 + span.u1) / 2))
      .addScaledVector(ARROW_UP, .85);
  } else if (g.userData.sprites.length){
    const start = (len - g.userData.textLen) / 2;
    /* A sprite always faces the viewer, so glyphs merely placed along the curve
       stay upright and a steep arrow stacks them into a vertical pile. Turn
       each one to the curve's direction ON SCREEN — which is what the reader
       sees, and is not the same as its direction in the world. */
    const at = d => span.u0 + (span.u1 - span.u0) * Math.min(1, Math.max(0, d / len));
    const screenAt = u => {
      const v = curve.getPointAt(u).project(camera);
      return {x: v.x * innerWidth / 2, y: v.y * innerHeight / 2};
    };
    const head = screenAt(at(start)), tail = screenAt(at(start + g.userData.textLen));
    /* running right-to-left on screen would read backwards: walk the curve the
       other way and turn the glyphs through half a turn */
    const flip = tail.x < head.x;
    g.userData.sprites.forEach(sp => {
      const d = flip ? (start + g.userData.textLen - sp.userData.at) : (start + sp.userData.at);
      const u = at(d);
      sp.position.copy(curve.getPointAt(u)).addScaledVector(ARROW_UP, .5);
      const a = screenAt(Math.max(0, u - .012)), b = screenAt(Math.min(1, u + .012));
      let ang = Math.atan2(b.y - a.y, b.x - a.x);
      if (flip) ang += Math.PI;
      sp.material.rotation = ang;
    });
  }
}

function relayArrows(){
  arrowGroup.children.forEach(g => {
    const ends = arrowEndpoints(g.userData.ar);
    if (!ends) return;
    const curve = arrowCurve(ends.a, ends.b, g.userData.rank);
    g.userData.aim.copy(ends.b);          /* the node moves; the aim follows it */
    const {u0, u1} = arrowSpan(curve);
    const pts = [], pos = [];
    for (let i = 0; i <= ARROW_SEGS; i++) pts.push(curve.getPointAt(u0 + (u1 - u0) * i / ARROW_SEGS));
    for (let i = 0; i < pts.length - 1; i++)
      pos.push(pts[i].x, pts[i].y, pts[i].z, pts[i+1].x, pts[i+1].y, pts[i+1].z);
    g.userData.line.geometry.setPositions(pos);
    placeArrow(g, curve);
  });
}

function applyView(){
  computeHighlight();
  if (typeof renderDetail === 'function') renderDetail();
  selectables().forEach(m => {
    const k = selKey(m);
    if (k) shadeSelected(m, view.selection.has(k));
  });
  document.getElementById('selcount').textContent = view.selection.size;
  /* Meshes are rebuilt on every five-second refresh, taking their tag sprites
     with them. Re-attaching only when the tag revision changes meant tags
     appeared once and vanished at the next refresh. */
  buildTags();
  buildArrows();
  renderSearchChrome();
  renderStack();
  applyLayerVisibility();
  applyChromeOffset();          /* the detail pane may have just appeared */
}
/* Whatever is ghosted is out of play. With no focus or filter the brush can
   reach anything; inside a focus or a filter it can only reach what that scope
   is showing, which is the same rule hover already follows. */
/* One predicate for everything a human can reach: what the active layer lights.
   Rendering, hover, click and brush all ask this, so they cannot disagree. */
function inScope(m){
  if (!hiAgents) return true;
  const u = m.userData;
  return u.w ? hiItems.has(u.w.id) : (u.a && hiAgents.has(u.a.id));
}
function nodeLayerOn(m){
  return m.userData.w ? layerState.workItems : layerState.agents;
}
/* Keep node parents mounted: labels and tags are children so they can stay on
   independently when the body they annotate is off. Visibility and picking
   therefore share nodeLayerOn() instead of hiding a whole parent group. */
function applyLayerVisibility(){
  arrowGroup.visible = layerState.arrows;
  tetherGroup.visible = layerState.obligations;
  linkGroup.visible = layerState.agentGraph;
  groundGroup.children.forEach(o => {
    const u = o.userData;
    if (u.arc){ o.visible = layerState.agentGraph; return; }
    if (!u.a) return;
    o.material.visible = layerState.agents;
    if (u.lineMat) u.lineMat.visible = layerState.agents && !u.selected;
    o.children.forEach(ch => {
      if (ch.isSprite){
        if (ch.userData.isTag) ch.visible = layerState.annotations && (u.dim ?? 1) > .9;
        else if (ch.userData.isAgentLabel) ch.visible = layerState.agentLabels && (u.dim ?? 1) > .9;
      } else ch.visible = layerState.agents;
    });
  });
  itemGroup.children.forEach(o => {
    const u = o.userData;
    if (!u.w) return;
    o.material.visible = layerState.workItems;
    if (u.lineMat) u.lineMat.visible = layerState.workItems && !u.selected;
    o.children.forEach(ch => {
      if (ch.isSprite) ch.visible = layerState.annotations && (u.dim ?? 1) > .9;
      else ch.visible = layerState.workItems;
    });
  });
}
function paintAt(px, py){
  const r2 = selRadius * selRadius;
  const hits = [];
  selectables().forEach(m => {
    if (!nodeLayerOn(m) || !inScope(m)) return;
    const [x, y, z] = screenXY(m);
    if (z > 1) return;                                  /* behind the camera */
    const dx = x - px, dy = y - py;
    if (dx*dx + dy*dy <= r2) hits.push(m);
  });
  if (!hits.length) return;
  if (!selOp){
    const k0 = selKey(hits[0]);
    selOp = view.selection.has(k0) ? 'unselect' : 'select';
    selCursor.classList.toggle('unsel', selOp === 'unselect');
  }
  hits.forEach(m => {
    const k = selKey(m); if (!k) return;
    if (selOp === 'select') view.selection.add(k); else view.selection.delete(k);
    /* the fit follows the stroke: the current set defines the viewport */
    if (view.fit) selectionChanged();
    shadeSelected(m, selOp === 'select');
  });
  document.getElementById('selcount').textContent = view.selection.size;
}
/* Emptying the selection collapses the lens that was showing it: a lens with
   nothing in it renders nothing and would silently fall through to its parent
   while still holding the camera bookmark. */
function clearSelection(){
  view.selection.clear();
  if (view.fit){
    if (camMark) return restoreCamera();   /* nothing left to frame */
    view.fit = false;
  }
  applyView();
}

/* While the fit is live the current selection defines the viewport, so every
   add and remove re-frames it. Debounced: a brush stroke is a burst of
   changes and each one would otherwise start its own flight. */
let refitTimer = null;
function selectionChanged(){
  applyView();
  if (!view.fit) return;
  if (!view.selection.size) return;        /* the last one out is handled above */
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => { if (view.fit && view.selection.size) refitToSelection(); }, 260);
}

function refitToSelection(){
  const pts = [];
  selectables().forEach(m => { const k = selKey(m); if (k && view.selection.has(k)) fitPoints(m, pts); });
  if (!pts.length) return;
  const c = new THREE.Vector3();
  pts.forEach(v => c.add(v)); c.multiplyScalar(1 / pts.length);
  const e = approachDir(c);
  const {camPos, target} = frameTo(pts, c, e);
  userMoved = true;
  flyTo(camPos, target.clone(), () => {
    const d = camPos.clone().sub(target);
    orbitR = Math.hypot(d.x, d.z); orbitH = d.y;
    orbitAngle = Math.atan2(d.x, d.z); orbitTgt.copy(target);
    userMoved = false;
  });
}

/* the ONLY place input mode changes; focus and selection are untouched */
function setInputMode(mode){
  view.input = mode;
  const brushing = mode === 'brush';
  controls.enabled = !brushing;
  selUI.classList.toggle('off', !brushing);
  selCursor.style.display = brushing ? 'block' : 'none';
  if (!brushing) finishBrush(brushPointer, true);
  document.querySelector('#touchcontrols [data-action="select"]')
    ?.setAttribute('aria-pressed', String(brushing));
  renderStack();                     /* the strip names the input mode too */
}
/* Unconditional hard reset of the focus transaction: no layer, camera released
   to ambient orbit. Goes through focusLayer/projectFocus like every other
   focus write. endFocus() is the transactional exit that also performs a
   policy camera action; clearFocus() is the plain reset used where there is
   provably nothing to pop. */
function clearFocus(){
  focusLayer = null;
  projectFocus();
  assertFocusInvariant();
  if (typeof hideTagBox === 'function') hideTagBox();
  if (typeof detailEl !== 'undefined') detailEl.style.display = 'none';
  view.framing = 'none';                 /* releases the camera to ambient orbit */
  applyView();                           /* focus drives dimming: re-derive now */
}
function setRadius(px){
  selRadius = Math.max(8, Math.min(220, Math.round(px)));
  selRad.value = selRadius;
  document.getElementById('selradv').textContent = selRadius;
  selCursor.style.width = selCursor.style.height = (selRadius*2) + 'px';
}
setRadius(selRadius);
selRad.addEventListener('input', e => setRadius(+e.target.value));

let brushPointer = null;
const brushContacts = new Set();
function finishBrush(pointerId, cancelled = false){
  if (brushPointer == null || (pointerId != null && pointerId !== brushPointer)) return;
  const id = brushPointer;
  brushPointer = null; selecting = false; selOp = null;
  selCursor.classList.remove('unsel');
  try { renderer.domElement.releasePointerCapture(id); } catch(e){}
  flushHeldCommands();                 /* every end path releases held commands once */
}
addEventListener('pointermove', e => {
  if (view.input !== 'brush' || e.pointerId !== brushPointer) return;
  selCursor.style.left = e.clientX + 'px';
  selCursor.style.top  = e.clientY + 'px';
  if (selecting) paintAt(e.clientX, e.clientY);
}, true);
addEventListener('pointerdown', e => {
  if (view.input !== 'brush' || e.target !== renderer.domElement) return;
  brushContacts.add(e.pointerId);
  if (brushContacts.size > 1){ finishBrush(brushPointer, true); return; }
  brushPointer = e.pointerId; selecting = true; selOp = null;
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch(err){}
  paintAt(e.clientX, e.clientY);
}, true);
addEventListener('pointerup', e => {
  brushContacts.delete(e.pointerId);
  if (view.input === 'brush') finishBrush(e.pointerId);
}, true);
addEventListener('pointercancel', e => {
  brushContacts.delete(e.pointerId);
  finishBrush(e.pointerId, true);
}, true);
addEventListener('lostpointercapture', e => {
  brushContacts.delete(e.pointerId);
  finishBrush(e.pointerId, true);
}, true);

/* f/space is a round trip: the first press remembers exactly where the camera
   was — position, target, and the ambient orbit's angle, radius, height and
   centre — then flies to the selection. The next press restores all of it, so
   you land back in the same zoom, pan and rotation you left, still turning if
   it was turning. */
let camMark = null;
/* the camera move a click (or an API focus) performs on a node */
function flyToNode(o){
  /* The f/space bookmark records where the camera was so a second press can
     put it back. Any OTHER framing invalidates it — otherwise the next f reads
     a mark left over from before and flies BACK instead of to the selection,
     which is exactly what it looked like when f "stopped working". The click
     path already did this; focus arriving from the control API did not. */
  view.framing = 'focus'; userMoved = true;
  const nb = view.focus.stage === 2 ? neighbourhoodView() : null;
  let camPos, target;
  if (nb){
    const e = approachDir(nb.center);
    ({camPos, target} = frameTo(nb.pts, nb.center, e, {floor: 7}));
  } else {
    const pts = []; fitPoints(o, pts, true);
    const pt = new THREE.Vector3();
    pts.forEach(v => pt.add(v)); pt.multiplyScalar(1 / pts.length);
    /* The detail pane is chrome like the bar and the legend, and applyView has
       already put it on screen, so clearRect() sees it and the node is framed
       into whatever it leaves — down one side in landscape, above it in
       portrait. A lone node wants breathing room rather than to fill the
       frame, which is all the wider margin here is for. */
    const e = approachDir(pt, .30);
    ({camPos, target} = frameTo(pts, pt, e, {margin: 2.0, floor: 7}));
  }
  /* Hand the ambient spin the same centre the framing used, the way the filter
     and selection framings do — otherwise a focused view either sat frozen or
     resumed carouselling around the org's root rather than the subject. */
  flyTo(camPos, target.clone(), () => {
    const d = camPos.clone().sub(target);
    orbitR = Math.hypot(d.x, d.z); orbitH = d.y;
    orbitAngle = Math.atan2(d.x, d.z); orbitTgt.copy(target);
    userMoved = false;
  });
  showTagBox();
}

/* Fit points for Arrow Focus: the lit nodes (as any multi-node framing would
   use), plus the geometry that makes the relationship set visible — the
   curve of every lit relationship that bows away from the chord between its
   nodes, and the long-label card when one is showing. Centres alone would
   crop the bow and the card at the edge of the viewport. */
const _afWorld = new THREE.Vector3();
function arrowFocusFitPoints(){
  const pts = [];
  selectables().forEach(m => {
    const u = m.userData;
    const on = u.w ? hiItems?.has(u.w.id) : (u.a && hiAgents?.has(u.a.id));
    if (on) fitPoints(m, pts);
  });
  if (!hiRelations) return pts;
  arrowGroup.children.forEach(g => {
    if (!hiRelations.has('arrow:' + g.userData.ar.arrowId)) return;
    const ends = arrowEndpoints(g.userData.ar);
    if (!ends) return;
    const curve = arrowCurve(ends.a, ends.b, g.userData.rank);
    const {u0, u1} = arrowSpan(curve);
    for (let i = 0; i <= 6; i++) pts.push(curve.getPointAt(u0 + (u1 - u0) * i / 6));
    if (g.userData.hint){
      const sp = g.userData.hint;
      sp.getWorldPosition(_afWorld);
      const rx = sp.scale.x * .5, ry = sp.scale.y * .5;
      pts.push(_afWorld.clone().add(new THREE.Vector3( rx,  ry, 0)));
      pts.push(_afWorld.clone().add(new THREE.Vector3(-rx, -ry, 0)));
    }
  });
  /* agent-family arcs bow upward toward the surface; tethers and links are
     straight segments between points already in `pts`, so only arcs need
     their own samples */
  groundGroup.children.forEach(o => {
    const u = o.userData;
    if (!u.arc || !hiRelations.has('arc:' + u.from + '|' + u.to)) return;
    const pos = o.geometry.attributes.position;
    if (!pos || !pos.count) return;
    [0, (pos.count / 2) | 0, pos.count - 1].forEach(i =>
      pts.push(new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i))));
  });
  return pts;
}

/* ---- the four focus transitions: the ONLY writers of focusLayer ----
   Pointer and API entry share these seams; none of them writes focus state
   directly. Every entry either opens a fresh layer — capturing lowerPose EXACTLY
   ONCE — or replaces/deepens the subject of the layer already open WITHOUT
   touching lowerPose. Every exit runs through endFocus(). */

/* Open, deepen, or replace the focus with a NODE subject. The caller decides
   depth (a pointer re-click toggles single<->neighbourhood; the API states it
   outright). A fresh layer opens with reframe-parent, preserving the canonical
   node-pop that C4 pins to clean base. Replacing keeps the original lowerPose,
   and — once an arrow has upgraded the layer to restore-exact — leaves that
   policy in force (arrow -> node keeps the exact lower pose). */
function focusNode(key, depth){
  if (!focusLayer)
    focusLayer = { subject: {kind:'node', key, depth},
                   lowerPose: captureCamera(), returnPolicy: 'reframe-parent' };
  else
    focusLayer.subject = {kind:'node', key, depth};
  projectFocus();
  assertFocusInvariant();
  applyView();
  view.framing = 'focus'; userMoved = true;
  const m = focusMesh();
  if (m) flyToNode(m);
}

/* Enter Arrow Focus on `g` (an arrowGroup child). First click opens NARROW
   (only the arrow and its two endpoints). A second click on the SAME arrow
   advances to the one-hop NEIGHBORHOOD. A third same-arrow click is a no-op.
   Clicking a different arrow, or an arrow while a node is focused, replaces the
   subject at narrow in the same layer. Any arrow ever upgrades the return
   policy to restore-exact for the life of the layer, so background restores the
   exact pose that was true BELOW the layer — never the node/arrow pose. */
function focusArrow(g){
  const ar = g && g.userData && g.userData.ar;
  if (!ar || !ar.arrowId) return;
  const sub = focusLayer && focusLayer.subject;
  if (sub && sub.kind === 'arrow' && sub.arrowId === ar.arrowId){
    if (sub.depth === 'narrow') focusLayer.subject = {kind:'arrow', arrowId: ar.arrowId, depth:'neighborhood'};
    else return;                                   /* third same-arrow click: no-op */
  } else if (!focusLayer){
    focusLayer = { subject: {kind:'arrow', arrowId: ar.arrowId, depth:'narrow'},
                   lowerPose: captureCamera(), returnPolicy: 'restore-exact' };
  } else {
    focusLayer.subject = {kind:'arrow', arrowId: ar.arrowId, depth:'narrow'};
    focusLayer.returnPolicy = 'restore-exact';     /* keep the original lowerPose */
  }
  projectFocus();
  assertFocusInvariant();
  applyView();
  view.framing = 'focus'; userMoved = true;
  flyToArrowFocus();
}

/* The ONLY exit. Consumes the whole focus transaction atomically, re-derives
   the lighting with no focus, then performs the ONE camera action its return
   policy allows. reason: 'background' | 'refresh' | 'fit-dismiss' | 'api-clear'.
   Background and refresh use the return policy. Fit dismissal discards the focus
   return and lets the caller (fitSelection) restore the fit's pre-fit pose. API
   clear preserves the base clear-command behaviour (no camera flight). */
function endFocus(reason){
  const L = focusLayer;
  if (!L) return false;
  focusLayer = null;
  projectFocus();
  assertFocusInvariant();
  if (typeof hideTagBox === 'function') hideTagBox();
  if (typeof detailEl !== 'undefined') detailEl.style.display = 'none';
  view.framing = 'none';
  applyView();                                     /* re-derive lighting, no focus */
  if (reason === 'fit-dismiss' || reason === 'api-clear') return true;
  if (L.returnPolicy === 'restore-exact' && L.lowerPose){ flyToPose(L.lowerPose); return true; }
  /* reframe-parent: put back the framing that was true beneath the focus,
     exactly as clean base 0d65bead did — refit the fit if one sits below,
     otherwise reframe the parent scope. */
  if (view.fit && view.selection.size){ refitToSelection(); return true; }
  return frameCurrentScope();
}
function flyToArrowFocus(){
  const pts = arrowFocusFitPoints();
  if (pts.length){
    const c = new THREE.Vector3();
    pts.forEach(v => c.add(v)); c.multiplyScalar(1 / pts.length);
    const e = approachDir(c);
    const {camPos, target} = frameTo(pts, c, e, {floor: 7});
    flyTo(camPos, target.clone(), () => {
      const d = camPos.clone().sub(target);
      orbitR = Math.hypot(d.x, d.z); orbitH = d.y;
      orbitAngle = Math.atan2(d.x, d.z); orbitTgt.copy(target);
      userMoved = false;
    });
  }
  showTagBox();               /* stage is 3, not 1: this hides it, same as flyToNode's call does for stage 2 */
}

/* Whether an arrow's root — a raw id off the wire, item or agent — still
   names something in the current snapshot. Used to pop Arrow Focus when a
   refresh removes the selected arrow or either endpoint out from under it. */
function arrowRootExists(rawId){
  const s = String(rawId);
  if (s.startsWith('wi_')) return (DATA?.items || []).some(w => w.id === fullId(s));
  return !!(DATA && (DATA.agents || []).some(a => a.id === s));
}
function checkArrowFocusValidity(){
  const sub = focusLayer && focusLayer.subject;
  if (!sub || sub.kind !== 'arrow') return;
  const ar = arrowById(sub.arrowId);
  /* Refresh validity consumes the layer ONCE through endFocus; because the
     layer is then null, no later node or arrow pop can restore the pose again. */
  if (!ar || !arrowRootExists(ar.from) || !arrowRootExists(ar.to)) endFocus('refresh');
}

/* One camera pose: everything a flight needs to put the view back exactly —
   position, target, and the ambient orbit's angle, radius, height and centre,
   plus the framing bookkeeping. Used by BOTH the fit bookmark (camMark) and the
   focus transaction's lowerPose, which stay separate transactions. */
function captureCamera(){
  return {
    pos: camera.position.clone(), tgt: controls.target.clone(),
    orbitAngle, orbitR, orbitH, orbitTgt: orbitTgt.clone(),
    userMoved, framing: view.framing, fitTarget: view.fitTarget,
  };
}
/* Fly the camera back to a captured pose exactly. Does NOT touch view.fit: the
   caller owns whether the fit lens is lifting (fit dismissal) or staying put
   (a focus popping back onto the fit beneath it). */
function flyToPose(m){
  view.framing = 'restoring';
  userMoved = true;
  flyTo(m.pos, m.tgt, () => {
    orbitAngle = m.orbitAngle; orbitR = m.orbitR; orbitH = m.orbitH;
    orbitTgt.copy(m.orbitTgt);
    userMoved = m.userMoved; view.framing = m.framing; view.fitTarget = m.fitTarget;
  });
}
function markCamera(){ camMark = captureCamera(); }
function restoreCamera(){
  const m = camMark; camMark = null;
  view.fit = false;                  /* the lens lifts with the camera */
  applyView();
  flyToPose(m);
  return true;
}
function fitSelection(){
  /* f frames what you have collected. With nothing collected there is nothing
     to frame, and framing the whole org instead was never what the key meant. */
  if (!camMark && !view.selection.size) return false;
  if (camMark){
    /* second press dismisses the whole transaction — the fit and any focus
       opened inside it. Consume the focus layer (discarding its return), then
       restore the fit's pre-fit pose. */
    endFocus('fit-dismiss');
    return restoreCamera();
  }
  /* f/space toggles between the two framings: whatever focus mode is showing,
     and the brushed selection. With only one of them available it just frames
     that one, and with neither it frames the whole org. */
  const selPts = [], focusPts = [];
  selectables().forEach(m => {
    const k = selKey(m);
    if (k && view.selection.has(k)) fitPoints(m, selPts);
    if (hiAgents){
      const u = m.userData;
      const inside = u.w ? hiItems.has(u.w.id) : (u.a && hiAgents.has(u.a.id));
      if (inside) fitPoints(m, focusPts);
    }
  });
  if (!focusPts.length){ const fm = focusMesh(); if (fm) focusPts.push(fm.position); }

  /* The selection always wins: f goes to what you brushed, and only falls back
     to the focus when nothing is brushed. Getting back out is the bookmark
     above, not a second framing — a toggle here fought that and could send the
     first press to the view you were already looking at. */
  view.fitTarget = selPts.length ? 'selection' : 'focus';
  let pts = selPts.length ? selPts : focusPts;
  if (!pts.length){
    /* A filter that matched nothing is not an absent filter: framing the whole
       org here would read as "search off" while the box still says no match. */
    if (view.filter.kind !== 'none') return false;
    pts = []; selectables().forEach(m => fitPoints(m, pts));
  }
  if (!pts.length) return false;
  const c = new THREE.Vector3();
  pts.forEach(v => c.add(v)); c.multiplyScalar(1 / pts.length);
  const e = approachDir(c);
  /* raise the lens BEFORE framing so the fit is solved against what will
     actually be lit, then re-derive so the rest of the org ghosts */
  view.fit = true;
  const {camPos, target} = frameTo(pts, c, e);
  /* hand the ambient orbit a new centre so it carousels around the selection
     once the flight lands, instead of resuming around the org's root */
  markCamera();                                /* first press: remember here */
  flyTo(camPos, target.clone(), () => {
    const d = camPos.clone().sub(target);
    orbitR = Math.hypot(d.x, d.z);
    orbitH = d.y;
    orbitAngle = Math.atan2(d.x, d.z);
    orbitTgt.copy(target);
    userMoved = false;                         /* orbit carries on around what we framed */
  });
  view.framing = view.fitTarget; userMoved = true;
  return true;
}

/* ---------- animate ---------- */
/* ---------- the working ring ----------
   Same frequency, same amplitude, the period offset between the three. */
const RING_SEGS = 90;          /* points around the loop */
/* The Siri look: several sines superimposed along a line, each its own colour
   and translucent, crossing one another as they go. Wrapped round a circle
   here. Each ring carries its OWN set of modes rather than the same shape at a
   different radius — that is what makes them cross and interleave instead of
   nesting like contour lines. The rates do not divide into each other, so the
   composite never repeats. */
const RING_WAVES = [
  { rot: 0,   modes: [{k:5, a:1.00, r:1.00}, {k:3, a:.60, r:.71}, {k:8, a:.30, r:1.33}] },
  { rot: .70, modes: [{k:4, a:.95, r:.83}, {k:7, a:.50, r:1.19}, {k:2, a:.45, r:.61}] },
  { rot: 1.4, modes: [{k:6, a:.90, r:1.11}, {k:3, a:.55, r:.67}, {k:9, a:.28, r:1.53}] },
];
const RING_NORM = 1 / 1.55;    /* keep the summed swing near RING_AMP */

const RING_AMP = .105;         /* how far the edge travels, as a fraction of R */
const RING_SPEED = 2.1;        /* how fast it oscillates, in place */
/* The aberration is radial as well as temporal. A phase offset alone moves a
   point by a fraction of the amplitude, which is sub-pixel on a small disc, so
   the three drew on top of each other and summed to plain white everywhere. A
   lens splits its components across the radius; so does this. */
const RING_SPLIT = [0, .045, .09];    /* period offset, in turns */
/* nearly the same radius: they should overlap and cross, not sit in rings */
const RING_SPREAD = [1, 1.012, 1.024];

function ringColours(){
  /* pure-ish components so they recombine toward the theme's own ink */
  return T.name === 'light' ? [0xc8322a, 0x2b8f4e, 0x2f63c4]
                            : [0xff5a5a, 0x54ff9a, 0x5aa8ff];
}

function ensureRings(m){
  if (m.userData.rings) return m.userData.rings;
  m.userData.rings = ringColours().map(c => {
    const mat = new LineMaterial({ color: c, linewidth: 2.6, transparent: true,
      opacity: .1, depthTest: false,
      /* additive sums the three back to white on a dark ground; on paper the
         same trick has to subtract instead or it bleaches into the page */
      blending: T.name === 'light' ? THREE.MultiplyBlending : THREE.AdditiveBlending });
    mat.resolution.set(innerWidth, innerHeight);
    edgeMats.add(mat);
    const seg = new LineSegments2(new LineSegmentsGeometry(), mat);
    seg.renderOrder = 6;
    seg.position.y = m.userData.workingRing ? 0 : .02; /* agent rings clear the floor disc */
    seg.userData.ringWave = true;
    /* Work-item rings are visual only. Agent rings keep their existing
       LineSegments2 hit surface: changing their radius must not change hits. */
    if (m.userData.workingRing) seg.raycast = () => {};
    m.add(seg);
    return seg;
  });
  return m.userData.rings;
}

/* One buffer per ring, never a shared one: LineSegmentsGeometry.setPositions
   keeps a Float32Array BY REFERENCE rather than copying it, so three rings fed
   from the same scratch array all drew whichever was computed last — three
   identical loops stacked on each other, which is exactly why the split was
   invisible and the result was a solid white line. */
function updateRings(m, t){
  const R = m.userData.ringR ??
    (m.userData.ringR = (m.geometry?.parameters?.radius || .8) * 1.25);
  const rings = ensureRings(m);
  const dim = m.userData.dim ?? 1;
  rings.forEach((seg, i) => {
    const buf = seg.userData.buf ??= new Float32Array(RING_SEGS * 6);
    /* A STANDING wave: the lobes stay where they are and swell and invert in
       place, rather than the pattern rotating round the ring. So the angle term
       and the time term are separate factors — sin(kθ) fixes where the nodes
       are, sin(ωt) drives them. Twice a cycle the amplitude passes through zero
       and the ring is briefly a perfect circle, which is what makes it read as
       something vibrating rather than something spinning. */
    const wave = RING_WAVES[i];
    const anchor = (m.userData.phase || 0) + wave.rot;
    const tOff = RING_SPLIT[i] * Math.PI * 2;
    /* how hard each mode is driven right now — where its nodes sit does not move */
    const drive = wave.modes.map((md, q) => Math.sin(t * RING_SPEED * md.r + tOff + q * 1.9) * md.a);
    const wob = a => {
      let v = 0;
      for (let q = 0; q < wave.modes.length; q++)
        v += Math.sin(wave.modes[q].k * a + anchor + q * 1.3) * drive[q];
      return v * RING_NORM;
    };
    const Ri = R * RING_SPREAD[i];
    for (let j = 0; j < RING_SEGS; j++){
      const a0 = (j / RING_SEGS) * Math.PI * 2, a1 = ((j + 1) / RING_SEGS) * Math.PI * 2;
      const r0 = Ri * (1 + RING_AMP * wob(a0));
      const r1 = Ri * (1 + RING_AMP * wob(a1));
      const o = j * 6;
      if (m.userData.workingRing){
        /* Work items spin in world space, so their ring lives in XY and its
           own orientation faces the camera instead of inheriting that spin. */
        buf[o]   = Math.cos(a0) * r0; buf[o+1] = Math.sin(a0) * r0; buf[o+2] = 0;
        buf[o+3] = Math.cos(a1) * r1; buf[o+4] = Math.sin(a1) * r1; buf[o+5] = 0;
      } else {
        buf[o]   = Math.cos(a0) * r0; buf[o+1] = 0; buf[o+2] = Math.sin(a0) * r0;
        buf[o+3] = Math.cos(a1) * r1; buf[o+4] = 0; buf[o+5] = Math.sin(a1) * r1;
      }
    }
    /* setPositions builds fresh attributes every call. The buffer is ours and
       its size never changes, so hand it over once and thereafter just tell the
       GPU the contents moved — this runs every frame for every working agent. */
    if (seg.userData.wired) seg.geometry.attributes.instanceStart.data.needsUpdate = true;
    else { seg.geometry.setPositions(buf); seg.userData.wired = true; }
    /* A ghosted agent is still working, so the ring keeps moving and simply
       goes translucent with the rest of it. Hiding it outright — the rule tags
       follow — would have said the opposite: that the work had stopped. */
    /* 10% at full strength. Ghosting halves it rather than applying the scene's
       0.2 — at a tenth of a tenth the ring would have vanished, and an agent
       that is out of scope is still working. */
    seg.material.opacity = .1 * (dim < .999 ? .5 : 1);
    if (m.userData.workingRing) seg.lookAt(camera.position);
    seg.visible = m.userData.workingRing ? layerState.workItems : layerState.agents;
  });
}

/* lub-dub: a sharp contraction, a softer one just after it, then rest.
   Gaussian rather than sinusoidal so the beats are distinct events with a real
   pause between them — that pause is what makes it read as a pulse. */
function heartbeat(t, period){
  const p = ((t % period) + period) % period / period;
  const thump = (centre, width) => Math.exp(-((p - centre) * (p - centre)) / (2 * width * width));
  return Math.min(1, thump(.07, .032) + .58 * thump(.21, .038));
}

const clock = new THREE.Clock();
function tickFrame(){
  requestAnimationFrame(tickFrame);
  const t = clock.getElapsedTime();
  if (Math.abs(chromeOff.x - chromeAim.x) > .25 || Math.abs(chromeOff.y - chromeAim.y) > .25){
    /* .09 settles to within a few pixels across the flight's ~33 frames while
       keeping the first step small — the pane opening should read as the view
       easing over, not as a shove */
    chromeOff.x += (chromeAim.x - chromeOff.x) * .09;
    chromeOff.y += (chromeAim.y - chromeOff.y) * .09;
    commitChromeOffset();
  }
  if (flight){
    flight.k = Math.min(1, flight.k + .03);
    const e = flight.k*flight.k*(3-2*flight.k);   /* smoothstep */
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.t0, flight.t1, e);
    if (flight.k >= 1){ flight.after?.(); flight = null; }
  } else if (!userMoved && view.framing!=='restoring' && view.input!=='brush'
             && !spatialMedia.matches){
    orbitAngle += .00057;          /* the ambient turntable, at two thirds */
    camera.position.set(orbitTgt.x + Math.sin(orbitAngle)*orbitR,
                        orbitTgt.y + orbitH,
                        orbitTgt.z + Math.cos(orbitAngle)*orbitR);
    controls.target.copy(orbitTgt); camera.lookAt(orbitTgt);
  }
  /* Strobe whatever the pointer is over. This runs after shading has set each
     material from its base colour, so it is a pure overlay: nothing else has
     to know about hover, and letting go restores the real colour on the next
     frame without bookkeeping. */
  const strobe = hoverKeys.size ? .35 + .35 * Math.sin(t * 9) : 0;
  const dimming = !!hiAgents;
  const fa = id => (!dimming || hiAgents.has(id)) ? 1 : DIM;
  const fi = id => (!dimming || hiItems.has(id)) ? 1 : ITEM_DIM;
  /* The nodes bob, so an arrow anchored to two of them has to be re-laid. Every
     third frame is indistinguishable from every frame at this amplitude and
     costs a third as much geometry churn. */
  /* Every frame while there are few: an arrow that lags its node is an arrow
     pointing slightly beside it, and pointing AT the thing is the whole job.
     Measured at 6.7ms a frame for twelve arrows on software rendering, which
     is fine — but the board allows a hundred, so past a couple of dozen it
     falls back to every third frame and trades a degree of aim for the frame
     rate. */
  const many = arrowGroup.children.length > 24;
  if (arrowGroup.children.length && (!many || (arrowFrame = (arrowFrame + 1) % 3) === 0))
    relayArrows();
  arrowGroup.children.forEach(g => {
    /* An arrow reads as a claim about both ends, so it is only at full strength
       when both ends are: ghosting one end and leaving the arrow bright would
       point at something the view has already dismissed. Under Arrow Focus,
       brightness is membership in the one-hop relationship set instead —
       endpoints lit for another reason do not relight an unrelated arrow. */
    const u = g.userData;
    const endpointF = Math.min(
      u.fromId ? (u.fromId.startsWith('wi_') ? fi(u.fromId) : fa(u.fromId)) : 1,
      u.toId   ? (u.toId.startsWith('wi_')   ? fi(u.toId)   : fa(u.toId))   : 1);
    const f = hiRelations
      ? Math.min(hiRelations.has('arrow:' + u.ar.arrowId) ? 1 : DIM, endpointF)
      : endpointF;
    u.mats.forEach(m => { m.opacity = (m.userData.base ?? 1) * f; });
    u.sprites.forEach(sp => { sp.visible = f > .9; });   /* labels drop out when ghosted, as tags do */
  });
  /* Ghosting is real translucency, not a colour lerp toward the background.
     The lerp only worked on paper: in the dark theme the background is nearly
     black and most node colours are already dark, so fading toward it changed
     almost nothing. Alpha behaves identically in both themes.
     Ghosted meshes stop writing depth so the lit ones read through them; the
     hidden-line look is preserved for everything at full strength. */
  const shade = (mat, base, f) => {
    if (base) mat.color.copy(base);
    const ghost = f < .999;
    if (mat.transparent !== ghost){ mat.transparent = ghost; mat.needsUpdate = true; }
    mat.opacity = f;
    mat.depthWrite = !ghost;
  };
  groundGroup.children.forEach(m=>{
    const u=m.userData;
    if (u.arc){
      const lit = hiRelations ? hiRelations.has('arc:' + u.from + '|' + u.to)
        : (!dimming || (hiAgents.has(u.from) && hiAgents.has(u.to)));
      m.material.opacity = lit ? .9 : .12;
      return;
    }
    if (u.a){
      const f = fa(u.a.id);
      /* Selection is an overlay, not an exemption: a brushed node still ghosts
         when the active layer says it is out of scope. Skipping shade() here
         left every selected node bright underneath a focus, so "everything
         else ghosted" was false exactly where it mattered. */
      shade(m.material, u.selected ? null : u.baseFill, f);
      m.material.visible = layerState.agents;
      if (u.lineMat && !u.selected){ u.lineMat.color.copy(u.baseStroke); }
      if (u.lineMat){ u.lineMat.opacity = .6 * f; u.lineMat.visible = layerState.agents && !u.selected; }
      u.dim = f;
      m.children.forEach(ch => {
        if (!ch.isSprite){
          if (!ch.userData.ringWave) ch.visible = layerState.agents;
          return;
        }
        ch.visible = (ch.userData.isTag ? layerState.annotations : layerState.agentLabels) && f > .9;
        ch.material.opacity = (ch.userData.isTag ? 1 : .85) * f;
      });
    }
    /* An agent taking a turn wears a rippling ring: one sine travelling round
       a circle, drawn three times at the same frequency and amplitude with the
       period offset a little each time, in red, green and blue. Where the three
       coincide they sum back to white; where the offset pulls them apart you
       see the colour fringes. It is chromatic aberration on purpose — a white
       line split into its components — which reads as vibration rather than as
       three separate rings. */
    if (u && u.flash === 'run' && u.a){
      updateRings(m, t);
      if (u.lineMat) u.lineMat.opacity = .5 * (u.dim ?? 1);
    } else if (u && u.flash === 'wait' && u.lineMat){
      u.lineMat.opacity = (.18 + (0.5+0.5*Math.sin(t*2.2+u.phase)) * .55) * (u.dim ?? 1);
    }
  });
  itemGroup.children.forEach(m=>{
    const u=m.userData;
    if (u.w){
      const f = fi(u.w.id);
      /* Selection is an overlay, not an exemption: a brushed node still ghosts
         when the active layer says it is out of scope. Skipping shade() here
         left every selected node bright underneath a focus, so "everything
         else ghosted" was false exactly where it mattered. */
      shade(m.material, u.selected ? null : u.baseFill, f);
      m.material.visible = layerState.workItems;
      if (u.lineMat && !u.selected){ u.lineMat.color.copy(u.baseStroke); }
      if (u.lineMat){ u.lineMat.opacity = .6 * f; u.lineMat.visible = layerState.workItems && !u.selected; }
      u.dim = f;
    }
    /* A FOCUSED item holds still: the tag and composer anchored to it would
       otherwise jitter, which is hard to read and hard to click. Selection is
       not inspection — a brushed item keeps whatever motion it had. */
    /* Coarse non-hover input needs a stable semantic region long enough for
       the system to acquire it. Keep decorative item bob/rotation on desktop,
       but hold items still while projected spatial targets are active. */
    const heldStill = u.w && (view.focus.key === 'i:' + u.w.id || spatialMedia.matches);
    if (u.baseY){
      m.position.y = heldStill ? u.baseY : u.baseY + Math.sin(t*1.2+u.phase)*.25;
    }
    if (u.w && !heldStill) m.rotation.y += .003;
    if (u.w) spin.set(u.w.id, m.rotation.y);
    if (u.workingRing) updateRings(m, t);
    if (u.waitFlash && u.lineMat){ u.lineMat.opacity = (.15 + (0.5+0.5*Math.sin(t*2.6+u.phase))*.6) * (u.dim ?? 1); }
    m.children.forEach(ch=>{
      /* an item's tag must ghost with its node, or a dimmed scene keeps a
         bright label floating over nothing */
      /* Geometry ghosts by lerping into the background and all but vanishes.
         A label at the same factor is still perfectly legible, so it reads as
         unfaded next to its own node — ghosted tags drop out entirely. */
      if (ch.isSprite){
        const f = u.dim ?? 1;
        ch.visible = layerState.annotations && f > .9;
        ch.material.opacity = f;
        return;
      }
      ch.visible = layerState.workItems;
      if (ch.userData.pulse){ ch.lookAt(camera.position); ch.material.opacity=(.4+Math.abs(Math.sin(t*3))*.5)*(u.dim ?? 1); const sc=1+Math.sin(t*3)*.18; ch.scale.set(sc,sc,sc); }
      if (ch.userData.act==='run'){ ch.material.opacity = (.04 + (0.5+0.5*Math.sin(t*2.2))*.18) * (u.dim ?? 1); }
      if (ch.userData.orphanRing){ ch.lookAt(camera.position); ch.material.opacity = .55 * (u.dim ?? 1); }
    });
  });
  const _end = new THREE.Vector3();
  tetherGroup.children.forEach(o=>{
    const u = o.userData;
    const a = APOS[u.hid]; if (!a) return;
    const p = u.itemMesh.position;
    _end.copy(a).add(new THREE.Vector3(0,.25,0));
    const endpointF = Math.min(fa(u.hid), fi(u.itemMesh.userData.w.id));
    const tetherLit = hiRelations
      ? Math.min(hiRelations.has('tether:' + u.itemMesh.userData.w.id + '|' + u.hid) ? 1 : DIM, endpointF)
      : endpointF;
    u.mat.opacity = (u.state==='hold' ? .22 : .4) * tetherLit;
    u.geo.setPositions([p.x,p.y,p.z, _end.x,_end.y,_end.z]);
  });
  /* agent-to-agent links carry the travelling pulse: white crest running from
     the sender to whoever owes the turn */
  linkGroup.children.forEach(o=>{
    const u = o.userData;
    const A = APOS[u.from], B = APOS[u.to];
    if (!A || !B){ o.visible = false; return; }
    o.visible = true;
    const fast = u.state === 'run';
    const linkLit = hiRelations
      ? hiRelations.has('link:' + u.from + '|' + u.to) ? 1 : DIM
      : Math.min(fa(u.from), fa(u.to));
    u.mat.opacity = .5 * linkLit;
    u.head = (u.head + (fast ? .011 : .006)) % 1;
    const pos = u.pos, rgb = u.rgb;
    for (let i = 0; i < TETHER_SEGS; i++){
      const f0 = i/TETHER_SEGS, f1 = (i+1)/TETHER_SEGS, k = i*6;
      pos[k]   = A.x + (B.x-A.x)*f0; pos[k+1] = A.y + (B.y-A.y)*f0 + .25; pos[k+2] = A.z + (B.z-A.z)*f0;
      pos[k+3] = A.x + (B.x-A.x)*f1; pos[k+4] = A.y + (B.y-A.y)*f1 + .25; pos[k+5] = A.z + (B.z-A.z)*f1;
      for (let e = 0; e < 2; e++){
        const f = e ? f1 : f0;
        let d = Math.abs(f - u.head); if (d > .5) d = 1 - d;
        const hot = Math.min(1, Math.exp(-(d*d)/.0022) * (fast ? 1.25 : 1));
        const j = k + e*3;
        rgb[j]   = u.col.r + (1-u.col.r)*hot;
        rgb[j+1] = u.col.g + (1-u.col.g)*hot;
        rgb[j+2] = u.col.b + (1-u.col.b)*hot;
      }
    }
    u.geo.setPositions(pos); u.geo.setColors(rgb);
  });
  for (let i=msgLines.length-1;i>=0;i--){
    const l = msgLines[i], u = l.userData;
    u.life += 1/60;
    if (u.life >= u.span){ scene.remove(l); l.geometry.dispose(); l.material.dispose(); msgLines.splice(i,1); continue; }
    const fade = 1 - u.life/u.span;
    l.material.opacity = u.peak * fade * (0.35 + 0.65*Math.abs(Math.sin(t*11 + u.phase)));
  }
  for (let i=pulses.length-1;i>=0;i--){
    const p=pulses[i]; p.userData.t += .0055;
    if (p.userData.t>=1){ scene.remove(p); pulses.splice(i,1); continue; }
    p.position.copy(p.userData.curve.getPoint(p.userData.t));
    p.material.opacity = 1-p.userData.t;
  }
  positionTagBox();
  controls.update();
  updateSpatialTargets();
  if (hoverLeaders.length) aimLeaders();   /* the nodes just moved */
  if (strobe){
    selectables().forEach(m => {
      const k = selKey(m);
      if (!k || !hoverKeys.has(k)) return;
      m.material.color.lerp(HOVER_WHITE, strobe);
      if (m.userData.lineMat) m.userData.lineMat.color.lerp(HOVER_WHITE, strobe);
    });
  }
  renderer.render(scene, camera);
}
tickFrame();
/* CSS decides the canvas box; we only match the drawing buffer to it. Passing
   false to setSize leaves the CSS size alone, so the two cannot disagree. */
function fitViewport(){
  const r = renderer.domElement.getBoundingClientRect();
  const w = Math.max(1, Math.floor(r.width)), h = Math.max(1, Math.floor(r.height));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  edgeMats.forEach(m => m.resolution.set(w, h));
  autoCollapseLegend();
  measureLegend();
  applyChromeOffset(true);      /* a resize is already a jump; do not ease it */
}
let fitQueued = false;
function queueFit(){
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => { fitQueued = false; fitViewport(); });
}
addEventListener('resize', queueFit);
addEventListener('orientationchange', queueFit);
window.visualViewport?.addEventListener('resize', queueFit);
window.visualViewport?.addEventListener('scroll', queueFit);
new ResizeObserver(queueFit).observe(document.body);
fitViewport();
</script>
</body>
