function buildGround(agents){
  disposeGroup(groundGroup); agentMeshes = {}; APOS = {}; byId = {};
  agents.forEach(a=>byId[a.id]=a);
  const children = {};
  agents.forEach(a=>{ if(a.parent && byId[a.parent]) (children[a.parent] ??= []).push(a.id); });
  const leaves = id => (children[id]?.length) ? children[id].reduce((n,c)=>n+leaves(c),0) : 1;
  /* the graph hangs below the grid: leaves just under the surface, and the
     closer to the root the deeper — Main is the lowest point of the org */
  const HEIGHT = {};
  const hgt = id => HEIGHT[id] ??= (children[id]?.length ? 1 + Math.max(...children[id].map(hgt)) : 0);
  const DEPTH = {};
  function place(id, a0, a1, d){
    const mid=(a0+a1)/2, R=d*12, y = -(.7 + hgt(id)*4.2);
    DEPTH[id] = d;
    APOS[id] = d===0 ? new THREE.Vector3(0,y,0)
                     : new THREE.Vector3(Math.cos(mid)*R, y, Math.sin(mid)*R);
    const kids = children[id]||[]; if(!kids.length) return;
    const total = kids.reduce((n,c)=>n+leaves(c),0);
    let a=a0;
    kids.forEach(cid=>{ const w=(a1-a0)*leaves(cid)/total; place(cid, a, a+w, d+1); a+=w; });
  }
  const roots = agents.filter(a=>!a.parent || !byId[a.parent]);
  roots.forEach((r,i)=>place(r.id, i*(Math.PI*2/roots.length), (i+1)*(Math.PI*2/roots.length), 0));
  agents.forEach(a=>{
    const d = DEPTH[a.id] ?? 2;
    const r = AGENT_R * 1.9 * Math.pow(.72, d);
    /* colour is recency, not role: solid blue when it has just acted,
       fading to grey by an hour idle. A name is a guess; a timestamp is a fact. */
    const IDLE_FULL = 3600;
    const age = (a.idleFor == null) ? IDLE_FULL : Math.min(a.idleFor, IDLE_FULL);
    const col = a.retired ? T.retired
      : new THREE.Color(T.liveHot).lerp(new THREE.Color(T.liveCold), age / IDLE_FULL).getHex();
    const geo = new THREE.CircleGeometry(Math.max(r, .45), 40).rotateX(-Math.PI/2);
    const m = diagramMesh(geo, col);
    m.position.copy(APOS[a.id]); m.position.y += .04;
    m.userData.type='agent'; m.userData.a=a; m.userData.phase=Math.random()*6.28;
    if (!a.retired && a.turn==='run'){ m.userData.lineMat.color.setHex(T.flashRun); m.userData.flash='run'; }
    else if (!a.retired && a.turn==='wait'){ m.userData.lineMat.color.setHex(T.flashWait); m.userData.flash='wait'; }
    m.userData.baseStroke.copy(m.userData.lineMat.color);   /* ghosting shades from here */
    /* label the named layer — Main, owners, patrols, orchestrators;
       the leaf-worker crowd stays tooltip-only */
    if (!a.retired && ['main','po','patrol','orch'].includes(a.kind)){
      const sp = labelSprite(a.name.length>28 ? a.name.slice(0,27)+'…' : a.name);
      sp.position.set(0, 1.15, 0); m.add(sp);
    }
    groundGroup.add(m); agentMeshes[a.id]=m;
  });
  agents.forEach(a=>{
    if(!a.parent || !APOS[a.parent]) return;
    const p=APOS[a.parent], q=APOS[a.id];
    const mid=p.clone().add(q).multiplyScalar(.5);
    mid.y = Math.min(mid.y + p.distanceTo(q)*.12, -.35);   /* bow toward the surface, never through it */
    const curve=new THREE.QuadraticBezierCurve3(p.clone().setY(p.y+.15), mid, q.clone().setY(q.y+.15));
    const pts=curve.getPoints(24);
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const cols=new Float32Array(pts.length*3);
    const c0=new THREE.Color(T.arcA), c1=new THREE.Color(T.arcB);
    pts.forEach((_,i)=>{ const c=c0.clone().lerp(c1,i/(pts.length-1)); cols.set([c.r,c.g,c.b],i*3); });
    geo.setAttribute('color', new THREE.BufferAttribute(cols,3));
    const arc = new THREE.Line(geo, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:.9}));
    arc.userData = {arc:true, from:a.parent, to:a.id};
    groundGroup.add(arc);
  });
}

function buildLinks(links){
  disposeGroup(linkGroup);
  (links||[]).forEach(l=>{
    if (!APOS[l.from] || !APOS[l.to]) return;
    if (!byId[l.from] || !byId[l.to]) return;
    const col = l.state === 'run' ? T.tetherRun : T.tetherWait;
    const lm = new LineMaterial({color:0xffffff, linewidth:2.6, transparent:true,
                                 opacity:.5, vertexColors:true});
    lm.resolution.set(innerWidth, innerHeight); edgeMats.add(lm);
    const lg = new LineSegmentsGeometry()
      .setPositions(new Array(TETHER_SEGS*6).fill(0))
      .setColors(new Array(TETHER_SEGS*6).fill(0));
    const seg = new LineSegments2(lg, lm);
    seg.frustumCulled = false;
    seg.userData = {from:l.from, to:l.to, state:l.state, mat:lm, geo:lg,
                    col:new THREE.Color(col), head:Math.random(),
                    pos:new Float32Array(TETHER_SEGS*6),
                    rgb:new Float32Array(TETHER_SEGS*6)};
    linkGroup.add(seg);
  });
}

/* deterministic scatter from the item id: stable across refreshes, so items
   sharing a centroid spread out instead of forming a column */
function scatter(id){
  let h = 2166136261;
  for (let i = 0; i < id.length; i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
  const a = ((h >>> 0) % 3600) / 3600 * Math.PI * 2;
  const r = 1.1 + (((h >>> 12) & 1023) / 1023) * 3.4;
  return {x: Math.cos(a) * r, z: Math.sin(a) * r, phase: a};
}
/* accumulated rotation, kept across rebuilds so the spin does not snap back
   to zero every time the feed refreshes */
const spin = new Map();

function buildItems(items){
  disposeGroup(itemGroup); disposeGroup(tetherGroup); itemMeshes = [];
  items.forEach((w,idx)=>{
    const active = (w.holders||[]).filter(h=>byId[h] && !byId[h].retired);
    const anchor = new THREE.Vector3();
    if (active.length){ active.forEach(h=>anchor.add(APOS[h])); anchor.multiplyScalar(1/active.length); anchor.y = 0; }
    else { anchor.set(-55 + (idx%24)*4.6, 0, 62 + Math.floor(idx/24)*5); }
    const closed = w.state === 'closed';
    /* Altitude IS evidence: items descend as attests accumulate and rest on
       the floor once the evidence is complete (stage>=5) or the item closes.
       This is the board's core metaphor (mike: its removal was a regression;
       restored 2026-08-22). Color grades along the same stages. */
    const stage = w.stage ?? (closed ? 6 : 0);
    const landed = stage >= 5;
    const col = (T.stage && T.stage[stage] != null) ? T.stage[stage]
              : (closed ? T.itemClosed : T.itemOpen);
    const sc = scatter(w.short || w.id);
    const pos = landed
      ? new THREE.Vector3(anchor.x + sc.x, 1.05, anchor.z + 3.2 + sc.z)
      : new THREE.Vector3(anchor.x + sc.x,
                          6 + (4 - Math.min(stage, 4))*4.2 + (idx%3)*.8,
                          anchor.z + sc.z);
    const igeo = new THREE.IcosahedronGeometry(landed ? .475 : .525, 0);
    const mesh = diagramMesh(igeo, col);
    mesh.position.copy(pos);
    Object.assign(mesh.userData, {type:'item', w, phase:sc.phase, closed, landed, baseY: landed? null : pos.y});
    mesh.rotation.y = spin.get(w.id) || 0;
    itemGroup.add(mesh); itemMeshes.push(mesh);
    /* The merge ring is a statement about LANDED work. An open item that has
       not claimed landing gets no ring: "merge unknown" is a tautology for
       unfinished work, not an alarm. */
    const landedRing = landed;
    const dcol = w.merged === true ? T.discBlack
               : w.readyToMerge === true ? T.discG
               : w.code === false ? T.discN
               : w.code === true && w.merged == null ? T.discY
               : null;
    if (landedRing && dcol != null){
      /* solid ring, not a wireframe: the named radius is the OUTER edge and
         the band runs inward from it */
      const R = .8, BAND = .18;
      const dgeo = new THREE.RingGeometry(R - BAND, R, 64).rotateX(-Math.PI/2);
      const disc = new THREE.Mesh(dgeo, new THREE.MeshBasicMaterial({
        color: dcol, side: THREE.DoubleSide, transparent: true, opacity: .5 }));
      disc.userData.baseFill = disc.material.color.clone();   /* so ghosting shades it */
      disc.position.set(pos.x,.06,pos.z);
      Object.assign(disc.userData, {type:'item', w, isDisc:true});
      itemGroup.add(disc); itemMeshes.push(disc);
    }
    const vals = Object.values(w.turns||{});
    const act = vals.includes('run') ? 'run' : vals.includes('wait') ? 'wait' : null;
    if (act==='run' && w.state==='open'){
      mesh.userData.workingRing = true;
      mesh.userData.ringR = .78;
    }
    if (act==='wait' && w.state==='open') mesh.userData.waitFlash = true;
    /* custody: an agent holding an open card on this item. Drawn for every
       holder that has no live turn — a turn tether supersedes it. */
    (w.holders||[]).forEach(hid=>{
      if (!byId[hid] || byId[hid].retired) return;
      if ((w.turns||{})[hid]) return;
      const lm = new LineMaterial({color:T.tetherSched, linewidth:1, transparent:true, opacity:.22});
      lm.resolution.set(innerWidth, innerHeight); edgeMats.add(lm);
      const lg = new LineSegmentsGeometry().setPositions([0,0,0, 0,0,0]);
      const seg = new LineSegments2(lg, lm);
      seg.frustumCulled = false;
      seg.userData = {itemMesh:mesh, hid, state:'hold', mat:lm, geo:lg};
      tetherGroup.add(seg);
    });
    Object.entries(w.turns||{}).forEach(([hid,st])=>{
      if (!byId[hid] || byId[hid].retired) return;
      const col = st==='run' ? T.tetherRun : T.tetherWait;
      /* the tether is subdivided so a brightness wave can travel INSIDE it,
         showing direction without adding a separate object */
      const lm = new LineMaterial({color:col, linewidth:1.6, transparent:true, opacity:.4});
      lm.resolution.set(innerWidth, innerHeight); edgeMats.add(lm);
      const lg = new LineSegmentsGeometry().setPositions([0,0,0, 0,0,0]);
      const seg = new LineSegments2(lg, lm);
      seg.frustumCulled = false;
      seg.userData = {itemMesh:mesh, hid, state:st, mat:lm, geo:lg};
      tetherGroup.add(seg);
    });
    if (w.stalled){
      const halo = new THREE.Mesh(new THREE.RingGeometry(.8,.98,32),
        new THREE.MeshBasicMaterial({color:T.halo, side:THREE.DoubleSide, transparent:true, opacity:.7}));
      halo.userData={pulse:true}; mesh.add(halo);
    }
    if (w.state==='open' && !active.length){
      /* orphan mark: a billboard ring AROUND the item, so it never reads as a
         landing marker on the ground */
      const ring = new THREE.Mesh(new THREE.RingGeometry(.78,.9,48),
        new THREE.MeshBasicMaterial({color:T.orphan, side:THREE.DoubleSide,
                                     transparent:true, opacity:.55, depthWrite:false}));
      ring.userData = {orphanRing:true};
      mesh.add(ring);
    }
  });
}

/* ---------- wake pulses ---------- */
const pulseGeo = new THREE.SphereGeometry(.28, 10, 10);
function msgCurve(m){
  const q = APOS[m.to].clone(); q.y += .3;
  if (m.kind === 'substrate'){            /* machinery speaking: rises from below */
    const p = q.clone(); p.y -= 14;
    return new THREE.QuadraticBezierCurve3(p, p.clone().lerp(q,.5), q);
  }
  if (m.kind === 'user'){                 /* the operator: descends from above */
    const p = new THREE.Vector3(q.x*.35, 26, q.z*.35);
    return new THREE.QuadraticBezierCurve3(p, p.clone().lerp(q,.5), q);
  }
  const p = APOS[m.from].clone(); p.y += .3;
  const mid = p.clone().add(q).multiplyScalar(.5);
  mid.y = Math.min(mid.y + 1.6 + p.distanceTo(q)*.16, -.4);
  return new THREE.QuadraticBezierCurve3(p, mid, q);
}
/* every fired wake in the feed animates exactly once — no sampling, no
   manufactured traffic. New wakes in a batch are staggered a little so a
   burst reads as a burst, not a single clump. */
const seenWakes = new Map(), seenMsgs = new Map();
let firstBatch = true;
function reap(map){ const now=Date.now(); map.forEach((ts,k)=>{ if(now-ts>900000) map.delete(k); }); }

/* a wake is a nudge: one dot travels the arc */
function spawnWakes(){
  if (!DATA || !DATA.wakes) return;
  reap(seenWakes);
  DATA.wakes.forEach(w=>{
    const k = w.id || (w.from+'>'+w.to);
    if (seenWakes.has(k)) return;
    seenWakes.set(k, Date.now());
    setTimeout(()=>{
      if (document.hidden || !APOS[w.from] || !APOS[w.to]) return;
      const pu = new THREE.Mesh(pulseGeo, new THREE.MeshBasicMaterial({color:T.pulse, transparent:true}));
      pu.userData={curve:msgCurve({from:w.from, to:w.to, kind:'agent'}), t:0};
      scene.add(pu); pulses.push(pu);
    }, Math.random()*(firstBatch ? 20000 : 1500));
  });
}

/* a message is speech: the connection itself strobes, then fades */
function spawnMessages(){
  if (!DATA || !DATA.messages) return;
  reap(seenMsgs);
  DATA.messages.forEach(m=>{
    const k = m.id || ((m.from||m.kind)+'>'+m.to);
    if (seenMsgs.has(k)) return;
    seenMsgs.set(k, Date.now());
    setTimeout(()=>{
      if (document.hidden || !APOS[m.to]) return;
      if (m.kind === 'agent' && !APOS[m.from]) return;
      const col = m.kind==='substrate' ? T.pulseSub : m.kind==='user' ? T.pulseUser : T.pulse;
      const pts = msgCurve(m).getPoints(28);
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:col, transparent:true, opacity:.9,
                                     depthWrite:false}));
      line.userData = {life:0, span: m.kind==='substrate' ? 1.6 : 2.4,
                       peak: m.kind==='substrate' ? .45 : .85,
                       phase: Math.random()*6.28};
      scene.add(line); msgLines.push(line);
    }, Math.random()*(firstBatch ? 20000 : 1500));
  });
  firstBatch = false;
}

/* Short viewports start with the legend closed so it cannot eat the scene —
   as state, not a media rule, so L can still reveal it. */
let legendUserSet = false;
function autoCollapseLegend(){
  if (legendUserSet) return;
  const el = document.getElementById('legend');
  if (el) el.classList.toggle('collapsed', innerHeight < 620);
  measureLegend();
}

/* ---------- tag composer ----------
   Visible only while a single node is focused; what you type is filed with
   'user' provenance so it renders differently from anything an agent wrote. */
const tagBox = document.getElementById('tagbox');
const tagInput = document.getElementById('taginput');
const swatchEl = document.getElementById('tagswatches');
let tagColor = 'neutral';
function renderSwatches(){
  swatchEl.innerHTML = '';
  Object.entries(T.tag).forEach(([name, hex]) => {
    const b = document.createElement('button');
    b.style.background = hex;
    b.title = name;
    b.className = name === tagColor ? 'on' : '';
    b.addEventListener('click', e => {
      e.stopPropagation();
      tagColor = name; renderSwatches(); tagInput.focus();
    });
    swatchEl.appendChild(b);
  });
}
function showTagBox(){
  if (view.focus.stage !== 1 || !view.focus.key){ hideTagBox(); return; }
  const m = focusMesh();
  const label = m?.userData.w ? (m.userData.w.short || m.userData.w.id)
                              : (m?.userData.a ? m.userData.a.name : '');
  tagBox.querySelector('.who').textContent = label ? '· ' + String(label).slice(0, 26) : '';
  tagBox.style.display = 'block';
  tagInput.value = '';
  renderSwatches();
  positionTagBox();
}
function hideTagBox(){ tagBox.style.display = 'none'; tagInput.blur(); }
/* The composer sits just under the node it writes to, and tracks it — the node
   keeps bobbing and the camera keeps turning, so a fixed corner would drift
   away from its subject. */
const _tv = new THREE.Vector3();
function positionTagBox(){
  if (tagBox.style.display !== 'block') return;
  const m = focusMesh();
  if (!m){ hideTagBox(); return; }
  m.getWorldPosition(_tv).project(camera);
  if (_tv.z > 1){ tagBox.style.visibility = 'hidden'; return; }   /* behind us */
  tagBox.style.visibility = 'visible';
  const x = (_tv.x * .5 + .5) * innerWidth, y = (-_tv.y * .5 + .5) * innerHeight;
  const r = tagBox.getBoundingClientRect();
  tagBox.style.left = Math.round(Math.min(Math.max(10, x - r.width / 2),
                                          innerWidth - r.width - 10)) + 'px';
  /* clear of the node, not sitting on it */
  tagBox.style.top  = Math.round(Math.min(y + 74, innerHeight - r.height - 10)) + 'px';
}
tagInput.addEventListener('keydown', e => {
  e.stopPropagation();                       /* the canvas hotkeys are not for typing */
  if (e.key === 'Enter'){
    const text = tagInput.value.trim();
    const target = view.focus.key ? view.focus.key.slice(2) : null;
    if (text && target){
      apiPostTags([{target, text, source:'user', color: tagColor}]);
      tagInput.value = '';
    }
  }
});

/* ---------- search box ----------
   Typing sets a user filter. Emptying the box clears whatever filter is in
   force, including one an agent supplied — the field is the release valve for
   both. */
const searchEl = document.getElementById('search');
const searchClearBtn = document.getElementById('searchclear');
function releaseFilter(){
  searchEl.value = '';
  activeSearchId = typingCardId = null;  /* the card stays; it is just not running */
  if (typeof renderCards === 'function') renderCards();
  setFilter('none');
  searchEl.blur();
  /* an agent's filter lives on the server too; clearing it only locally would
     leave every other page — and the next page to load — still filtered */
  if (typeof apiClearFilter === 'function') apiClearFilter();
}
searchClearBtn.addEventListener('click', releaseFilter);
searchEl.addEventListener('input', () => {
  searchClearBtn.style.display = searchEl.value ? 'block' : 'none';
  clearTimeout(searchTimer);
  const raw = searchEl.value.trim();
  searchTimer = setTimeout(() => {
    if (!raw){ setFilter('none'); typingCardId = null; activeSearchId = null; renderCards(); }
    else { setFilter('user', {query: raw}); fileSearch(raw); }
  }, 220);                                   /* settle before re-framing */
});
searchEl.addEventListener('keydown', e => {
  e.stopPropagation();                       /* canvas hotkeys are not for typing */
  /* No Escape binding anywhere in this page: browsers claim it in fullscreen,
     so it never arrives, and a shortcut that silently does nothing is worse
     than no shortcut. The × clears the filter. */
  if (e.key === 'Enter'){ searchEl.blur(); }  /* hand the keyboard back */
});

/* ---------- control plane ----------
   A small API lets anything drive this view: read the selection, focus a node,
   select by id, fit, and attach tags. We poll it for commands we have not seen
   and report our selection back. It is best-effort: if the API is absent the
   page behaves exactly as before. */
const API = './api';
const CLIENT_ID = Math.random().toString(36).slice(2, 10);
let apiSeq = 0, apiTagsRev = -1, apiGen = null, apiUp = false, apiJoined = false;
let tags = [];                                   /* [{tagId,target,text,source}] */

/* every request is bounded and checked: a hung fetch must not stall the loop,
   and a 500 must not read as success */
async function apiFetch(path, init){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 4000);
  try {
    const r = await fetch(API + path, {...init, signal: ctl.signal, cache:'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function apiPull(){
  try {
    const d = await apiFetch(`/pull?since=${apiSeq}`);
    if (typeof d?.seq !== 'number') throw new Error('bad shape');
    /* a new generation means the service restarted: sequence numbers and tag
       revisions from the old one mean nothing, so resynchronise rather than
       trying to apply a delta across the discontinuity */
    if (apiGen !== null && d.generation !== apiGen){
      apiSeq = d.seq; apiTagsRev = -1;
    }
    apiGen = d.generation ?? apiGen;
    /* fell further behind than the server's history: it told us, so do not
       pretend the missing commands were applied */
    /* Commands are a broadcast log. A page that loads later must not replay
       history — a filter or focus somebody issued an hour ago would land on a
       view that never asked for it. Join at the current head instead. */
    if (!apiJoined){ apiJoined = true; apiSeq = d.seq; }
    else if (d.gap) apiSeq = d.seq;
    else for (const c of (d.commands || [])){
      try { applyCommand(c); } catch(e){ /* one bad command must not wedge the loop */ }
    }
    if (d.tagsRev !== apiTagsRev){
      apiTagsRev = d.tagsRev; tags = Array.isArray(d.tags) ? d.tags : []; buildTags();
    }
    if (d.arrowsRev !== arrowsRev){
      arrowsRev = d.arrowsRev; arrows = Array.isArray(d.arrows) ? d.arrows : []; buildArrows();
      checkArrowFocusValidity();   /* the selected arrow may have just been deleted */
    }
    if (d.searchesRev !== searchesRev){
      searchesRev = d.searchesRev;
      searches = Array.isArray(d.searches) ? d.searches : [];
      renderCards();
    }
    if (typeof d.seq === 'number' && d.seq >= apiSeq) apiSeq = d.seq;
    apiUp = true;
  } catch(e){ apiUp = false; }
}

/* single flight: setInterval would let a slow request overlap a fast one and
   apply responses out of order */
async function apiLoop(){
  for (;;){
    await apiPull();
    await new Promise(r => setTimeout(r, 1000));
  }
}

async function apiReportSelection(){
  if (!apiUp) return;
  const describe = (kind, id) => {
    const w = kind === 'item' ? (DATA?.items || []).find(x => x.id === id) : null;
    const a = kind === 'agent' ? (DATA?.agents || []).find(x => x.id === id) : null;
    return {id, type: kind, title: w ? w.title : (a ? a.name : null)};
  };
  const sel = [...view.selection].map(k =>
    describe(k.slice(0,1) === 'i' ? 'item' : 'agent', k.slice(2)));
  /* What a focus or filter is highlighting is a different question from what a
     human brushed, so report both rather than conflating them. */
  const foc = [
    ...[...(hiItems || [])].map(id => describe('item', id)),
    ...[...(hiAgents || [])].map(id => describe('agent', id)),
  ];
  /* Name the layer that is actually rendering, innermost first — the same
     order the scene uses. Reporting the filter while a focus was lit told an
     agent "filter" and handed it the focus's nodes, which is a lie about which
     question the view is answering. */
  const mode = view.focus.stage === 2 ? 'neighborhood'
             : view.focus.stage === 1 ? 'single'
             : view.focus.stage === 3 ? 'arrow'
             : view.filter.kind !== 'none' ? 'filter' : 'none';
  /* An agent reading the report must be able to tell this is Arrow Focus and
     which arrow, not just that "some focus" is up.

     server/tb-atc-api.py:540 allowlists focusMode to
     none|single|neighborhood|filter and silently downgrades anything else to
     "none" — out of reach here (assignment is web/index.html only). The
     server does NOT filter `focused[].type`, only length-clips it, so the
     selected arrow's identity still reaches a reader as a synthetic entry
     there even though the mode field itself round-trips as "none". */
  const focArrow = view.focus.stage === 3 ? (() => {
    const ar = arrowById(view.focus.arrow);
    return {arrowId: view.focus.arrow, from: ar?.from ?? null, to: ar?.to ?? null};
  })() : null;
  if (focArrow) foc.push({id: focArrow.arrowId, type: 'arrow',
    title: (arrowById(focArrow.arrowId)?.text) || (focArrow.from + ' → ' + focArrow.to)});
  const body = JSON.stringify({clientId: CLIENT_ID, selection: sel,

                                        target: controls.target.toArray(),
                                        framing: view.framing, inFlight: !!flight}});

     this viewer is still connected. Other viewers have separate records. */
  if (body === lastReport && ++reportSkips < 5) return;
  reportSkips = 0;
  try {
    await apiFetch('/selection', {method:'POST', headers:{'content-type':'application/json'}, body});
    lastReport = body;
  } catch(e){ apiUp = false; }
}

  /* never clear locally on failure: the page would show an empty board while

       unqualified sweep; this key IS the deliberate one, so it says so */
    await apiFetch('/tags?all=true', {method:'DELETE'});
    await apiFetch('/arrows?all=true', {method:'DELETE'});

/* A human's stroke outranks an agent's command. Applied mid-drag, a focus or

function applyCommand(c){
  if (selecting && (c.kind === 'focus' || c.kind === 'filter' || c.kind === 'fit')){
    heldCommands.push(c);

  }
  if (c.kind === 'select'){
    if (c.clear) view.selection.clear();
    (Array.isArray(c.add) ? c.add : []).forEach(id => view.selection.add(selKeyFor(id)));
    (Array.isArray(c.remove) ? c.remove : []).forEach(id => view.selection.delete(selKeyFor(id)));
    selectionChanged(); apiReportSelection();
  } else if (c.kind === 'focus'){
    if (c.mode === 'clear'){ endFocus('api-clear'); return; }
    /* API focus shares the same node seam as a pointer click, so it cannot
       leave a subject or camera the pointer path would not have. */
    focusNode(selKeyFor(c.id), c.mode === 'neighborhood' ? 'neighborhood' : 'single');
  } else if (c.kind === 'filter'){
    if (c.clear){ setFilter('none'); activeSearchId = typingCardId = null; renderCards(); }
    else if (c.resultKind === 'ids' || (c.ids || []).length){
      setFilter('agent', {ids: c.ids || []});
      if (c.searchId){ activeSearchId = c.searchId; renderCards(); }
    } else if (c.query){
      /* a text search on the wire — the same thing a human types */
      searchEl.value = c.query;

      setFilter('user', {query: c.query});
      if (c.searchId){ activeSearchId = typingCardId = c.searchId; renderCards(); }
    } else { setFilter('none'); activeSearchId = typingCardId = null; renderCards(); }

/* ids arrive bare from the API; internally they carry a kind prefix. The kind
   is decided by the id's own shape, not by searching the current feed — a
   lookup would mislabel anything that arrives before the first snapshot, or
   any node not currently on screen. */
/* Callers may hand us a short work-item id — the form the cards display, or
   one saved in a tag before the feed carried full ids — so resolve it. */
function fullId(id){
  const s = String(id);
  if (!s.startsWith('wi_')) return s;
  const items = (DATA && DATA.items) || [];
  if (items.some(w => w.id === s)) return s;
  const hit = items.find(w => w.id.startsWith(s + '-'));
  return hit ? hit.id : s;
}

function selKeyFor(id){
  const s = String(id);
  if (s.startsWith('i:') || s.startsWith('a:')) return s;
  return s.startsWith('wi_') ? 'i:' + fullId(s) : 'a:' + s;
}

/* A feed whose ids change shape would strand every key the view holds — the
   selection would empty and a focus would quietly stop highlighting anything,
   with no sign that it had. Re-resolve them whenever a snapshot lands. */
function migrateViewKeys(){
  const remap = k => k.startsWith('i:') ? 'i:' + fullId(k.slice(2)) : k;
  const sel = [...view.selection].map(remap);
  view.selection.clear(); sel.forEach(k => view.selection.add(k));
  if (focusLayer && focusLayer.subject.kind === 'node' && focusLayer.subject.key){
    focusLayer.subject.key = remap(focusLayer.subject.key);
    projectFocus();
  }
  if (view.filter.ids) view.filter.ids = new Set([...view.filter.ids].map(fullId));
}

/* ---------- live feed ---------- */
async function refresh(){
  try {
    const r = await fetch('./data.json?ts='+Date.now(), {cache:'no-store'});
    if (!r.ok) throw 0;
    const d = await r.json();
    if (d.generatedAt === lastGen) return;
    lastGen = d.generatedAt; DATA = d;
    migrateViewKeys();
    const firstSnapshot = !_rested;
    const h = d.agents.map(a=>a.id+(a.retired?1:0)+(a.turn||'')).join('|');
    if (h !== agentsHash){ agentsHash = h; buildGround(d.agents); }
    buildItems(d.items);
    buildLinks(d.links);
    applyView();
    checkArrowFocusValidity();   /* the selected arrow or a root may have just gone */
    /* Main only has a position once the ground has been built, so the resting
       centre is adopted on the first snapshot rather than at startup. */
    /* Recompute while resting so the centre follows the org, but never while
       something is framed or the camera is in someone's hands. */
    if (view.framing === 'none' && !userMoved && !flight && !orbitUserOwned){
      const rest = homeTarget();
      if (firstSnapshot || rest.distanceToSquared(orbitTgt) > .25){
        _rested = true;
        orbitTgt.copy(rest);
        controls.target.copy(orbitTgt);
      }
    }
    spawnWakes(); spawnMessages();
    const age = Math.round((Date.now()-d.generatedAt)/1000);
    const el = document.getElementById('mode');
    el.textContent = 'live · '+d.agents.length+' agents · '+d.items.length+' items · '+age+'s ago';
    el.className = 'live';
  } catch(e){
    if (!DATA){

      buildGround(DATA.agents); buildItems(DATA.items);

   node they describe, so hitting any of them means hitting that node. Raycast

function ownerOf(obj){

  return (o && o.userData.type) ? o : null;

function pickTagOwner(ev){
  mouse.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);

     must follow what is visible, not what is nearest — otherwise clicking a
     tag selects whatever geometry happens to sit in front of it. */
  const sprites = [];
  const collect = m => (m.userData.tagSprites || []).forEach(sp => { if (sp.visible) sprites.push(sp); });
  itemMeshes.forEach(collect);
  Object.values(agentMeshes).forEach(collect);
  const tagHit = ray.intersectObjects(sprites, false)[0];
  if (!tagHit) return null;

   for arrow opacity (hiRelations membership), so click and paint cannot
   disagree. */

  const u = g.userData;

   a focused view that goes silent when you point at its surroundings tells you
   nothing about why they were excluded. */
function pickAllHover(ev, max = 4){
  mouse.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const out = [], seen = new Set();
  const sprites = [];
  selectables().forEach(m => (m.userData.tagSprites || []).forEach(sp => { if (sp.visible) sprites.push(sp); }));
  const consider = o => {
    const owner = ownerOf(o);
    if (!owner || !owner.userData.type || !nodeLayerOn(owner)) return;
    const k = selKey(owner);
    if (!k || seen.has(k)) return;
    seen.add(k); out.push(owner);
  };
  ray.intersectObjects(sprites, false).forEach(h => consider(h.object));
  ray.intersectObjects([...itemMeshes, ...Object.values(agentMeshes)], true)
     .forEach(h => { if (out.length < max) consider(h.object); });
  return out.slice(0, max);

function clearHover(){

function showHover(nodes, ev){
  hoverLayer.textContent = ''; leaderSvg.textContent = '';

  nodes.forEach(n => { const k = selKey(n); if (k) hoverKeys.add(k); });
  if (!nodes.length) return;

  const W = innerWidth, H = innerHeight, PAD = 10;
  const CARD = Math.min(290, W - 2 * PAD);
  /* Where each node actually is on screen. Nodes found together are stacked
     along one line of sight, so these are close and often identical — the
     cards cannot be placed AT them, they have to be placed AROUND them. */
  const pts = nodes.map(n => screenOf(n));
  const cx = pts.reduce((a, p) => a + p.x, 0) / pts.length;
  const cy = pts.reduce((a, p) => a + p.y, 0) / pts.length;

  const cards = nodes.map((node, i) => {
    const el = document.createElement('div');
    el.className = 'hc';
    el.innerHTML = nodeContent(node.userData, true);
    hoverLayer.appendChild(el);
    return {el, pt: pts[i], h: el.getBoundingClientRect().height};
  });

  /* Fan them around the cluster, starting up-right and going clockwise, far
     enough out that no card sits over the things it is describing. One card
     still gets an angle rather than a fixed corner, so a second node appearing
     does not make the first jump somewhere else. */
  const n = cards.length;
  const spread = n === 1 ? [-0.6] : cards.map((_, i) => -Math.PI * 0.75 + i * (Math.PI * 1.5) / (n - 1));
  const reach = 120 + Math.max(...cards.map(c => c.h)) * 0.35;

  cards.forEach((c, i) => {
    const a = spread[i];
    let x = cx + Math.cos(a) * (reach + CARD * 0.5) - CARD / 2;
    let y = cy + Math.sin(a) * (reach + c.h * 0.5) - c.h / 2;
    x = Math.max(PAD, Math.min(W - PAD - CARD, x));
    y = Math.max(PAD, Math.min(H - PAD - c.h, y));
    c.x = x; c.y = y;

  /* Nudge apart anything that still overlaps after clamping — the viewport
     edges push cards back toward each other. */
  for (let pass = 0; pass < 3; pass++){
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){
      const a = cards[i], b = cards[j];
      const overlapY = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
      const overlapX = Math.min(a.x + CARD, b.x + CARD) - Math.max(a.x, b.x);
      if (overlapX <= 0 || overlapY <= 0) continue;
      const push = (overlapY + 8) / 2;
      if (a.y < b.y){ a.y -= push; b.y += push; } else { a.y += push; b.y -= push; }
      a.y = Math.max(PAD, Math.min(H - PAD - a.h, a.y));
      b.y = Math.max(PAD, Math.min(H - PAD - b.h, b.y));
    }
  }

  cards.forEach((c, i) => {
    c.el.style.left = c.x + 'px'; c.el.style.top = c.y + 'px';
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('r', 3);
    leaderSvg.appendChild(ln); leaderSvg.appendChild(dot);
    hoverLeaders.push({node: nodes[i], ln, dot, x: c.x, y: c.y, w: CARD, h: c.h});
  });

}

/* Point every leader at where its node is NOW. The line leaves the card at the
   point on its border facing the node, so it always reads as coming out of
   that card however the node has drifted. */
function aimLeaders(){
  for (const L of hoverLeaders){
    const p = screenOf(L.node);
    const mx = L.x + L.w / 2, my = L.y + L.h / 2;
    const dx = p.x - mx, dy = p.y - my;
    const t = Math.min(Math.abs(dx) > 1e-3 ? (L.w / 2) / Math.abs(dx) : Infinity,
                       Math.abs(dy) > 1e-3 ? (L.h / 2) / Math.abs(dy) : Infinity);
    L.ln.setAttribute('x1', mx + dx * t); L.ln.setAttribute('y1', my + dy * t);
    L.ln.setAttribute('x2', p.x); L.ln.setAttribute('y2', p.y);
    L.dot.setAttribute('cx', p.x); L.dot.setAttribute('cy', p.y);
  }

let hoverGrace = null;
addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  if (!onCanvas(e)){ clearTimeout(hoverGrace); hoverGrace = null; return clearHover(); }
  const nodes = pickAllHover(e);
  if (!nodes.length){
    /* Nodes drift under a stationary pointer, so an empty pick usually means
       the thing bobbed off the cursor rather than that the pointer left it.
       Keep whatever is already hovered while it stays near — a card set that
       tears down and rebuilds every time an item breathes is unusable — and
       only give up once the pointer is genuinely somewhere else. */
    const held = hoverLeaders.filter(L => {
      const q = screenOf(L.node);
      return Math.hypot(q.x - e.clientX, q.y - e.clientY) < HOVER_HOLD;
    });
    if (held.length){ clearTimeout(hoverGrace); hoverGrace = null; return; }
    if (hoverKeys.size && hoverGrace == null)
      hoverGrace = setTimeout(() => { hoverGrace = null; clearHover(); }, 160);
    return;
  }

     on every pointer event re-anchored them to the cluster's centre, which
     bobs with the nodes — so the smallest hand movement shuffled the cards
     around. The line tracks the animation; the cards hold still. */

  if (keys.length === hoverKeys.size && keys.every(k => hoverKeys.has(k))) return;

function selectables(){
