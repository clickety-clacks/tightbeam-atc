<!doctype html>
<html lang="en">
<head>

<title>Tightbeam — Air Traffic Control</title>
<style>
  /* CSS is the single source of geometry: it sizes the canvas box and the
     renderer matches its buffer to the measured box, so the two cannot
     disagree. html carries the background so a light theme shows no gutter. */
  html { background:#101214; }
  html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family: ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif; }
  body { position:relative; background:#101214; }
  canvas { display:block; position:absolute; inset:0; width:100%; height:100%; z-index:0; }
  /* one top bar owns the top edge; children never position themselves */
  #topbar { position:fixed; top:0; left:0; right:0; z-index:6; display:flex;
    flex-wrap:wrap; align-items:flex-start; justify-content:space-between;
    gap:8px 10px; pointer-events:none; box-sizing:border-box;
    padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
            14px calc(18px + env(safe-area-inset-left)); }
  #topright { display:flex; flex-direction:column; align-items:flex-end; gap:8px;
    flex:0 1 auto; min-width:0; max-width:100%; }
  #hud { color:#9a9ea6; font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    background:#101214e6; border:1px solid #2a2d31; border-radius:5px; padding:7px 11px;
    flex:1 1 auto; min-width:0; max-width:100%; box-sizing:border-box;
    overflow-wrap:anywhere; }
  #hud b { color:#b08d57; font-weight:600; }
  #hud .live { color:#6fae4e; } #hud .sample { color:#c9a835; }
  /* the bottom bar spans both edges, so it can never run off either side */
  #legend { position:fixed; z-index:6;
    bottom:calc(14px + env(safe-area-inset-bottom));
    left:calc(18px + env(safe-area-inset-left)); right:calc(18px + env(safe-area-inset-right));
    color:#7c8188; font-size:11px; line-height:1.9; pointer-events:none;
    background:#101214e6; border:1px solid #2a2d31; border-radius:5px;
    padding:8px 12px; box-sizing:border-box; max-height:32dvh; overflow:auto;
    scrollbar-width:thin; }
  #legend.collapsed { display:none; }
  @supports not (max-height: 1dvh){ #legend { max-height:32vh; } }
  .sw { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  #tip { position:fixed; display:none; background:#1b1e22ee; color:#d8d6d1;
    border:1px solid #3a3d42; border-left:3px solid #b08d57; border-radius:4px;
    padding:8px 12px; font-size:12.5px; line-height:1.5; pointer-events:none;

    overflow-wrap:anywhere; }
  #tip .t { color:#b08d57; font-weight:600; }
  #tip .seg { color:#9a9ea6; font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  #themehint { color:#7c8188; font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; background:#101214e6; border:1px solid #2a2d31;
    border-radius:5px; padding:6px 10px; pointer-events:none; max-width:100%;
    box-sizing:border-box; overflow-wrap:anywhere; }
  body.light { background:#f2eee2; }
  html:has(body.light) { background:#f2eee2; }
  body.light #hud { color:#5c6b78; background:#f2eee2e8; border-color:#c3cdd8; } body.light #hud b { color:#c23b22; }
  body.light #hud .live { color:#2e7d5b; } body.light #hud .sample { color:#c9a227; }
  body.light #legend { color:#5c6b78; background:#f2eee2e8; border-color:#c3cdd8; }
  body.light #tip { background:#faf7eeee; color:#26323c; border-color:#b8c7d9; border-left-color:#c23b22; }
  body.light #tip .t { color:#c23b22; } body.light #tip .seg { color:#5c6b78; }
  body.light #themehint { color:#8a97a3; background:#f2eee2e8; border-color:#c3cdd8; }
  @media (max-width: 1150px){ #hud .title { display:none; } }
  @media (max-width: 760px){
    #legend { font-size:10px; line-height:1.7; }
    #hud, #themehint, #selui { letter-spacing:.08em; font-size:10px; }
  }

  /* Hovering shows a transient card; focusing one node promotes the same
     content to a pane that owns the right edge — or the bottom in portrait,
     where horizontal room is the scarce thing. */
  #detail { position:fixed; z-index:7; display:none; box-sizing:border-box;
    top:76px; right:18px; width:min(400px, 36vw); max-height:calc(100vh - 120px);
    /* the pane never trims: it scrolls, and the scroll stays inside it */
    overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    scrollbar-width:thin; overflow-wrap:anywhere;
    background:#1b1e22f2; border:1px solid #3a3d42;
    border-left:3px solid #b08d57; border-radius:5px; padding:12px 14px;
    color:#d8d6d1; font-size:12.5px; line-height:1.55; }
  #detail .t { color:#b08d57; font-weight:650; font-size:13px; display:block; margin-bottom:6px; }
  #detail .seg { color:#9a9ea6; font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  #detail .k { color:#7c8188; text-transform:uppercase; letter-spacing:.12em;
    font-size:9.5px; display:block; margin:10px 0 3px; }
  body.light #detail { background:#faf7eef7; border-color:#b8c7d9;
    border-left-color:#c23b22; color:#26323c; }
  body.light #detail .t { color:#c23b22; }
  body.light #detail .seg, body.light #detail .k { color:#5c6b78; }
  @media (max-aspect-ratio: 1/1){
    #detail { top:auto; left:18px; right:18px; width:auto;
      bottom:calc(14px + env(safe-area-inset-bottom)); max-height:46vh; }
  }
  /* five lines then an ellipsis — never a silent trim */
  .clamp5 { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  #tagbox { position:fixed; z-index:7; display:none; background:#1b1e22f2;
    border:1px solid #3a3d42; border-left:3px solid #b08d57; border-radius:5px;
    padding:9px 11px; color:#9a9ea6; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; max-width:min(300px, calc(100vw - 36px));
    box-sizing:border-box; }
  #tagbox input { display:block; margin-top:6px; width:100%; box-sizing:border-box;
    background:#101214; border:1px solid #3a3d42; border-radius:3px; color:#d8d6d1;
    padding:5px 7px; font-size:12px; font-family:inherit; letter-spacing:0;

  body.light #tagbox .who { color:#c23b22; }
  #searchwrap { display:flex; align-items:center; gap:7px; pointer-events:auto;

    padding:5px 8px; box-sizing:border-box; max-width:100%; }

  #searchcount { font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:#7c8188; white-space:nowrap; }
  #searchclear { display:none; flex:0 0 auto; width:15px; height:15px;
    border-radius:50%; border:0; padding:0; cursor:pointer; line-height:15px;

    background:#3a3d42; color:#d8d6d1; pointer-events:auto; }
  #searchclear:hover { background:#4c5158; }
  body.light #searchclear { background:#c3cdd8; color:#26323c; }
  body.light #searchclear:hover { background:#aab8c6; }
  body.light #searchwrap { background:#f2eee2e8; border-color:#c3cdd8; }
  body.light #search { color:#26323c; }

  body.light #searchcount { color:#5c6b78; }
  #selcursor { position:fixed; border:1.5px solid #b08d57; border-radius:50%;

  #selcursor.unsel { border-color:#c4453c; border-style:dashed; }
  body.light #selcursor { border-color:#c23b22; }
  #selui { pointer-events:none; box-sizing:border-box; max-width:100%;
    background:#1b1e22dd; border:1px solid #3a3d42; border-radius:5px;

    text-transform:uppercase; }
  #selui input { width:min(130px, 26vw); vertical-align:middle; pointer-events:auto; }
  #selui.off { display:none; }
  #selui b { color:#b08d57; }

  body.light #selui b { color:#c23b22; }
</style>

<body>
<div id="topbar">
  <div id="hud"><span class="title"><b>Tightbeam</b> · air traffic control · </span><span id="mode" class="sample">connecting…</span></div>
  <div id="searchwrap">
    <span id="searchpill">agent search</span>

  </div>
  <div id="topright">
    <div id="themehint">/ search · S select · T theme · L legend · C clear notes</div>
    <div id="selui" class="off">select radius <input id="selrad" type="range" min="8" max="220" value="46"> <b><span id="selradv">46</span>px</b> · <span id="selcount">0</span> sel · [ ] size · f fit · d clear</div>
  </div>

<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './addons/controls/OrbitControls.js';
import { LineSegments2 } from './addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from './addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from './addons/lines/LineMaterial.js';
const edgeMats = new Set();
let searchTimer = null;      /* declared here so setFilter, above the box, can cancel it */
const TETHER_SEGS = 40;   /* subdivisions per tether, for the traveling wave */

const STAGE_NAMES = ['specced','building','tests pass','reviewed','verdict clean','gate ready','merged'];
const SEGS = ['spec bound','producer completion','tests + baselines','independent review','reviewed-clean verdict','merge attest'];
const KIND_R = { main:1.7, po:1.25, patrol:1.15, orch:1.0, coder:.8, rev:.8, spec:.8 };

const THEMES = {
  dark: {
    name:'dark', bg:0x101214, fill:0x14171b, fogNear:70, fogFar:190,
    grid1:0x2a2d31, grid2:0x1c1f23,
    stage:[0xc4453c,0xc97b35,0xc9a835,0xa3b23c,0x6fae4e,0x3f9d63,0x2c7a4b],
    kind:{main:0xb08d57,po:0xa58968,patrol:0xc9a835,orch:0x8a8f96,coder:0x7f8890,rev:0x6b7684,spec:0x91836b},
    liveHot:0x3d8fd6, liveCold:0x4e545c,
    tag:{neutral:'#9aa0a8', red:'#e0685c', amber:'#d9a441', green:'#6fae4e',
         cyan:'#4bb8b8', blue:'#5aa9e6', violet:'#a98bd8'},
    tagBg:'rgba(16,18,20,.62)',      /* the card lets the scene through */
    tagHalo:'rgba(16,18,20,.93)',    /* but each glyph keeps its own backing */
    retired:0x33363a, arcA:0xb08d57, arcB:0x22252a,
    tetherRun:0x6fae4e, tetherWait:0xc9a835, tetherSched:0xb9bfc7, pulse:0xb08d57, pulseSub:0x5f6670, pulseUser:0x6f9ecf,
    discY:0xc9a835, discG:0x2c7a4b, discN:0x555b63, shell:0x9fd8b4, halo:0xc9a835, orphan:0xc4453c,
    flashRun:0x6fae4e, flashWait:0xc9a835,
    metalness:.55, roughness:.3, agentMetal:.75, agentRough:.35, baseEmissive:.25, edges:false,
    amb:0x8a8a92, keyC:0xfff2dd, rimC:0x5b7285,
  },
  light: { /* NASA documentation / plotter paper */
    name:'light', bg:0xf2eee2, fill:0xfaf7ee, fogNear:90, fogFar:230,
    grid1:0xa9bccf, grid2:0xd8dfe6,
    stage:[0xc23b22,0xd07a2a,0xc9a227,0x8a9a2e,0x4e8a4e,0x2e7d5b,0x1f5e46],
    kind:{main:0xc23b22,po:0xb06a3b,patrol:0xc9a227,orch:0x5c6b78,coder:0x6e7b87,rev:0x52616e,spec:0x7a6a4f},
    liveHot:0x2f6fb5, liveCold:0xaab3bc,
    tag:{neutral:'#5c6b78', red:'#c23b22', amber:'#b8860b', green:'#2e7d4f',
         cyan:'#1f7a7a', blue:'#2f6fb5', violet:'#6f4fa8'},
    tagBg:'rgba(250,247,238,.68)',
    tagHalo:'rgba(250,247,238,.96)',
    retired:0xcdc7b8, arcA:0x26323c, arcB:0xd8dfe6,
    tetherRun:0x2e7d4f, tetherWait:0xb8860b, tetherSched:0x1b232b, pulse:0xc23b22, pulseSub:0x8a97a3, pulseUser:0x3d6ea8,
    discY:0xc9a227, discG:0x2e7d5b, discN:0x9aa7b3, shell:0x4e8a6e, halo:0xb8860b, orphan:0xc23b22,
    flashRun:0x2e7d4f, flashWait:0xb8860b,
    metalness:.05, roughness:.85, agentMetal:.05, agentRough:.9, baseEmissive:.0, edges:true,
    amb:0xffffff, keyC:0xfff8ec, rimC:0xb8c7d9,
  },
};
let T = matchMedia('(prefers-color-scheme: light)').matches ? THEMES.light : THEMES.dark;

/* ---------- static scene ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 500);
camera.position.set(0, 34, 66);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI*0.82;   /* the org hangs below the grid — let the camera dip under */
let userMoved = false; controls.addEventListener('start', ()=>userMoved=true);
const amb = new THREE.AmbientLight(0xffffff, .55); scene.add(amb);
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(30,50,20); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, .5); rim.position.set(-30,20,-30); scene.add(rim);
let grid = null;

const groundGroup = new THREE.Group(), itemGroup = new THREE.Group(), tetherGroup = new THREE.Group(), linkGroup = new THREE.Group();
scene.add(groundGroup, itemGroup, tetherGroup, linkGroup);

let DATA = null, byId = {}, APOS = {}, agentMeshes = {}, itemMeshes = [], pulses = [], msgLines = [];
let flight = null, orbitAngle = 0, arrowFrame = 0;

/* ---------- view state ----------
   Two independent things, plus one input mode. Nothing else may hold view
   state; everything visual is derived from here by applyView().

     view.selection  brushed nodes. Persists across rebuilds and mode changes.
     view.focus      {obj, stage}. stage 1 = the node, 2 = its neighbourhood.
     view.input      'navigate' | 'brush'. What the pointer does, nothing more.

   Selection and focus are ORTHOGONAL: neither clears or constrains the other. */
const view = {
  selection: new Set(),
  /* focus holds a STABLE KEY, never a mesh: meshes are rebuilt every five
     seconds, so an object reference goes stale and takes hover, dimming and
     framing with it. focusMesh() resolves the key against the current scene. */
  focus: { key: null, stage: 0 },
  input: 'navigate',
  /* a filter narrows the whole view: everything unmatched ghosts exactly as it
     does under focus. A human types a query; an agent supplies an id list. The
     display is identical either way — only the provenance pill differs. */
  filter: { kind: 'none', query: '', ids: null },
  framing: 'none',               /* 'none' | 'focus' | 'selection' — camera intent */
  fitTarget: 'selection',        /* which framing f/space lands on next */
};
function focusMesh(){
  if (!view.focus.key) return null;
  return selectables().find(m => selKey(m) === view.focus.key) || null;
}
/* derived from view.focus by computeHighlight() — its only writer */
let hiAgents = null, hiItems = null;
const DIM = 0.2;
const HOME_POS = new THREE.Vector3(0,34,66), HOME_TGT = new THREE.Vector3(0,-2,0);
/* ambient tabletop orbit — parameterized so it can resume from any framing
   the user has dragged the camera into, not just the canonical home view */
let orbitR = 66, orbitH = 36;
const orbitTgt = HOME_TGT.clone();
function flyTo(pos, target, after){
  flight = {p0:camera.position.clone(), p1:pos.clone(),
            t0:controls.target.clone(), t1:target.clone(), k:0, after};
}
let lastGen = 0, agentsHash = '';

function disposeGroup(g){
  g.traverse(o=>{ if(o.geometry) o.geometry.dispose();
    if(o.material){ edgeMats.delete(o.material); o.material.map?.dispose?.(); o.material.dispose?.(); } });
  g.clear();
}
/* name label as a camera-facing sprite */
function labelSprite(text){
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = '600 42px ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif';
  ctx.font = font;
  c.width = Math.ceil(ctx.measureText(text).width) + 16; c.height = 60;
  ctx.font = font; ctx.textBaseline = 'middle';
  ctx.fillStyle = T.name==='light' ? '#26323c' : '#d8d6d1';
  ctx.fillText(text, 8, c.height/2);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent:true, opacity:.85, depthTest:false }));
  sp.renderOrder = 10;
  const h = 1.35; sp.scale.set(h*c.width/c.height, h, 1);
  return sp;
}
/* a tag: short text pinned above a node, coloured by who wrote it */
/* Provenance is drawn, not typed: an emoji would arrive in its own colours and
   fight the tag's. A bust for a person, a hexagon for an agent — the hexagon
   echoing the faceted geometry the agents themselves are drawn from. */
function drawTagIcon(ctx, kind, cx, cy, r, color){
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = Math.max(2, r * .22);
  if (kind === 'user'){
    ctx.beginPath();                                   /* head */
    ctx.arc(cx, cy - r * .34, r * .40, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();                                   /* shoulders */
    ctx.arc(cx, cy + r * .92, r * .78, Math.PI * 1.12, Math.PI * 1.88);
    ctx.lineTo(cx + r * .74, cy + r * .96);
    ctx.lineTo(cx - r * .74, cy + r * .96);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath();                                   /* hexagon */
    for (let i = 0; i < 6; i++){
      const a = Math.PI / 6 + i * Math.PI / 3;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/* Canvas pixels per world unit. Raising it shrinks every card on screen
   without touching its resolution — the text is still drawn at 34px and stays
   crisp, it simply occupies less of the world. */
const TAG_PX_PER_UNIT = 80;
const TAG_LINE_PX = 44;              /* baseline-to-baseline inside the card */
const TAG_WRAP_PX = 680;             /* wrap past this: a long single line drew
                                        a card wider than the org it sits over.
                                        Roughly forty characters, so the 80 a
                                        tag may hold becomes two lines, not four */

function wrapTag(ctx, text, first, rest){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  const room = () => (lines.length ? rest : first);
  for (const word of words){
    const trial = line ? line + ' ' + word : word;
    if (ctx.measureText(trial).width <= room() || !line){ line = trial; continue; }
    lines.push(line); line = word;
  }
  if (line) lines.push(line);
  /* a single unbroken run longer than the card can be split anywhere or not
     at all, so split it rather than letting one word set the width */
  const out = [];
  for (const l of lines){
    if (ctx.measureText(l).width <= (out.length ? rest : first)){ out.push(l); continue; }
    let cur = '';
    for (const ch of l){
      if (ctx.measureText(cur + ch).width > (out.length ? rest : first) && cur){ out.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) out.push(cur);
  }
  return out;
}

const TAG_AUTHOR_PX = 32;            /* caption line: who is speaking */

function tagSprite(text, source, color, author){
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = '600 34px ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif';
  ctx.font = font;
  const ICON = 34;                                     /* space reserved for the mark */
  /* the mark sits on the first line, so that line has less room than the rest */
  const lines = wrapTag(ctx, text, TAG_WRAP_PX - ICON, TAG_WRAP_PX);
  /* The mark says whether a person or an agent wrote this. With several agents
     annotating one board that is no longer enough — which agent matters — so a
     named author gets a caption under the text. Agents had started writing it
     into the text themselves, "[watchdog:018] ...", which is the same need. */
  const authorFont = '600 25px ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif';
  let authorW = 0;
  if (author){ ctx.font = authorFont; authorW = ctx.measureText(author).width; ctx.font = font; }
  const textW = Math.max(...lines.map((l, i) => ctx.measureText(l).width + (i ? 0 : ICON)), authorW);
  const w = Math.ceil(textW) + 26;
  const h = lines.length * TAG_LINE_PX + (author ? TAG_AUTHOR_PX : 0) + 14;
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const hot = (T.tag && T.tag[color]) || T.tag.neutral;
  g.fillStyle = T.tagBg;
  g.strokeStyle = hot; g.lineWidth = 2;
  const r = 9;
  g.beginPath();
  g.moveTo(r,1); g.lineTo(w-r,1); g.quadraticCurveTo(w-1,1,w-1,r);
  g.lineTo(w-1,h-1-r); g.quadraticCurveTo(w-1,h-1,w-r,h-1);
  g.lineTo(r,h-1); g.quadraticCurveTo(1,h-1,1,h-1-r);
  g.lineTo(1,r); g.quadraticCurveTo(1,1,r,1); g.closePath();
  g.fill(); g.stroke();
  const firstY = 7 + TAG_LINE_PX / 2;
  drawTagIcon(g, source, 13 + ICON/2 - 4, firstY, 11, hot);
  g.font = font; g.textBaseline = 'middle';
  /* Ink first as a halo, then the letter: the card is translucent now, so a
     glyph crossing a bright node needs its own opacity rather than relying on
     the panel behind it. */
  g.lineJoin = 'round'; g.lineWidth = 6; g.strokeStyle = T.tagHalo || T.tagBg;
  lines.forEach((l, i) => g.strokeText(l, 13 + (i ? 0 : ICON), firstY + i * TAG_LINE_PX));
  g.fillStyle = hot;
  lines.forEach((l, i) => g.fillText(l, 13 + (i ? 0 : ICON), firstY + i * TAG_LINE_PX));
  if (author){
    g.font = authorFont;
    /* the card is 7px padding, then the text lines, then this caption, then
       7px again — measuring it from firstY instead put it half a line low and
       the descenders fell off the bottom edge */
    const ay = 7 + lines.length * TAG_LINE_PX + TAG_AUTHOR_PX / 2;
    g.lineWidth = 5; g.strokeStyle = T.tagHalo || T.tagBg;
    g.strokeText(author, 13, ay);
    g.globalAlpha = .7; g.fillText(author, 13, ay); g.globalAlpha = 1;
  }
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent:true, depthTest:false }));
  sp.renderOrder = 12;
  sp.userData.isTag = true;
  sp.scale.set(w / TAG_PX_PER_UNIT, h / TAG_PX_PER_UNIT, 1);
  return sp;
}

/* hidden-line diagram mesh: background-colored fill that writes depth
   (occludes what's behind it) + visible edges in the stroke color */
function diagramMesh(geo, strokeHex){
  const pastel = new THREE.Color(strokeHex).lerp(new THREE.Color(T.fill), T.name==='light' ? .58 : .72);
  const fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color: pastel, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 }));
  const eg = new THREE.EdgesGeometry(geo, 1);
  const lg = new LineSegmentsGeometry().setPositions(Array.from(eg.attributes.position.array));
  eg.dispose();
  const lineMat = new LineMaterial({color:strokeHex, linewidth:2, transparent:true, opacity:.6});
  lineMat.resolution.set(innerWidth, innerHeight);
  edgeMats.add(lineMat);
  fill.add(new LineSegments2(lg, lineMat));
  fill.userData.lineMat = lineMat;
  fill.userData.baseFill = fill.material.color.clone();
  fill.userData.baseStroke = lineMat.color.clone();
  return fill;
}

function applyTheme(){
  document.body.classList.toggle('light', T.name==='light');
  scene.background = new THREE.Color(T.bg);
  scene.fog = new THREE.Fog(T.bg, T.fogNear, T.fogFar);
  amb.color.setHex(T.amb); key.color.setHex(T.keyC); rim.color.setHex(T.rimC);
  if (grid){ scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  grid = new THREE.GridHelper(220, 55, T.grid1, T.grid2);
  grid.material.transparent = true; grid.material.opacity = .35;
  grid.position.y = 0; scene.add(grid);
  renderLegend();
  if (typeof renderSwatches === 'function' && tagBox.style.display === 'block') renderSwatches();
  if (DATA){ buildGround(DATA.agents); buildItems(DATA.items); buildLinks(DATA.links);
             applyView(); }
}

/* the ghost set is derived from focus alone — never stored independently */
function computeHighlight(){
  if (view.filter.kind !== 'none'){
    hiAgents = new Set(); hiItems = new Set();
    const f = view.filter;
    (DATA?.items || []).forEach(w => { if (filterMatches('i', w)) hiItems.add(w.id); });
    (DATA?.agents || []).forEach(a => { if (filterMatches('a', a)) hiAgents.add(a.id); });
    return;
  }
  const obj = focusMesh();
  if (!obj || view.focus.stage < 1 || !DATA){ hiAgents = hiItems = null; return; }
  hiAgents = new Set(); hiItems = new Set();
  const u = obj.userData;
  /* stage 1 lights only the node itself; everything else fades the same way it
     does in neighbourhood mode */
  if (view.focus.stage === 1){
    if (u.w) hiItems.add(u.w.id); else if (u.a) hiAgents.add(u.a.id);
    return;
  }
  if (u.type === 'item'){
    hiItems.add(u.w.id);
    Object.keys(u.w.turns || {}).forEach(h => hiAgents.add(h));
    (u.w.holders || []).forEach(h => hiAgents.add(h));
  } else if (u.a){
    const id = u.a.id;
    hiAgents.add(id);
    if (u.a.parent) hiAgents.add(u.a.parent);
    (DATA.agents || []).forEach(x => { if (x.parent === id) hiAgents.add(x.id); });
    (DATA.items || []).forEach(w => {
      if ((w.turns || {})[id] || (w.holders || []).includes(id)) hiItems.add(w.id);
    });
  }
}
/* frame everything currently highlighted */
/* one predicate for both provenances: a typed query matches text, an agent's
   list matches membership */
/* A node's visible extent is not just its centre: tags sit above it and run
   sideways, so a fit computed from centres alone crops them at the edge of the
   viewport. Contribute the tag corners too. */
const _fp = new THREE.Vector3();
/* Labels are annotations; the nodes are the subject. A tag quad reaches some
   fifteen world units past its node, so framing one alongside a set of nodes
   pushes the camera out until the nodes themselves are small — the view reads
   as far too wide to answer a question about the nodes. Multi-node framings
   fit the nodes and let labels overflow; single-object focus has room, so it
   still frames the label with the thing it labels. */
function fitPoints(m, out, tags = false){
  out.push(m.position.clone());
  if (!tags) return;
  (m.userData.tagSprites || []).forEach(sp => {
    if (!sp.visible) return;
    sp.getWorldPosition(_fp);
    const rx = sp.scale.x * .5, ry = sp.scale.y * .5;
    out.push(_fp.clone().add(new THREE.Vector3( rx, 0, 0)));
    out.push(_fp.clone().add(new THREE.Vector3(-rx, 0, 0)));
    out.push(_fp.clone().add(new THREE.Vector3(0, ry, 0)));
  });
}

/* Exact framing. Given the points that must end up visible, the point being
   looked at, and a unit direction from it toward the camera, solve the distance
   along that direction at which every point falls inside the frustum — the
   vertical field of view and the horizontal one the aspect implies.

   The three framings used to derive a distance from a bounding-sphere radius
   and then set the camera's height separately, so the distance actually flown
   was longer than the one solved for and the tilt changed what was in frame.
   Each carried a constant (+8, +6, +4) to cover the difference, and on a small
   result set that constant was most of the distance: a three-unit cluster
   framed from fifteen units out, which is the camera reading as too wide. */
const _fdv = new THREE.Vector3(), _fdr = new THREE.Vector3(), _fdu = new THREE.Vector3();
function frameDistance(pts, center, e, {margin = 1.10, usableH = 1, usableV = 1} = {}){
  const half = Math.tan(camera.fov * Math.PI / 360);
  const tanV = half * usableV, tanH = half * camera.aspect * usableH;
  _fdr.crossVectors(e, camera.up);
  if (_fdr.lengthSq() < 1e-6) _fdr.set(1, 0, 0);      /* looking straight down */
  _fdr.normalize();
  _fdu.crossVectors(_fdr, e).normalize();
  let d = 0;
  for (const p of pts){
    _fdv.subVectors(p, center);
    d = Math.max(d, _fdv.dot(e) + margin * Math.max(
      Math.abs(_fdv.dot(_fdr)) / tanH, Math.abs(_fdv.dot(_fdu)) / tanV));
  }
  return d;
}

/* The rectangle actually free of chrome. It is not symmetric — a bar across
   the top, a taller legend along the bottom, the detail pane down one side —
   so framing against the raw viewport centres content below the middle of the
   space that is really available, which reads as a view wanting to be panned
   up, and slides the lowest nodes under the legend. */
function clearRect(){
  const vw = innerWidth, vh = innerHeight;
  const r = {left: 0, right: vw, top: 0, bottom: vh};
  document.querySelectorAll('#topbar, #legend, #detail, #tagbox').forEach(el => {
    const cs = getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden') return;
    const b = el.getBoundingClientRect();
    if (!b.width || !b.height) return;
    if (b.width / vw > .6){                       /* a band across the view */
      if ((b.top + b.bottom) / 2 < vh / 2) r.top = Math.max(r.top, b.bottom);
      else r.bottom = Math.min(r.bottom, b.top);
    } else if ((b.left + b.right) / 2 > vw / 2){  /* hugging one side */
      r.right = Math.min(r.right, b.left);
    } else {
      r.left = Math.max(r.left, b.right);
    }
  });
  /* never let chrome starve the view: fall back to the viewport if it would */
  if (r.right - r.left < vw * .3){ r.left = 0; r.right = vw; }
  if (r.bottom - r.top < vh * .3){ r.top = 0; r.bottom = vh; }
  return {...r, vw, vh};
}

/* Frame `pts` into that rectangle: solve the distance, then aim so the content
   sits at the centre of the clear space rather than the centre of the screen. */
function frameTo(pts, center, e, {margin = 1.15, floor = 6} = {}){
  const b = clearRect();
  const right = new THREE.Vector3().crossVectors(camera.up, e).normalize();
  const up = new THREE.Vector3().crossVectors(e, right).normalize();

  /* Aim the middle of what is being framed, not the centroid of its points.
     A lopsided set — a cluster one side, one node far off the other — puts the
     centroid away from the middle, and the framing then looks off to one side
     however exact the distance is. */
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const _v = new THREE.Vector3();
  for (const pt of pts){
    _v.subVectors(pt, center);
    const x = _v.dot(right), y = _v.dot(up);
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const aim = center.clone()
    .addScaledVector(right, (x0 + x1) / 2)
    .addScaledVector(up,    (y0 + y1) / 2);

  const dist = Math.max(floor, frameDistance(pts, aim, e, {
    margin, usableH: (b.right - b.left) / b.vw, usableV: (b.bottom - b.top) / b.vh }));
  /* The camera targets the middle of what it frames and nothing else. Getting
     that middle to sit in the clear space is applyChromeOffset()'s job, and it
     does it by displacing the projection — aiming off-centre here instead
     would make everything orbit around a point that is not the subject. */
  return {camPos: aim.clone().addScaledVector(e, dist), target: aim};
}

/* The chrome is asymmetric, so the middle of the canvas is not the middle of
   what a viewer can actually see. Displace the projection by the difference:
   the camera keeps looking straight at its subject — so OrbitControls and the
   ambient spin both turn around that subject — while the image lands in the
   space the bar, the legend and the detail pane leave free. */
const chromeOff = {x: 0, y: 0}, chromeAim = {x: 0, y: 0};
function commitChromeOffset(){
  const vw = innerWidth, vh = innerHeight;
  if (Math.abs(chromeOff.x) < .5 && Math.abs(chromeOff.y) < .5) camera.clearViewOffset();
  else camera.setViewOffset(vw, vh, -chromeOff.x, -chromeOff.y, vw, vh);
  camera.updateProjectionMatrix();
}
/* A projection change lands in a single frame, so opening the detail pane —
   which happens before the flight starts — snapped the whole image sideways
   and the zoom then appeared to begin somewhere else. Only the destination is
   set here; tickFrame eases toward it, so the pane opening reads as a pan. */
function applyChromeOffset(immediate){
  const b = clearRect();
  chromeAim.x = (b.left + b.right) / 2 - b.vw / 2;
  chromeAim.y = (b.top + b.bottom) / 2 - b.vh / 2;
  if (immediate){ chromeOff.x = chromeAim.x; chromeOff.y = chromeAim.y; commitChromeOffset(); }
}

/* Where a framing approaches from: the camera's current bearing, lifted to a
   fixed pitch. Deciding the pitch up front is what lets the fit above be exact
   — it solves for the direction actually flown, not a horizontal stand-in. */
function approachDir(center, pitch = .42){
  const e = camera.position.clone().sub(center); e.y = 0;
  if (e.lengthSq() < .01) e.set(1, 0, 1);
  return e.normalize().multiplyScalar(Math.cos(pitch)).setY(Math.sin(pitch)).normalize();
}

function filterMatches(kind, node){
  const f = view.filter;
  if (f.kind === 'agent') return f.ids.has(kind === 'i' ? node.id : node.id);
  const q = f.query;
  if (!q) return false;
  const hay = kind === 'i' ? ((node.title || '') + ' ' + node.id)
                           : ((node.name || '') + ' ' + node.id);
  return hay.toLowerCase().includes(q);
}

function filteredView(){
  const pts = [];
  selectables().forEach(m => {
    const u = m.userData;
    const on = u.w ? hiItems?.has(u.w.id) : (u.a && hiAgents?.has(u.a.id));
    if (on) fitPoints(m, pts);
  });
  if (!pts.length) return null;
  const c = new THREE.Vector3();
  pts.forEach(v => c.add(v)); c.multiplyScalar(1 / pts.length);
  return { center: c, pts, count: pts.length };
}

/* apply a filter and frame what it found */
function setFilter(kind, {query = '', ids = null} = {}){
  /* Typing is debounced, so a keystroke leaves a timer holding the query as it
     was 220ms ago. Anything else that sets the filter in that window — the ×,
     an agent's command — was then undone when the timer fired: the box read
     empty while the view stayed filtered by a word no longer written anywhere.
     This is the single writer, so it is where the pending write is cancelled. */
  if (typeof searchTimer !== 'undefined') clearTimeout(searchTimer);
  view.filter = { kind, query: (query || '').toLowerCase().trim(),
                  ids: ids ? new Set(ids.map(fullId)) : null };
  if (kind === 'none'){ view.filter.query = ''; view.filter.ids = null; }
  applyView();
  renderSearchChrome();
  const nb = kind === 'none' ? null : filteredView();
  if (nb){
    const e = approachDir(nb.center);
    const {camPos, target} = frameTo(nb.pts, nb.center, e);
    view.framing = 'filter'; userMoved = true;
    flyTo(camPos, target.clone(), () => {
      const d = camPos.clone().sub(target);
      orbitR = Math.hypot(d.x, d.z); orbitH = d.y;
      orbitAngle = Math.atan2(d.x, d.z); orbitTgt.copy(target);
      userMoved = false;
    });
  }
}
function renderSearchChrome(){
  const f = view.filter;
  document.getElementById('searchpill').style.display = f.kind === 'agent' ? 'inline-block' : 'none';
  const box = document.getElementById('search');
  if (f.kind === 'agent') box.value = '';
  box.placeholder = f.kind === 'agent' ? 'agent-supplied selection'
                                       : 'filter — press / to search';
  const n = (hiItems?.size || 0) + (hiAgents?.size || 0);
  document.getElementById('searchcount').textContent =
    f.kind === 'none' ? '' : (n ? n + ' shown' : 'no match');
  document.getElementById('searchclear').style.display =
    (f.kind !== 'none' || box.value) ? 'block' : 'none';
}

function neighbourhoodView(){
  const pts = [];
  itemMeshes.forEach(m => { if (m.userData.w && hiItems && hiItems.has(m.userData.w.id)) fitPoints(m, pts); });
  Object.entries(agentMeshes).forEach(([id,m]) => { if (hiAgents && hiAgents.has(id)) fitPoints(m, pts); });
  if (!pts.length) return null;
  const c = new THREE.Vector3();
  pts.forEach(v => c.add(v)); c.multiplyScalar(1/pts.length);
  return {center:c, pts};
}

function renderLegend(){
  const c = i => '#'+T.stage[i].toString(16).padStart(6,'0');
  const hx = v => '#'+v.toString(16).padStart(6,'0');
  document.getElementById('legend').innerHTML =
    STAGE_NAMES.map((n,i)=>`<span class="sw" style="background:${c(i)};${i?'margin-left:10px':''}"></span>${n}`).join('') +
    `<br><span style="color:${hx(T.tetherRun)}">━ green: turn executing now</span>` +
    `<span style="margin-left:12px;color:${hx(T.tetherSched)}">━ faint: holds an open card, no turn</span>` +
    `<span style="margin-left:12px;color:${hx(T.tetherWait)}">━ yellow: turn queued, not started</span>` +
    `<span style="margin-left:12px">hedron flashing = turn waiting · strobing shell = turn running · agent discs flash the same way</span>` +
    `<br><span style="color:${hx(T.liveHot)}">● blue agent = acted just now</span>` +
    `<span style="margin-left:8px;color:${hx(T.liveCold)}">● grey = idle an hour or more</span>` +
    `<span style="margin-left:10px">discs hang below the grid (main deepest, leaves at the surface) · floating solids = work items (altitude = evidence remaining)</span>` +
    `<span style="margin-left:10px;color:${hx(T.discY)}">yellow ring = reviewed, not merged yet</span>` +
    `<span style="margin-left:10px;color:${hx(T.discG)}">green ring = in the branch. we have landed</span>` +
    `<span style="margin-left:10px;color:${hx(T.discN)}">grey ring = nothing to merge</span>` +
    `<span style="margin-left:10px;color:${hx(T.orphan)}">◌ red ring around an item = orphaned, no live holder</span>` +
    `<span style="margin-left:10px;color:${hx(T.pulse)}">traveling dot = wake</span>` +
    `<span style="margin-left:8px;color:${hx(T.pulse)}">strobing line = message</span>` +
    `<span style="margin-left:8px;color:${hx(T.pulseSub)}">substrate (from below)</span>` +
    `<span style="margin-left:8px;color:${hx(T.pulseUser)}">operator (from above)</span>`;
}

function buildGround(agents){
  disposeGroup(groundGroup); agentMeshes = {}; APOS = {}; byId = {};
  agents.forEach(a=>byId[a.id]=a);
  const children = {};
  agents.forEach(a=>{ if(a.parent && byId[a.parent]) (children[a.parent] ??= []).push(a.id); });
  const leaves = id => (children[id]?.length) ? children[id].reduce((n,c)=>n+leaves(c),0) : 1;
  /* the graph hangs below the grid: leaves just under the surface, and the
     closer to the root the deeper — Main is the lowest point of the org */
  const HEIGHT = {};
  const hgt = id => HEIGHT[id] ??= (children[id]?.length ? 1 + Math.max(...children[id].map(hgt)) : 0);
  const DEPTH = {};
  function place(id, a0, a1, d){
    const mid=(a0+a1)/2, R=d*12, y = -(.7 + hgt(id)*4.2);
    DEPTH[id] = d;
    APOS[id] = d===0 ? new THREE.Vector3(0,y,0)
                     : new THREE.Vector3(Math.cos(mid)*R, y, Math.sin(mid)*R);
    const kids = children[id]||[]; if(!kids.length) return;
    const total = kids.reduce((n,c)=>n+leaves(c),0);
    let a=a0;
    kids.forEach(cid=>{ const w=(a1-a0)*leaves(cid)/total; place(cid, a, a+w, d+1); a+=w; });
  }
  const roots = agents.filter(a=>!a.parent || !byId[a.parent]);
  roots.forEach((r,i)=>place(r.id, i*(Math.PI*2/roots.length), (i+1)*(Math.PI*2/roots.length), 0));
  agents.forEach(a=>{
    const d = DEPTH[a.id] ?? 2;
    const r = (KIND_R[a.kind] || KIND_R.coder) * 1.9 * Math.pow(.72, d);
    /* colour is recency, not role: solid blue when it has just acted,
       fading to grey by an hour idle. A name is a guess; a timestamp is a fact. */
    const IDLE_FULL = 3600;
    const age = (a.idleFor == null) ? IDLE_FULL : Math.min(a.idleFor, IDLE_FULL);
    const col = a.retired ? T.retired
      : new THREE.Color(T.liveHot).lerp(new THREE.Color(T.liveCold), age / IDLE_FULL).getHex();
    const geo = new THREE.CircleGeometry(Math.max(r, .45), 40).rotateX(-Math.PI/2);
    const m = diagramMesh(geo, col);
    m.position.copy(APOS[a.id]); m.position.y += .04;
    m.userData.type='agent'; m.userData.a=a; m.userData.phase=Math.random()*6.28;
    if (!a.retired && a.turn==='run'){ m.userData.lineMat.color.setHex(T.flashRun); m.userData.flash='run'; }
    else if (!a.retired && a.turn==='wait'){ m.userData.lineMat.color.setHex(T.flashWait); m.userData.flash='wait'; }
    m.userData.baseStroke.copy(m.userData.lineMat.color);   /* ghosting shades from here */
    /* label the named layer — Main, owners, patrols, orchestrators;
       the leaf-worker crowd stays tooltip-only */
    if (!a.retired && ['main','po','patrol','orch'].includes(a.kind)){
      const sp = labelSprite(a.name.length>28 ? a.name.slice(0,27)+'…' : a.name);
      sp.position.set(0, 1.15, 0); m.add(sp);
    }
    groundGroup.add(m); agentMeshes[a.id]=m;
  });
  agents.forEach(a=>{
    if(!a.parent || !APOS[a.parent]) return;
    const p=APOS[a.parent], q=APOS[a.id];
    const mid=p.clone().add(q).multiplyScalar(.5);
    mid.y = Math.min(mid.y + p.distanceTo(q)*.12, -.35);   /* bow toward the surface, never through it */
    const curve=new THREE.QuadraticBezierCurve3(p.clone().setY(p.y+.15), mid, q.clone().setY(q.y+.15));
    const pts=curve.getPoints(24);
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const cols=new Float32Array(pts.length*3);
    const c0=new THREE.Color(T.arcA), c1=new THREE.Color(T.arcB);
    pts.forEach((_,i)=>{ const c=c0.clone().lerp(c1,i/(pts.length-1)); cols.set([c.r,c.g,c.b],i*3); });
    geo.setAttribute('color', new THREE.BufferAttribute(cols,3));
    const arc = new THREE.Line(geo, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:.9}));
    arc.userData = {arc:true, from:a.parent, to:a.id};
    groundGroup.add(arc);
  });
}

function buildLinks(links){
  disposeGroup(linkGroup);
  (links||[]).forEach(l=>{
    if (!APOS[l.from] || !APOS[l.to]) return;
    if (!byId[l.from] || !byId[l.to]) return;
    const col = l.state === 'run' ? T.tetherRun : T.tetherWait;
    const lm = new LineMaterial({color:0xffffff, linewidth:2.6, transparent:true,
                                 opacity:.5, vertexColors:true});
    lm.resolution.set(innerWidth, innerHeight); edgeMats.add(lm);
    const lg = new LineSegmentsGeometry()
      .setPositions(new Array(TETHER_SEGS*6).fill(0))
      .setColors(new Array(TETHER_SEGS*6).fill(0));
    const seg = new LineSegments2(lg, lm);
    seg.frustumCulled = false;
    seg.userData = {from:l.from, to:l.to, state:l.state, mat:lm, geo:lg,
                    col:new THREE.Color(col), head:Math.random(),
                    pos:new Float32Array(TETHER_SEGS*6),
                    rgb:new Float32Array(TETHER_SEGS*6)};
    linkGroup.add(seg);
  });
}

/* deterministic scatter from the item id: stable across refreshes, so items
   sharing a centroid spread out instead of forming a column */
function scatter(id){
  let h = 2166136261;
  for (let i = 0; i < id.length; i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
  const a = ((h >>> 0) % 3600) / 3600 * Math.PI * 2;
  const r = 1.1 + (((h >>> 12) & 1023) / 1023) * 3.4;
  return {x: Math.cos(a) * r, z: Math.sin(a) * r, phase: a};
}
/* accumulated rotation, kept across rebuilds so the spin does not snap back
   to zero every time the feed refreshes */
const spin = new Map();

function buildItems(items){
  disposeGroup(itemGroup); disposeGroup(tetherGroup); itemMeshes = [];
  items.forEach((w,idx)=>{
    const active = (w.holders||[]).filter(h=>byId[h] && !byId[h].retired);
    const anchor = new THREE.Vector3();
    if (active.length){ active.forEach(h=>anchor.add(APOS[h])); anchor.multiplyScalar(1/active.length); anchor.y = 0; }
    else { anchor.set(-55 + (idx%24)*4.6, 0, 62 + Math.floor(idx/24)*5); }
    const col = T.stage[w.stage];
    /* on the floor once the evidence is complete; the ring says whether it
       actually reached the branch */
    const landed = w.stage >= 5;
    const j = (idx%5)-2;
    const sc = scatter(w.short || w.id);
    const pos = landed
      ? new THREE.Vector3(anchor.x + sc.x, 1.05, anchor.z + 3.2 + sc.z)
      : new THREE.Vector3(anchor.x + sc.x,
                          6 + (4 - w.stage)*4.2 + (idx%3)*.8,
                          anchor.z + sc.z);
    const igeo = new THREE.IcosahedronGeometry(landed? .475 : .525, 0);
    const mesh = diagramMesh(igeo, col);
    mesh.position.copy(pos);
    Object.assign(mesh.userData, {type:'item', w, phase:sc.phase, landed, baseY: landed? null : pos.y});
    mesh.rotation.y = spin.get(w.id) || 0;
    itemGroup.add(mesh); itemMeshes.push(mesh);
    if (landed){
      /* green: the code is in. yellow: code that is not in yet.
         neutral: nothing to merge, the item just needs closing. */
      /* yellow is reserved for work proven to be off the branch; anything
         unverifiable or non-code is neutral, not a pending merge */
      /* green: in the branch. yellow: reviewed and ready, not merged yet.
         grey: nothing to merge (a ruling, recon, guidance) */
      const dcol = (w.stage>=6 || w.merged===true) ? T.discG
                 : (w.code && w.merged===false)    ? T.discY : T.discN;
      /* solid ring, not a wireframe: the named radius is the OUTER edge and
         the band runs inward from it */
      const R = .8, BAND = .18;
      const dgeo = new THREE.RingGeometry(R - BAND, R, 64).rotateX(-Math.PI/2);
      const disc = new THREE.Mesh(dgeo, new THREE.MeshBasicMaterial({
        color: dcol, side: THREE.DoubleSide, transparent: true, opacity: .5 }));
      disc.userData.baseFill = disc.material.color.clone();   /* so ghosting shades it */
      disc.position.set(pos.x,.06,pos.z);
      Object.assign(disc.userData, {type:'item', w, isDisc:true});
      itemGroup.add(disc); itemMeshes.push(disc);
    }
    const vals = Object.values(w.turns||{});
    const act = vals.includes('run') ? 'run' : vals.includes('wait') ? 'wait' : null;
    if (act==='run' && w.stage<6){
      const shell = new THREE.Mesh(new THREE.SphereGeometry(.78, 28, 20),
        new THREE.MeshBasicMaterial({color:T.shell, transparent:true, opacity:.1, depthWrite:false}));
      shell.userData={act:'run'}; mesh.add(shell);
    }
    if (act==='wait' && w.stage<6) mesh.userData.waitFlash = true;
    /* custody: an agent holding an open card on this item. Drawn for every
       holder that has no live turn — a turn tether supersedes it. */
    (w.holders||[]).forEach(hid=>{
      if (!byId[hid] || byId[hid].retired) return;
      if ((w.turns||{})[hid]) return;
      const lm = new LineMaterial({color:T.tetherSched, linewidth:1, transparent:true, opacity:.22});
      lm.resolution.set(innerWidth, innerHeight); edgeMats.add(lm);
      const lg = new LineSegmentsGeometry().setPositions([0,0,0, 0,0,0]);
      const seg = new LineSegments2(lg, lm);
      seg.frustumCulled = false;
      seg.userData = {itemMesh:mesh, hid, state:'hold', mat:lm, geo:lg};
      tetherGroup.add(seg);
    });
    Object.entries(w.turns||{}).forEach(([hid,st])=>{
      if (!byId[hid] || byId[hid].retired) return;
      const col = st==='run' ? T.tetherRun : T.tetherWait;
      /* the tether is subdivided so a brightness wave can travel INSIDE it,
         showing direction without adding a separate object */
      const lm = new LineMaterial({color:col, linewidth:1.6, transparent:true, opacity:.4});
      lm.resolution.set(innerWidth, innerHeight); edgeMats.add(lm);
      const lg = new LineSegmentsGeometry().setPositions([0,0,0, 0,0,0]);
      const seg = new LineSegments2(lg, lm);
      seg.frustumCulled = false;
      seg.userData = {itemMesh:mesh, hid, state:st, mat:lm, geo:lg};
      tetherGroup.add(seg);
    });
    if (w.stalled){
      const halo = new THREE.Mesh(new THREE.RingGeometry(.8,.98,32),
        new THREE.MeshBasicMaterial({color:T.halo, side:THREE.DoubleSide, transparent:true, opacity:.7}));
      halo.userData={pulse:true}; mesh.add(halo);
    }
    if (!active.length){
      /* orphan mark: a billboard ring AROUND the item, so it never reads as a
         landing marker on the ground */
      const ring = new THREE.Mesh(new THREE.RingGeometry(.78,.9,48),
        new THREE.MeshBasicMaterial({color:T.orphan, side:THREE.DoubleSide,
                                     transparent:true, opacity:.55, depthWrite:false}));
      ring.userData = {orphanRing:true};
      mesh.add(ring);
    }
  });
}

/* ---------- wake pulses ---------- */
const pulseGeo = new THREE.SphereGeometry(.28, 10, 10);
function msgCurve(m){
  const q = APOS[m.to].clone(); q.y += .3;
  if (m.kind === 'substrate'){            /* machinery speaking: rises from below */
    const p = q.clone(); p.y -= 14;
    return new THREE.QuadraticBezierCurve3(p, p.clone().lerp(q,.5), q);
  }
  if (m.kind === 'user'){                 /* the operator: descends from above */
    const p = new THREE.Vector3(q.x*.35, 26, q.z*.35);
    return new THREE.QuadraticBezierCurve3(p, p.clone().lerp(q,.5), q);
  }
  const p = APOS[m.from].clone(); p.y += .3;
  const mid = p.clone().add(q).multiplyScalar(.5);
  mid.y = Math.min(mid.y + 1.6 + p.distanceTo(q)*.16, -.4);
  return new THREE.QuadraticBezierCurve3(p, mid, q);
}
/* every fired wake in the feed animates exactly once — no sampling, no
   manufactured traffic. New wakes in a batch are staggered a little so a
   burst reads as a burst, not a single clump. */
const seenWakes = new Map(), seenMsgs = new Map();
let firstBatch = true;
function reap(map){ const now=Date.now(); map.forEach((ts,k)=>{ if(now-ts>900000) map.delete(k); }); }

/* a wake is a nudge: one dot travels the arc */
function spawnWakes(){
  if (!DATA || !DATA.wakes) return;
  reap(seenWakes);
  DATA.wakes.forEach(w=>{
    const k = w.id || (w.from+'>'+w.to);
    if (seenWakes.has(k)) return;
    seenWakes.set(k, Date.now());
    setTimeout(()=>{
      if (document.hidden || !APOS[w.from] || !APOS[w.to]) return;
      const pu = new THREE.Mesh(pulseGeo, new THREE.MeshBasicMaterial({color:T.pulse, transparent:true}));
      pu.userData={curve:msgCurve({from:w.from, to:w.to, kind:'agent'}), t:0};
      scene.add(pu); pulses.push(pu);
    }, Math.random()*(firstBatch ? 20000 : 1500));
  });
}

/* a message is speech: the connection itself strobes, then fades */
function spawnMessages(){
  if (!DATA || !DATA.messages) return;
  reap(seenMsgs);
  DATA.messages.forEach(m=>{
    const k = m.id || ((m.from||m.kind)+'>'+m.to);
    if (seenMsgs.has(k)) return;
    seenMsgs.set(k, Date.now());
    setTimeout(()=>{
      if (document.hidden || !APOS[m.to]) return;
      if (m.kind === 'agent' && !APOS[m.from]) return;
      const col = m.kind==='substrate' ? T.pulseSub : m.kind==='user' ? T.pulseUser : T.pulse;
      const pts = msgCurve(m).getPoints(28);
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:col, transparent:true, opacity:.9,
                                     depthWrite:false}));
      line.userData = {life:0, span: m.kind==='substrate' ? 1.6 : 2.4,
                       peak: m.kind==='substrate' ? .45 : .85,
                       phase: Math.random()*6.28};
      scene.add(line); msgLines.push(line);
    }, Math.random()*(firstBatch ? 20000 : 1500));
  });
  firstBatch = false;
}

/* Short viewports start with the legend closed so it cannot eat the scene —
   as state, not a media rule, so L can still reveal it. */
let legendUserSet = false;
function autoCollapseLegend(){
  if (legendUserSet) return;
  const el = document.getElementById('legend');
  if (el) el.classList.toggle('collapsed', innerHeight < 620);
}

/* ---------- tag composer ----------
   Visible only while a single node is focused; what you type is filed with
   'user' provenance so it renders differently from anything an agent wrote. */
const tagBox = document.getElementById('tagbox');
const tagInput = document.getElementById('taginput');
const swatchEl = document.getElementById('tagswatches');
let tagColor = 'neutral';
function renderSwatches(){
  swatchEl.innerHTML = '';
  Object.entries(T.tag).forEach(([name, hex]) => {
    const b = document.createElement('button');
    b.style.background = hex;
    b.title = name;
    b.className = name === tagColor ? 'on' : '';
    b.addEventListener('click', e => {
      e.stopPropagation();
      tagColor = name; renderSwatches(); tagInput.focus();
    });
    swatchEl.appendChild(b);
  });
}
function showTagBox(){
  if (view.focus.stage !== 1 || !view.focus.key){ hideTagBox(); return; }
  const m = focusMesh();
  const label = m?.userData.w ? (m.userData.w.short || m.userData.w.id)
                              : (m?.userData.a ? m.userData.a.name : '');
  tagBox.querySelector('.who').textContent = label ? '· ' + String(label).slice(0, 26) : '';
  tagBox.style.display = 'block';
  tagInput.value = '';
  renderSwatches();
  positionTagBox();
}
function hideTagBox(){ tagBox.style.display = 'none'; tagInput.blur(); }
/* The composer sits just under the node it writes to, and tracks it — the node
   keeps bobbing and the camera keeps turning, so a fixed corner would drift
   away from its subject. */
const _tv = new THREE.Vector3();
function positionTagBox(){
  if (tagBox.style.display !== 'block') return;
  const m = focusMesh();
  if (!m){ hideTagBox(); return; }
  m.getWorldPosition(_tv).project(camera);
  if (_tv.z > 1){ tagBox.style.visibility = 'hidden'; return; }   /* behind us */
  tagBox.style.visibility = 'visible';
  const x = (_tv.x * .5 + .5) * innerWidth, y = (-_tv.y * .5 + .5) * innerHeight;
  const r = tagBox.getBoundingClientRect();
  tagBox.style.left = Math.round(Math.min(Math.max(10, x - r.width / 2),
                                          innerWidth - r.width - 10)) + 'px';
  /* clear of the node, not sitting on it */
  tagBox.style.top  = Math.round(Math.min(y + 74, innerHeight - r.height - 10)) + 'px';
}
tagInput.addEventListener('keydown', e => {
  e.stopPropagation();                       /* the canvas hotkeys are not for typing */
  if (e.key === 'Enter'){
    const text = tagInput.value.trim();
    const target = view.focus.key ? view.focus.key.slice(2) : null;
    if (text && target){
      apiPostTags([{target, text, source:'user', color: tagColor}]);
      tagInput.value = '';
    }
  }
});

/* ---------- search box ----------
   Typing sets a user filter. Emptying the box clears whatever filter is in
   force, including one an agent supplied — the field is the release valve for
   both. */
const searchEl = document.getElementById('search');
const searchClearBtn = document.getElementById('searchclear');
function releaseFilter(){
  searchEl.value = '';
  setFilter('none');
  searchEl.blur();
  /* an agent's filter lives on the server too; clearing it only locally would
     leave every other page — and the next page to load — still filtered */
  if (typeof apiClearFilter === 'function') apiClearFilter();
}
searchClearBtn.addEventListener('click', releaseFilter);
searchEl.addEventListener('input', () => {
  searchClearBtn.style.display = searchEl.value ? 'block' : 'none';
  clearTimeout(searchTimer);
  const raw = searchEl.value.trim();
  searchTimer = setTimeout(() => {
    if (!raw) setFilter('none');
    else setFilter('user', {query: raw});
  }, 220);                                   /* settle before re-framing */
});
searchEl.addEventListener('keydown', e => {
  e.stopPropagation();                       /* canvas hotkeys are not for typing */
  /* No Escape binding anywhere in this page: browsers claim it in fullscreen,
     so it never arrives, and a shortcut that silently does nothing is worse
     than no shortcut. The × clears the filter. */
  if (e.key === 'Enter'){ searchEl.blur(); }  /* hand the keyboard back */
});

/* ---------- control plane ----------
   A small API lets anything drive this view: read the selection, focus a node,
   select by id, fit, and attach tags. We poll it for commands we have not seen
   and report our selection back. It is best-effort: if the API is absent the
   page behaves exactly as before. */
const API = './api';
const CLIENT_ID = Math.random().toString(36).slice(2, 10);
let apiSeq = 0, apiTagsRev = -1, apiGen = null, apiUp = false, apiJoined = false;
let tags = [];                                   /* [{tagId,target,text,source}] */

/* every request is bounded and checked: a hung fetch must not stall the loop,
   and a 500 must not read as success */
async function apiFetch(path, init){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 4000);
  try {
    const r = await fetch(API + path, {...init, signal: ctl.signal, cache:'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function apiPull(){
  try {
    const d = await apiFetch(`/pull?since=${apiSeq}`);
    if (typeof d?.seq !== 'number') throw new Error('bad shape');
    /* a new generation means the service restarted: sequence numbers and tag
       revisions from the old one mean nothing, so resynchronise rather than
       trying to apply a delta across the discontinuity */
    if (apiGen !== null && d.generation !== apiGen){
      apiSeq = d.seq; apiTagsRev = -1;
    }
    apiGen = d.generation ?? apiGen;
    /* fell further behind than the server's history: it told us, so do not
       pretend the missing commands were applied */
    /* Commands are a broadcast log. A page that loads later must not replay
       history — a filter or focus somebody issued an hour ago would land on a
       view that never asked for it. Join at the current head instead. */
    if (!apiJoined){ apiJoined = true; apiSeq = d.seq; }
    else if (d.gap) apiSeq = d.seq;
    else for (const c of (d.commands || [])){
      try { applyCommand(c); } catch(e){ /* one bad command must not wedge the loop */ }
    }
    if (d.tagsRev !== apiTagsRev){
      apiTagsRev = d.tagsRev; tags = Array.isArray(d.tags) ? d.tags : []; buildTags();
    }
    if (d.arrowsRev !== arrowsRev){
      arrowsRev = d.arrowsRev; arrows = Array.isArray(d.arrows) ? d.arrows : []; buildArrows();
    }
    if (typeof d.seq === 'number' && d.seq >= apiSeq) apiSeq = d.seq;
    apiUp = true;
  } catch(e){ apiUp = false; }
}

/* single flight: setInterval would let a slow request overlap a fast one and
   apply responses out of order */
async function apiLoop(){
  for (;;){
    await apiPull();
    await new Promise(r => setTimeout(r, 1000));
  }
}
let lastReport = '', reportSkips = 0;
async function apiReportSelection(){
  if (!apiUp) return;
  const describe = (kind, id) => {
    const w = kind === 'item' ? (DATA?.items || []).find(x => x.id === id) : null;
    const a = kind === 'agent' ? (DATA?.agents || []).find(x => x.id === id) : null;
    return {id, type: kind, title: w ? w.title : (a ? a.name : null)};
  };
  const sel = [...view.selection].map(k =>
    describe(k.slice(0,1) === 'i' ? 'item' : 'agent', k.slice(2)));
  /* What a focus or filter is highlighting is a different question from what a
     human brushed, so report both rather than conflating them. */
  const foc = [
    ...[...(hiItems || [])].map(id => describe('item', id)),
    ...[...(hiAgents || [])].map(id => describe('agent', id)),
  ];
  const mode = view.filter.kind !== 'none' ? 'filter'
             : view.focus.stage === 2 ? 'neighborhood'
             : view.focus.stage === 1 ? 'single' : 'none';
  const body = JSON.stringify({clientId: CLIENT_ID, selection: sel,
                               focused: foc, focusMode: mode});
  /* Re-assert periodically even when unchanged. Selection is last-writer-wins
     across pages, so a page that goes quiet can be overwritten by another and
     would otherwise never correct the record. */
  if (body === lastReport && ++reportSkips < 5) return;
  reportSkips = 0;
  try {
    await apiFetch('/selection', {method:'POST', headers:{'content-type':'application/json'}, body});
    lastReport = body;
  } catch(e){ apiUp = false; }
}
async function apiPostTags(list){
  try { await apiFetch('/tags', {method:'POST', headers:{'content-type':'application/json'},
                                 body: JSON.stringify({tags:list})}); await apiPull(); }
  catch(e){ apiUp = false; }
}
async function apiClearFilter(){
  try { await apiFetch('/filter', {method:'POST', headers:{'content-type':'application/json'},
                                   body: JSON.stringify({clear:true})}); }
  catch(e){ /* local clear already happened; the server will catch up */ }
}
async function apiClearTags(){
  /* never clear locally on failure: the page would show an empty board while
     the server still holds the tags, and the revision would not correct it */
  try {
    /* the board carries several authors' notes, so the server refuses an
       unqualified sweep; this key IS the deliberate one, so it says so */
    await apiFetch('/tags?all=true', {method:'DELETE'});
    await apiFetch('/arrows?all=true', {method:'DELETE'});
    apiTagsRev = -1; arrowsRev = -1; await apiPull();
  } catch(e){ apiUp = false; }
}
function applyCommand(c){
  if (c.kind === 'select'){
    if (c.clear) view.selection.clear();
    (Array.isArray(c.add) ? c.add : []).forEach(id => view.selection.add(selKeyFor(id)));
    (Array.isArray(c.remove) ? c.remove : []).forEach(id => view.selection.delete(selKeyFor(id)));
    applyView(); apiReportSelection();
  } else if (c.kind === 'focus'){
    if (c.mode === 'clear'){ clearFocus(); return; }
    view.focus.key = selKeyFor(c.id);
    view.focus.stage = c.mode === 'neighborhood' ? 2 : 1;
    applyView();
    const m = focusMesh();
    if (m) flyToNode(m);
  } else if (c.kind === 'filter'){
    if (c.clear || !(c.ids || []).length) setFilter('none');
    else setFilter('agent', {ids: c.ids});
  } else if (c.kind === 'fit'){
    if (c.on) fitSelection(); else if (camMark) restoreCamera();
  }
}

/* ids arrive bare from the API; internally they carry a kind prefix. The kind
   is decided by the id's own shape, not by searching the current feed — a
   lookup would mislabel anything that arrives before the first snapshot, or
   any node not currently on screen. */
/* Callers may hand us a short work-item id — the form the cards display, or
   one saved in a tag before the feed carried full ids — so resolve it. */
function fullId(id){
  const s = String(id);
  if (!s.startsWith('wi_')) return s;
  const items = (DATA && DATA.items) || [];
  if (items.some(w => w.id === s)) return s;
  const hit = items.find(w => w.id.startsWith(s + '-'));
  return hit ? hit.id : s;
}

function selKeyFor(id){
  const s = String(id);
  if (s.startsWith('i:') || s.startsWith('a:')) return s;
  return s.startsWith('wi_') ? 'i:' + fullId(s) : 'a:' + s;
}

/* A feed whose ids change shape would strand every key the view holds — the
   selection would empty and a focus would quietly stop highlighting anything,
   with no sign that it had. Re-resolve them whenever a snapshot lands. */
function migrateViewKeys(){
  const remap = k => k.startsWith('i:') ? 'i:' + fullId(k.slice(2)) : k;
  const sel = [...view.selection].map(remap);
  view.selection.clear(); sel.forEach(k => view.selection.add(k));
  if (view.focus.key) view.focus.key = remap(view.focus.key);
  if (view.filter.ids) view.filter.ids = new Set([...view.filter.ids].map(fullId));
}

/* ---------- live feed ---------- */
async function refresh(){
  try {
    const r = await fetch('./data.json?ts='+Date.now(), {cache:'no-store'});
    if (!r.ok) throw 0;
    const d = await r.json();
    if (d.generatedAt === lastGen) return;
    lastGen = d.generatedAt; DATA = d;
    migrateViewKeys();
    const h = d.agents.map(a=>a.id+(a.retired?1:0)+(a.turn||'')).join('|');
    if (h !== agentsHash){ agentsHash = h; buildGround(d.agents); }
    buildItems(d.items);
    buildLinks(d.links);
    applyView();
    spawnWakes(); spawnMessages();
    const age = Math.round((Date.now()-d.generatedAt)/1000);
    const el = document.getElementById('mode');
    el.textContent = 'live · '+d.agents.length+' agents · '+d.items.length+' items · '+age+'s ago';
    el.className = 'live';
  } catch(e){
    if (!DATA){
      DATA = { agents:[{id:'m',name:'Main',kind:'main',parent:null}], items:[], messages:[] };
      buildGround(DATA.agents); buildItems(DATA.items);
      const el = document.getElementById('mode');
      el.textContent='feed unavailable'; el.className='sample';
    }
  }
}

/* ---------- theme toggle ---------- */
addEventListener('keydown', e=>{
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === '/'){ e.preventDefault(); searchEl.focus(); searchEl.select(); return; }
  if (e.key==='c' || e.key==='C'){ apiClearTags(); }
  else if (e.key==='t' || e.key==='T'){ T = T.name==='dark' ? THEMES.light : THEMES.dark; applyTheme(); }
  else if (e.key==='s' || e.key==='S'){ setInputMode(view.input==='brush' ? 'navigate' : 'brush'); }
  else if (e.key==='d' || e.key==='D'){ view.selection.clear(); applyView(); }
  else if (e.key==='f' || e.key==='F' || e.key===' '){
    e.preventDefault(); fitSelection();
  }
  else if (e.key==='l' || e.key==='L'){
    legendUserSet = true;
    document.getElementById('legend').classList.toggle('collapsed');
  }
  else if (e.key==='['){ setRadius(selRadius - Math.max(4, selRadius*.15)); }
  else if (e.key===']'){ setRadius(selRadius + Math.max(4, selRadius*.15)); }
});
matchMedia('(prefers-color-scheme: light)').addEventListener('change', ev=>{
  T = ev.matches ? THEMES.light : THEMES.dark; applyTheme();
});

applyTheme();
refresh(); setInterval(refresh, 5000);
/* a read-only window onto the page's state, for tests and for anything
   driving the view from a console */
window.__atc = {
  /* framing internals, so a fit that looks wrong can be interrogated rather
     than guessed at: which constraint bound, and how much room it asked for */
  clearRect, frameDistance, frameTo, filteredView, neighbourhoodView, pickNode,
  get controls(){ return controls; },
  get view(){ return view; },
  get tags(){ return tags; },
  get data(){ return DATA; },
  get apiUp(){ return apiUp; },
  get scene(){ return scene; },
  get camera(){ return camera; },
  get THREE(){ return THREE; },
  get scope(){ return {items: hiItems && [...hiItems], agents: hiAgents && [...hiAgents]}; },
  inScope,
  pull: apiPull,
};
apiLoop();
setInterval(apiReportSelection, 2000);

/* ---------- click: focus an item, background zooms out ---------- */
let downXY = null;
/* Only the canvas drives the camera. Without this, clicking into the tag box
   or the search field also lands as a background click and clears the focus
   the box is attached to. */
const onCanvas = e => e.target === renderer.domElement;
addEventListener('pointerdown', e=>{ if (view.input==='brush' || !onCanvas(e)) return; downXY=[e.clientX,e.clientY]; });
addEventListener('pointerup', e=>{
  if (view.input==='brush' || !onCanvas(e)) return;
  if (!downXY) return;
  const moved = Math.hypot(e.clientX-downXY[0], e.clientY-downXY[1]); downXY=null;
  if (moved > 6) return;                       /* it was a drag, not a click */
  const o = pickNode(e);
  if (o){
    camMark = null;                       /* the click moved us; the old mark is stale */
    const k = selKey(o);
    if (view.focus.key && view.focus.key === k) view.focus.stage = view.focus.stage === 1 ? 2 : 1;
    else { view.focus.key = k; view.focus.stage = 1; }
    applyView();
    view.framing = 'focus'; userMoved = true;
    flyToNode(o);
  } else if (view.framing !== 'none'){
    camMark = null;
    clearFocus();
    const ang = Math.atan2(camera.position.x, camera.position.z);
    const home = new THREE.Vector3(Math.sin(ang)*66, 34, Math.cos(ang)*66);
    flyTo(home, HOME_TGT, ()=>{
      orbitAngle = ang; orbitR = 66; orbitH = 36; orbitTgt.copy(HOME_TGT);
      userMoved = false;
    });
  } else {
    camMark = null;
    clearFocus();
    /* user had hand-rotated: resume the tabletop spin exactly where they left it */
    const d = camera.position.clone().sub(controls.target);
    orbitR = Math.hypot(d.x, d.z); orbitH = d.y;
    orbitAngle = Math.atan2(d.x, d.z);
    orbitTgt.copy(controls.target);
    userMoved = false;
  }
});

/* A tag, a name label, an orphan ring and a turn shell are all children of the
   node they describe, so hitting any of them means hitting that node. Raycast
   recursively and walk back up to the owner. */
function ownerOf(obj){
  let o = obj;
  while (o && !o.userData?.type) o = o.parent;
  return (o && o.userData.type) ? o : null;
}
function pickNode(ev){
  mouse.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  /* Tags draw with depth testing off, so they appear above everything. Picking
     must follow what is visible, not what is nearest — otherwise clicking a
     tag selects whatever geometry happens to sit in front of it. */
  const sprites = [];
  const collect = m => (m.userData.tagSprites || []).forEach(sp => sprites.push(sp));
  itemMeshes.forEach(collect);
  Object.values(agentMeshes).forEach(collect);
  const tagHit = ray.intersectObjects(sprites, false)[0];
  if (tagHit){
    const owner = ownerOf(tagHit.object);
    if (owner) return owner;
  }
  const hits = ray.intersectObjects([...itemMeshes, ...Object.values(agentMeshes)], true);
  for (const h of hits){
    const owner = ownerOf(h.object);
    if (owner) return owner;
  }
  return null;
}

/* Hover card and focus pane render the same facts; only the surface differs. */
function nodeContent(u, clamp){
  if (u.type === 'item'){
    const w = u.w;
    const segs = SEGS.map((x,i)=>(i<w.stage?'●':'○')+' '+x).join('<br>');
    const acts = Object.entries(w.turns||{}).map(([h,st])=>
      (st==='run'?'▶ ':'⏸ ')+(byId[h]?byId[h].name:h)).join('<br>') || 'no turns active';
    const merged = w.merged === true ? 'in the branch'
                 : w.merged === false ? 'NOT in the branch'
                 : (w.code ? 'branch state unknown' : 'nothing to merge');
    return '<span class="t">' + (w.short || w.id) + '</span>'
      + '<div' + (clamp ? ' class="clamp5"' : '') + '>' + w.title + '</div>'
      + '<span class="k">state</span>' + STAGE_NAMES[w.stage] + ' · ' + merged
      + ((w.holders||[]).length ? '' : ' · ORPHANED')
      + '<span class="k">evidence</span><span class="seg">' + segs + '</span>'
      + '<span class="k">turns</span><span class="seg">' + acts + '</span>'
      /* the pane has room, and this is the id the CLI will accept */
      + (clamp ? '' : '<span class="k">id</span><span class="seg">' + w.id + '</span>');
  }
  const a = u.a;
  const held = ((DATA&&DATA.items)||[]).filter(w=>(w.holders||[]).includes(a.id) && w.stage<6).length;
  const idle = a.idleFor == null ? 'never acted'
    : a.idleFor < 90 ? 'acting now'
    : a.idleFor < 3600 ? Math.round(a.idleFor/60) + ' min idle'
    : Math.round(a.idleFor/3600) + ' h idle';
  return '<span class="t">' + a.name + '</span>'
    + '<span class="k">state</span>' + (a.retired?'retired (holds open cards)':'active') + ' · ' + idle
    + (a.turn==='run'?' · turn running':a.turn==='wait'?' · turn queued':'')
    + '<span class="k">workload</span>' + held + ' open item' + (held===1?'':'s')
    + '<span class="k">id</span><span class="seg">' + a.id + '</span>';
}
const detailEl = document.getElementById('detail');
function renderDetail(){
  const m = view.focus.stage === 1 ? focusMesh() : null;
  if (!m){ detailEl.style.display = 'none'; return; }
  detailEl.innerHTML = nodeContent(m.userData, false);
  detailEl.style.display = 'block';
}

/* ---------- tooltip ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById('tip');
addEventListener('pointermove', e=>{
  const node = pickNode(e);
  if (!node){ tip.style.display='none'; return; }
  const u = node.userData;
  if (!u.type){ tip.style.display='none'; return; }
  if (view.input !== 'brush' && hiAgents){   /* outside the neighbourhood: dead to hover */
    const inside = u.type === 'item' ? hiItems.has(u.w.id) : (u.a && hiAgents.has(u.a.id));
    if (!inside){ tip.style.display='none'; return; }
  }
  tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+10)+'px';
  tip.innerHTML = nodeContent(u, true);
});

/* ---------- select mode ----------
   's' toggles. While on, the camera is frozen and a circular cursor selects
   whatever it touches; the first thing it touches on a drag decides whether the
   stroke selects or deselects. Selection survives leaving the mode. */
let selecting = false, selOp = null, selRadius = 46;
const selCursor = document.getElementById('selcursor');
const selUI = document.getElementById('selui');
const selRad = document.getElementById('selrad');
const _sv = new THREE.Vector3();

function selKey(o){
  const u = o.userData;
  return u.w ? 'i:' + u.w.id : (u.a ? 'a:' + u.a.id : null);
}
function selectables(){
  const out = [];
  itemMeshes.forEach(m => { if (!m.userData.isDisc) out.push(m); });
  Object.values(agentMeshes).forEach(m => out.push(m));
  return out;
}
function screenXY(o){
  _sv.copy(o.position); _sv.project(camera);
  return [(_sv.x*.5+.5)*innerWidth, (-_sv.y*.5+.5)*innerHeight, _sv.z];
}
function shadeSelected(mesh, on){
  const u = mesh.userData;
  u.selected = on;
  if (on){
    if (!u.origMat) u.origMat = mesh.material;
    if (!u.selMat){
      const c = (u.baseStroke || u.baseFill || new THREE.Color(0x999999)).clone();
      u.selMat = new THREE.MeshPhongMaterial({color:c, shininess:26,
                                              specular:new THREE.Color(0x2e2e2e)});
    }
    mesh.material = u.selMat;
    if (u.lineMat) u.lineMat.visible = false;
  } else {
    if (u.origMat) mesh.material = u.origMat;
    if (u.lineMat) u.lineMat.visible = true;
  }
}
/* Full sync of view state to pixels. Call after any state change and after
   every rebuild — meshes are recreated on each five-second refresh, so shading
   cannot be assumed to survive.
   NOT the only writer of pixels, and the comment should not pretend otherwise:
   paintAt() shades the meshes it hits directly as a deliberate fast path (a
   brush stroke can touch hundreds of nodes per frame), and the dim factors are
   applied per frame in tickFrame() because they animate. Both stay consistent
   because every rebuild ends in applyView(). */
function buildTags(){
  /* tags live as children of the node they name, so they inherit its motion */
  selectables().forEach(m => {
    (m.userData.tagSprites || []).forEach(sp => {
      m.remove(sp); sp.material.map?.dispose?.(); sp.material.dispose();
    });
    m.userData.tagSprites = [];
  });
  const byKey = {};
  tags.forEach(t => (byKey[selKeyFor(t.target)] ??= []).push(t));
  selectables().forEach(m => {
    const list = byKey[selKey(m)]; if (!list) return;
    let y = 1.5;
    list.slice(0, 4).forEach(t => {
      const sp = tagSprite(t.text, t.source, t.color || 'neutral', t.author);
      /* stack by actual height: a wrapped tag is two or three lines tall, and a
         fixed step drew the next one straight through it */
      y += sp.scale.y / 2;
      sp.position.set(0, y, 0);
      y += sp.scale.y / 2 + .16;
      m.add(sp); m.userData.tagSprites.push(sp);
    });
  });
}

/* ---------- arrows ----------
   An arrow is an agent's annotation of a RELATION: this card blocks that one,
   this reviewer owns that item. Tags name one node; an arrow names a pair, so
   it carries its own label. Short labels ride the curve, letter by letter —
   sprites, so every glyph faces the viewer however the scene is turned. A long
   one would have to shrink past reading size to fit, so it falls back to the
   same card a tag draws, parked at the apex.

   They draw thicker than tethers on purpose: a tether is the substrate's own
   traffic and should stay quiet, while an arrow is someone pointing. */
let arrows = [], arrowsRev = -1;
const arrowGroup = new THREE.Group();
arrowGroup.renderOrder = 8;
scene.add(arrowGroup);

const glyphCache = new Map();
function glyphTexture(ch, hex){
  const key = ch + '|' + hex + '|' + T.name;
  const hit = glyphCache.get(key);
  if (hit) return hit;
  const font = '700 44px ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif';
  const c = document.createElement('canvas'), m = c.getContext('2d');
  m.font = font;
  const w = Math.max(10, Math.ceil(m.measureText(ch).width));
  c.width = w + 14; c.height = 60;
  const g = c.getContext('2d');
  g.font = font; g.textBaseline = 'middle';
  /* a halo in the card colour, so a letter crossing a bright node still reads */
  g.lineJoin = 'round'; g.lineWidth = 8; g.strokeStyle = T.tagHalo || T.tagBg;
  g.strokeText(ch, 7, 31);
  g.fillStyle = hex; g.fillText(ch, 7, 31);
  const tx = new THREE.CanvasTexture(c);
  tx.userData = {aspect: c.width / c.height, advance: w / 60};
  glyphCache.set(key, tx);
  return tx;
}

/* the arc between two nodes: lifted out of the chord so it reads as a curve,
   and bowed sideways by rank so a second arrow over the same pair is visible */
function arrowCurve(a, b, rank){
  const mid = a.clone().add(b).multiplyScalar(.5);
  const d = b.clone().sub(a), len = d.length();
  const side = new THREE.Vector3().crossVectors(d, ARROW_UP);
  if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
  side.normalize();
  mid.addScaledVector(ARROW_UP, len * .17 + 1.1)
     .addScaledVector(side, ((rank % 2 ? 1 : -1) * Math.ceil(rank / 2)) * len * .13);
  return new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone());
}
const ARROW_UP = new THREE.Vector3(0, 1, 0);
const ARROW_SEGS = 46;

function arrowEndpoints(ar){
  const from = meshForKey(selKeyFor(ar.from)), to = meshForKey(selKeyFor(ar.to));
  if (!from || !to) return null;
  const a = from.getWorldPosition(new THREE.Vector3());
  const b = to.getWorldPosition(new THREE.Vector3());
  /* stop short of both nodes so the head is visible and the tail is not buried */
  const dir = b.clone().sub(a).normalize();
  return {a: a.addScaledVector(dir, 1.05), b: b.addScaledVector(dir, -1.35),
          fromId: from.userData.w ? from.userData.w.id : from.userData.a?.id,
          toId:   to.userData.w   ? to.userData.w.id   : to.userData.a?.id};
}

function meshForKey(k){
  return selectables().find(m => selKey(m) === k) || null;
}

function buildArrows(){
  while (arrowGroup.children.length){
    const g = arrowGroup.children.pop();
    g.traverse(o => {
      o.geometry?.dispose?.();
      if (o.material){ edgeMats.delete(o.material); o.material.dispose?.(); }
    });
  }
  const rank = {};
  arrows.forEach(ar => {
    const ends = arrowEndpoints(ar);
    if (!ends) return;                       /* an endpoint that is not on screen */
    const pairKey = [ar.from, ar.to].sort().join('>');
    const r = (rank[pairKey] = (rank[pairKey] || 0) + 1) - 1;
    const hex = (T.tag && T.tag[ar.color]) || T.tag.neutral;
    const curve = arrowCurve(ends.a, ends.b, r);
    const g = new THREE.Group();
    g.userData = {ar, rank: r, fromId: ends.fromId, toId: ends.toId, mats: [], sprites: []};

    const pts = curve.getPoints(ARROW_SEGS);
    const pos = [];
    for (let i = 0; i < pts.length - 1; i++)
      pos.push(pts[i].x, pts[i].y, pts[i].z, pts[i+1].x, pts[i+1].y, pts[i+1].z);
    const lg = new LineSegmentsGeometry(); lg.setPositions(pos);
    const lm = new LineMaterial({color: hex, linewidth: 4.2, transparent: true,
                                 opacity: .95, depthTest: false});
    lm.resolution.set(innerWidth, innerHeight);
    lm.userData.base = .95;
    edgeMats.add(lm);
    const line = new LineSegments2(lg, lm);
    line.renderOrder = 8;
    g.add(line); g.userData.mats.push(lm); g.userData.line = line;

    /* head: a cone sitting on the last tangent */
    const head = new THREE.Mesh(new THREE.ConeGeometry(.42, 1.25, 14),
      new THREE.MeshBasicMaterial({color: hex, transparent: true, opacity: .95, depthTest: false}));
    head.material.userData.base = .95;
    head.renderOrder = 9;
    g.add(head); g.userData.mats.push(head.material); g.userData.head = head;

    if (ar.text){
      const glyphs = [...ar.text];
      const H = .68;                                    /* glyph height, world */
      const advances = glyphs.map(ch => glyphTexture(ch, hex).userData.advance * H + .06);
      const need = advances.reduce((x, y) => x + y, 0);
      if (need <= curve.getLength() * .74 && glyphs.length <= 42){
        let run = 0;
        glyphs.forEach((ch, i) => {
          const tx = glyphTexture(ch, hex);
          const sp = new THREE.Sprite(new THREE.SpriteMaterial({
            map: tx, transparent: true, depthTest: false }));
          sp.scale.set(H * tx.userData.aspect, H, 1);
          sp.renderOrder = 13;
          sp.userData.at = (run + advances[i] / 2);      /* distance along the run */
          run += advances[i];
          g.add(sp); g.userData.sprites.push(sp); g.userData.mats.push(sp.material);
        });
